<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Voxel Glider</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 5px;
            background: linear-gradient(to bottom, #ffcc00, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(255, 0, 255, 0.5);
        }

        p {
            font-size: 1.5rem;
            color: #00ffff;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: #00ffff;
            display: none;
            text-shadow: 0 0 5px #00ffff;
        }

        #biome-display {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 1.2rem;
            color: #ff00ff;
            display: none;
            text-shadow: 0 0 5px #ff00ff;
        }

        #danger-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            color: #ff4444;
            text-shadow: 0 0 12px #ff0000;
            display: none;
            pointer-events: none;
            z-index: 15;
        }

        #start-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.5rem;
            background: rgba(255, 0, 255, 0.2);
            border: 2px solid #ff00ff;
            color: #fff;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        #start-btn:hover {
            background: #ff00ff;
            color: #000;
            box-shadow: 0 0 20px #ff00ff;
        }

        #crash-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="score-display">SCORE: 0</div>
    <div id="biome-display">SECTOR: DEEP WEB</div>
    <div id="danger-display">DANGER!</div>

    <div id="ui-layer">
        <div id="main-menu">
            <h1>NEON VOXEL GLIDER</h1>
            <p>Travel through the Digital Infinite.</p>
            <p style="font-size: 1rem; color: #fff;">(Mouse to Steer. Do not crash.)</p>
            <div style="display: flex; justify-content: center; pointer-events: auto;"><label style="display: flex; gap: 0.5rem; align-items: center;"><input type="checkbox" id="invert-pitch" checked onclick="player.invertPitch = this.checked;"/> Invert Pitch</label></div>

            <button id="start-btn">INITIATE FLIGHT</button>
        </div>
    </div>

    <div id="crash-overlay">
        <h1 style="color:red; -webkit-text-fill-color: red;">SYSTEM FAILURE</h1>
        <p id="final-score">SCORE: 0</p>
        <button id="restart-btn" style="
            padding: 15px 40px;
            font-size: 1.5rem;
            background: black;
            border: 2px solid red;
            color: red;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
        ">REBOOT</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            viewDistance: 100,
            voxelSize: 3,
            speed: 60,
            camSmoothness: 0.1,
            gridWidth: 50,
            gridHeight: 50,
            gridDepth: 60,
            biomeLength: 2500
        };

        // --- GLOBAL STATE ---
        let scene, camera, renderer, clock;
        let voxelMesh;
        let dummy = new THREE.Object3D();
        let voxelColorHelper = new THREE.Color();
        let voxels = [];
        
        // Voxel-art props
        let warningLightMesh;
        let warningLights = [];
        let waterMesh, waterMaterial, waterBasePositions;
        let waterBaseHSL = { h: 0, s: 0, l: 0 };
        let tunnelDebrisMesh, tunnelDebris = [];
        let cityNeonMesh, cityNeons = [];
        let cityIndustrialMesh, cityIndustrials = [];
        let miningDrone, miningDroneLeft, miningDroneRight;
        let miningDroneExplosionMesh, miningDroneExploding = false, miningDroneExplosionTime = 0;
        let miningDroneDestroyed = false;
        let miningDroneActivated = false;
        let attackDrone, attackDroneBullets = [];
        let attackDroneState = 'idle';
        let attackDroneTimer = 0;
        let attackDroneShotsFired = 0;
        let attackDroneActive = false;
        let attackDroneIsTargetingGlider = false;
        let attackDroneCityEngages = 0;
        let attackDroneCityMaxEngages = 0;
        let lastCityAttackTime = -Infinity;
        let attackTargetLastPos = new THREE.Vector3();
        let attackTargetVel = new THREE.Vector3();
        let attackTargetHasPrev = false;
        let attackTargetLastType = 'none';
        let menuSun;
        // Run-time world randomization
        let runPathPhase = 0;
        let runNoiseOffset = 0;
        let isMenuPreview = false;
        let isLiftOff = false;
        let liftOffTime = 0;
        let player = {
            mesh: null,
            invertPitch: document.getElementById('invert-pitch').checked,
            velocity: new THREE.Vector3(),
            position: new THREE.Vector3(0, 0, 0),
            rotation: new THREE.Vector3(),
            isDead: false,
            score: 0
        };
        let mouse = { x: 0, y: 0 };
        let isPlaying = false;
        let animationId;
        let currentBiomeName = "";

        // --- BIOME DEFINITIONS ---
        const BIOMES = [
            {
                name: "DEEP WEB TUNNEL",
                fog: 0x05000a, // Almost black
                colorBase: { h: 0.0, s: 0.0, l: 0.13 }, // Dark Grey base
                type: 'tunnel'
            },
            {
                name: "SEDIMENT CANYON",
                fog: 0x2b1b12,
                colorBase: { h: 0.06, s: 0.85, l: 0.38 },
                type: 'canyon'
            },
            {
                name: "MARBLE GARDENS",
                fog: 0xf5f8ff,
                colorBase: { h: 0.1, s: 0.08, l: 0.88 },
                type: 'gardens'
            },
            {
                name: "NEON CYBER CITY",
                fog: 0x02040a,
                colorBase: { h: 0.6, s: 0.65, l: 0.07 },
                type: 'city'
            },
            {
                name: "SKELETAL STRUCTURE",
                fog: 0x660000, // Intense Red
                colorBase: { h: 0.0, s: 0.0, l: 0.05 }, // Black/Dark
                type: 'skeletal'
            }
        ];

        // --- 3D NOISE & MATH ---
        // Each run uses a different path phase and noise offset
        function randomizeRunSeed() {
            runPathPhase = performance.now() * Math.PI * 2;
            runNoiseOffset = performance.now() * 10000;
        }

        function hash3(x, y, z) {
            x = Math.floor(x); y = Math.floor(y); z = Math.floor(z);
            let h = (x * 374761393 + y * 668265263 + z * 393555907) ^ 0x55555555;
            h = (h ^ (h >> 13)) * 1274126177;
            return (h ^ (h >> 16)) / 2147483647;
        }

        function noise3D(x, y, z) {
            // Apply run-specific offset so each playthrough samples a different slice of noise space
            x += runNoiseOffset;
            y += runNoiseOffset;
            z += runNoiseOffset;
            let ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
            let fx = x - ix, fy = y - iy, fz = z - iz;
            fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);

            let c000 = hash3(ix, iy, iz); let c100 = hash3(ix + 1, iy, iz);
            let c010 = hash3(ix, iy + 1, iz); let c110 = hash3(ix + 1, iy + 1, iz);
            let c001 = hash3(ix, iy, iz + 1); let c101 = hash3(ix + 1, iy, iz + 1);
            let c011 = hash3(ix, iy + 1, iz + 1); let c111 = hash3(ix + 1, iy + 1, iz + 1);

            let lerp = (a, b, t) => a + t * (b - a);
            return lerp(lerp(lerp(c000, c100, fx), lerp(c010, c110, fx), fy),
                lerp(lerp(c001, c101, fx), lerp(c011, c111, fx), fy), fz);
        }

        // --- TERRAIN GENERATION LOGIC ---

        function getSafePath(z) {
            const freq = 0.005;
            const phaseZ = z * freq + runPathPhase;
            const x = Math.sin(phaseZ) * 80 + Math.cos(phaseZ * 2.3) * 40;
            const y = Math.cos(phaseZ * 1.5) * 40 + Math.sin(phaseZ * 0.5) * 20;
            return { x, y };
        }

        // Stylized menu preview: static neon-synth abstract landscape (not tied to biomes)
        function updateMenuPreview() {
            isMenuPreview = true;
            // Deep violet synth fog
            const neonFog = 0x050016;
            if (scene && scene.fog) {
                scene.fog.color.set(neonFog);
            }
            if (scene && scene.background) {
                scene.background.set(neonFog);
            }

            // Static cinematic camera framing an abstract voxel wasteland near the grid center
            camera.position.set(0, 70, 220);
            camera.lookAt(0, -5, 60);

            // Stylized synthwave sunset disk on the horizon
            if (menuSun) {
                menuSun.position.set(0, 10, -40);
                menuSun.scale.set(1.4, 1.4, 1);
                if (menuSun.material && menuSun.material.color) {
                    menuSun.material.color.set(0xff6699);
                }
                // Ensure the sun is always rendered over fog as a flat glow
                menuSun.material.fog = false;
            }

            if (player.mesh) {
                player.mesh.visible = false;
            }
        }

        // Render abstract neon-synth voxel landscape for menu (independent of game state)
        function updateMenuAbstractVoxels() {
            if (!voxelMesh) return;

            const step = CONFIG.voxelSize;
            const floorY = -50;
            const maxY = 80;

            voxels.forEach(v => {
                const worldX = v.vx * step;
                const worldY = v.vy * step;
                const worldZ = v.vz * step;

                // Skip outside vertical band
                if (worldY < floorY || worldY > maxY) {
                    dummy.scale.set(0, 0, 0);
                    dummy.position.set(worldX, worldY, worldZ);
                    dummy.updateMatrix();
                    voxelMesh.setMatrixAt(v.id, dummy.matrix);
                    return;
                }

                // Abstract height field: glowing ruins + horizon ridges
                const radial = Math.sqrt(worldX * worldX + (worldZ - 40) * (worldZ - 40));
                const wave = 15 + 10 * Math.sin(radial * 0.08);
                const ridge = 35 * Math.exp(-Math.pow((worldZ - 70) / 55, 2));
                const height = wave + ridge;
                
                if (worldY <= height) {
                    dummy.position.set(worldX, worldY, worldZ);
                    dummy.scale.set(1, 1, 1);

                    // Neon gradient: magenta near center, cyan towards edges, brighter near the top
                    const tHeight = THREE.MathUtils.clamp((worldY - floorY) / (maxY - floorY), 0, 1);
                    const tHoriz = THREE.MathUtils.clamp(Math.abs(worldX) / 90, 0, 1);
                    const hue = 0.83 - 0.33 * tHoriz; // ~magenta -> cyan
                    const light = 0.22 + 0.4 * tHeight;
                    voxelColorHelper.setHSL(hue, 1.0, light);
                    voxelMesh.setColorAt(v.id, voxelColorHelper);
                } else {
                    dummy.position.set(worldX, worldY, worldZ);
                    dummy.scale.set(0, 0, 0);
                }

                dummy.updateMatrix();
                voxelMesh.setMatrixAt(v.id, dummy.matrix);
            });

            voxelMesh.instanceMatrix.needsUpdate = true;
            if (voxelMesh.instanceColor) voxelMesh.instanceColor.needsUpdate = true;
        }

        // 1. TUNNEL: collapsed sections, base shape (debris now handled as separate voxel props)
        function getTunnelDensity(x, y, z) {
            const scale = 0.025;
            // Base organic shape
            let n = noise3D(x * scale, y * scale, z * scale);
            n += noise3D(x * scale * 2, y * scale * 2, z * scale * 2) * 0.5;

            const path = getSafePath(z);
            const relY = y - path.y;

            // Collapsed side tunnels (subtract density further from center)
            const collapseNoise = noise3D(x * 0.01, y * 0.01, z * 0.005);
            if (collapseNoise > 0.5 && Math.abs(x - path.x) > 35) {
                n -= 0.8; // Carve out big chunks
            }

            return n;
        }

        // Biome density logic
        function getCanyonDensity(x, y, z) {
            const path = getSafePath(z);
            const canyonHalf = 38;
            let den = (Math.abs(x - path.x) - canyonHalf) * 0.08;

            // Stratified cliffs and ledges
            const strat = noise3D(x * 0.02, y * 0.05, z * 0.01) * 1.2;
            den += strat;
            const overhang = Math.max(0, noise3D(x * 0.05, z * 0.05, y * 0.02) - 0.55) * 3.0;
            den += overhang;

            // Ground fill
            if (y < path.y - 55) den += 2.4;

            // Carve winding water stream
            const streamX = path.x + Math.sin(z * 0.01) * 10;
            const streamWidth = 10 + noise3D(z * 0.02, 0, 0) * 5;
            const streamBed = path.y - 52 - noise3D(x * 0.01, z * 0.01, 0) * 6;
            if (Math.abs(x - streamX) < streamWidth) {
                const depth = 1 - Math.min(1, Math.abs(y - streamBed) / 10);
                den -= depth * 3.2;
            }

            // Side spires for dramatic cliffs
            const spireNoise = noise3D((x + z) * 0.02, (x - z) * 0.02, 0);
            if (Math.abs(x - path.x) > canyonHalf * 1.1 && spireNoise > 0.67) {
                const spireHeight = path.y + 20 + spireNoise * 120;
                if (y < spireHeight) den += 0.8 + spireNoise;
            }
            return den;
        }
        function getCityDensity(x, y, z) {
            const path = getSafePath(z);
            let den = -1.0;

            // 1. THE TRENCH (Hyper-clean cut)
            const distFromPath = Math.abs(x - path.x);
            const trenchWidth = 18; // Narrower, more claustrophobic trench

            // 2. GIGANTIC MONOLITHS
            // Use a very large grid for the main towers
            const blockSize = 120; // Massive footprint
            const bx = Math.floor(x / blockSize);
            const bz = Math.floor(z / blockSize);
            const blockHash = hash3(bx, 0, bz);

            // Tower properties
            const towerHeight = 300 + blockHash * 1200; // Massively tall towers (up to 1500 units)

            // "Slick" Geometry: Smooth, tapering, or rounded forms
            // Instead of simple blocks, let's make them chamfered or slightly tapered
            const localX = Math.abs((x % blockSize) - blockSize / 2);
            const localZ = Math.abs((z % blockSize) - blockSize / 2);

            // Taper factor: Towers get slightly thinner at the top
            const taper = 1.0 - (y / 1600) * 0.3;
            const buildingWidth = (blockSize * 0.4 + blockHash * 5) * taper;

            // Smooth intersection for rounded corners (SDF-like)
            // max(abs(x), abs(z)) is a square. length(x,z) is a circle.
            // Let's mix them for a "squircle" or rounded box look
            const dSquare = Math.max(localX, localZ);
            const dCircle = Math.sqrt(localX * localX + localZ * localZ);
            const shapeDist = dSquare * 0.2 + dCircle * 0.8; // Mostly rounded/cylindrical for "slickness"

            if (shapeDist < buildingWidth) {
                if (y < towerHeight) {
                    den = 1.0;

                    // "Slick" indentations (vertical grooves)
                    // Low frequency, clean lines
                    const groove = Math.sin(Math.atan2(x % blockSize - blockSize / 2, z % blockSize - blockSize / 2) * 8);
                    if (groove > 0.95) {
                        den -= 0.5; // Deep vertical cuts
                    }
                }
            }

            // 3. CONNECTING MEGA-STRUCTURES
            // Large horizontal bars connecting towers high up
            if (y > 100 && y < 800) {
                // Check if we are in a "bridge zone"
                const bridgeZone = Math.abs((y % 200) - 100) < 15;
                if (bridgeZone) {
                    // Connect along X or Z axes
                    const bridgeWidth = 20;
                    if (localX < bridgeWidth || localZ < bridgeWidth) {
                        den = 1.0;
                    }
                }
            }

            // 4. TRENCH CLEARANCE
            if (distFromPath < trenchWidth) {
                if (y > path.y - 120 && y < path.y + 200) {
                    den = -1.0;
                }
            }

            // 5. FLOOR
            // A solid floor deep below
            if (y < path.y - 120) {
                den = 1.0;
                // Add some texture to the floor
                if (noise3D(x * 0.05, 0, z * 0.05) > 0.2) {
                    den += 0.5;
                }
            }

            return den;
        }
        function getGardenDensity(x, y, z) {
            const path = getSafePath(z);
            const meadow = path.y - 10 + noise3D(x * 0.015, 0, z * 0.015) * 12;
            let den = -0.5;

            if (y < meadow) {
                const soilDepth = meadow - y;
                den = 0.4 + soilDepth * 0.05;
                den += noise3D(x * 0.05, y * 0.05, z * 0.05) * 0.4; // lush shrubs
            }

            const colSpacing = 70;
            const gridX = Math.abs((x + colSpacing / 2) % colSpacing - colSpacing / 2);
            const gridZ = Math.abs((z + colSpacing / 2) % colSpacing - colSpacing / 2);
            if (gridX < 6 && gridZ < 6 && y < path.y + 70) {
                den += 1.2; // marble pillars
            }

            const ceiling = path.y + 80 + Math.sin(z * 0.003) * 6;
            if (y > ceiling) {
                den += 3.0;
            } else if (y > ceiling - 6) {
                den += (6 - (ceiling - y)) * 0.6; // thicken ceiling edge
            }

            return den;
        }

        function getSkeletalDensity(x, y, z) {
            const path = getSafePath(z);
            let den = -1.0;

            // 0. Constriction (Narrow Passages)
            const constrictionNoise = noise3D(z * 0.005, 0, 0);
            let safeRadius = 25;
            if (constrictionNoise > 0.4) {
                safeRadius = 14 + (1 - constrictionNoise) * 10;
            }

            // 1. ALIEN GYROID STRUCTURES (The "Megastructure")
            // Math: sin(x) * cos(y) + sin(y) * cos(z) + sin(z) * cos(x)
            // We scale inputs to make them massive
            const scale = 0.025;
            const gx = x * scale;
            const gy = y * scale;
            const gz = z * scale;

            // Distort the coordinates for a "melting" or "organic" look
            const warp = noise3D(gx * 0.5, gy * 0.5, gz * 0.5) * 2.0;

            const val = Math.sin(gx + warp) * Math.cos(gy) +
                Math.sin(gy + warp) * Math.cos(gz) +
                Math.sin(gz) * Math.cos(gx + warp);

            // Create a "shell" or "surface" around 0
            // Thickness determines how solid it is
            const thickness = 0.15;
            if (Math.abs(val) < thickness) {
                den = 2.0;

                // Add "Tech" texture to the surface
                if (noise3D(x * 0.2, y * 0.2, z * 0.2) > 0.3) {
                    den += 0.5; // Plates
                } else {
                    den -= 0.2; // Grooves
                }
            }

            // 2. MASSIVE SPIKES / THORNS
            // Protruding from the gyroid surfaces
            if (Math.abs(val) < thickness * 3) { // Near the surface
                const spikeNoise = noise3D(x * 0.04, y * 0.04, z * 0.04);
                if (spikeNoise > 0.65) {
                    // Sharp, needle-like density
                    den += 1.5;
                }
            }

            // 3. FLOATING DATA ORBS
            // Scattered massive spheres
            const orbScale = 150;
            const ox = Math.floor(x / orbScale);
            const oy = Math.floor(y / orbScale);
            const oz = Math.floor(z / orbScale);
            const orbHash = hash3(ox, oy, oz);

            if (orbHash > 0.92) {
                const orbX = (ox + 0.5) * orbScale;
                const orbY = (oy + 0.5) * orbScale;
                const orbZ = (oz + 0.5) * orbScale;
                const distToOrb = Math.sqrt((x - orbX) ** 2 + (y - orbY) ** 2 + (z - orbZ) ** 2);

                if (distToOrb < 35) { // 70 unit diameter
                    den = 3.0; // Solid core
                    // "Death Star" trench
                    if (Math.abs(y - orbY) < 3) den = -1.0;
                }
            }

            // 4. CHAOTIC CABLES (Connecting everything)
            const cableWarp = noise3D(x * 0.01, y * 0.01, z * 0.01) * 30;
            const cableNoise = noise3D((x + cableWarp) * 0.02, (y + cableWarp) * 0.02, z * 0.02);
            if (Math.abs(cableNoise) < 0.06) {
                den += 1.2;
            }

            // Ensure path is clear(ish)
            const distFromPath = Math.sqrt((x - path.x) ** 2 + (y - path.y) ** 2);
            if (distFromPath < safeRadius) {
                den = -1.0;
            }

            return den;
        }

        // Collapsed tunnel wall obstacles: narrow safe radius at specific z-bands
        function getTunnelObstacleFactor(z) {
            const half = CONFIG.biomeLength * 0.5;
            const zLoop = ((z % CONFIG.biomeLength) + CONFIG.biomeLength) % CONFIG.biomeLength;
            const bands = [half * 0.35, half * 0.75, half * 1.15, half * 1.55];
            let maxFactor = 0;
            // Longer bands along Z for extended collapsed sections
            const width = 180;
            for (let i = 0; i < bands.length; i++) {
                const dz = Math.abs(zLoop - bands[i]);
                if (dz < width) {
                    const f = 1 - dz / width;
                    if (f > maxFactor) maxFactor = f;
                }
            }
            return maxFactor;
        }

        function getDensity(x, y, z) {
            const totalBiomes = BIOMES.length;
            const zScaled = z / CONFIG.biomeLength;
            let biomeIndex = Math.floor(zScaled) % totalBiomes;
            if (biomeIndex < 0) biomeIndex += totalBiomes;
            const nextBiomeIndex = (biomeIndex + 1) % totalBiomes;
            const progress = zScaled - Math.floor(zScaled);
            let blend = 0;
            if (progress > 0.85) blend = (progress - 0.85) * 6.66;

            const typeA = BIOMES[biomeIndex].type;
            const typeB = BIOMES[nextBiomeIndex].type;

            // Safe Path Logic (with optional tunnel obstacles)
            const path = getSafePath(z);
            const distSq = (x - path.x) ** 2 + (y - path.y) ** 2;
            // Standard safety radius, shrunk inside collapsed tunnel segments
            let safetyRadius = 25;
            if (typeA === 'tunnel' || typeB === 'tunnel') {
                const obstacleFactor = getTunnelObstacleFactor(z);
                if (obstacleFactor > 0) {
                    // Shrink radius down to ~40% (area ~16%) at peak of obstacle
                    const minShrink = 0.4;
                    const shrink = minShrink + (1 - minShrink) * (1 - obstacleFactor);
                    safetyRadius *= shrink;
                }
            }
            if (distSq < safetyRadius * safetyRadius) return -1.0;

            const calcDen = (type, tx, ty, tz) => {
                if (type === 'tunnel') return getTunnelDensity(tx, ty, tz);
                if (type === 'canyon') return getCanyonDensity(tx, ty, tz);
                if (type === 'city') return getCityDensity(tx, ty, tz);
                if (type === 'gardens') return getGardenDensity(tx, ty, tz);
                if (type === 'skeletal') return getSkeletalDensity(tx, ty, tz);
                return 0;
            };

            let denA = calcDen(typeA, x, y, z);
            let denB = (blend > 0) ? calcDen(typeB, x, y, z) : denA;
            let finalDen = denA * (1 - blend) + denB * blend;

            // Far Distance Cull
            const distFromPath = Math.sqrt(distSq);
            if (distFromPath > CONFIG.viewDistance) finalDen -= 1.0;

            return finalDen;
        }

        // Raycast helper to check for voxel obstructions
        function checkVoxelLineOfSight(start, end) {
            const dist = start.distanceTo(end);
            const step = 4.0; // Step size slightly smaller than voxel size (5.0)
            const steps = Math.floor(dist / step);
            const dir = new THREE.Vector3().subVectors(end, start).normalize();
            const temp = new THREE.Vector3();

            // Start at 1 to avoid checking the drone's own position
            // End before the very last step to avoid checking the target's exact center (which might be inside a hitbox)
            for (let i = 1; i < steps; i++) {
                temp.copy(start).add(dir.clone().multiplyScalar(i * step));
                // 0.1 is the visual threshold used in updateVoxels
                if (getDensity(temp.x, temp.y, temp.z) > 0.1) {
                    return false; // Blocked
                }
            }
            return true; // Clear
        }

        // --- AUDIO ENGINE ---
        const AudioEngine = (() => {
            let ctx, masterGain;
            let nextNoteTime = 0;
            let beatCount = 0;
            let droneFilter;

            // Cached state from the game for generative logic
            const defaultState = {
                biomeType: 'tunnel',
                geoIntensity: 0,
                combatDanger: 0,
                hasWater: false,
                hasTunnelLights: false,
                hasCityNeon: false,
                hasGardens: false,
                hasSkeletal: false,
                miningDroneAlive: false,
                miningDroneExploding: false,
                miningDroneDestroyed: false,
                attackDroneActive: false,
                attackDroneState: 'idle',
                attackDroneIsTargetingGlider: false
            };
            let lastState = { ...defaultState };
            let prevState = { ...defaultState };

            const BIOME_SCALES = {
                tunnel: [130.81, 155.56, 174.61, 196.0, 233.08], // C minor-ish
                canyon: [130.81, 138.59, 164.81, 196.0, 207.65], // C Dorian-ish
                city: [146.83, 174.61, 196.0, 220.0, 261.63],  // D minor-ish
                gardens: [146.83, 185.0, 220.0, 246.94, 293.66], // D Lydian-ish
                skeletal: [123.47, 130.81, 155.56, 174.61, 207.65] // B Locrian-ish (Dark/Dissonant)
            };

            // Central mixer configuration so layer loudness and density are easy to tweak
            const MIXER = {
                master: 0.35,
                layers: {
                    drone: 0.07,
                    baseMelody: 0.15,
                    pedal: 0.15,
                    tunnelTicks: 0.03,
                    water: 0.18,
                    miningMotif: 0.22,
                    attackStabs: 0.28,
                    cityNeon: 0.25,
                    gardens: 0.25,
                    skeletal: 0.35, // Loud, heavy impacts
                    volleyStart: 0.32,
                    miningExplosion: 0.3,
                    nearMiss: 0.3
                },
                probs: {
                    baseMelodyBase: 0.2,
                    tunnelTicksBase: 0.3,
                    waterBase: 0.6,
                    cityNeonBase: 0.5,
                    gardensBase: 0.3,
                    skeletalBase: 0.25,
                    attackStabsBase: 0.45
                },
                proximitySensitivity: 0.5
            };

            let currentScale = BIOME_SCALES.tunnel;

            function init() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                ctx = new AudioContext();
                masterGain = ctx.createGain();
                masterGain.gain.value = MIXER.master;
                masterGain.connect(ctx.destination);
                createDrone();
                scheduleNextNote();
            }

            function createDrone() {
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = 65.41; // C2
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 200;
                droneFilter = filter;
                const gain = ctx.createGain();
                gain.gain.value = MIXER.layers.drone;
                const lfo = ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.1;
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 50;
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);
                osc.start();
                lfo.start();
            }

            function playNoteCore(freq, time, duration, opts = {}) {
                if (!ctx) return;
                const osc = ctx.createOscillator();
                osc.type = opts.type || 'triangle';
                osc.frequency.value = freq;

                const gain = ctx.createGain();
                const attack = opts.attack || 0.05;
                const peakGain = opts.gain != null ? opts.gain : 0.1;
                const release = opts.release || duration;

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(peakGain, time + attack);
                gain.gain.exponentialRampToValueAtTime(0.001, time + release);

                const panner = ctx.createStereoPanner();
                const pan =
                    typeof opts.pan === 'number'
                        ? opts.pan
                        : (Math.random() * 2) - 1;
                panner.pan.setValueAtTime(pan, time);

                const delay = ctx.createDelay();
                delay.delayTime.value = opts.delayTime != null ? opts.delayTime : 0.25;
                const delayGain = ctx.createGain();
                delayGain.gain.value = opts.delayGain != null ? opts.delayGain : 0.3;

                osc.connect(gain);
                gain.connect(panner);
                panner.connect(masterGain);
                if (!opts.noEcho) {
                    panner.connect(delay);
                    delay.connect(delayGain);
                    delayGain.connect(delay);
                    delayGain.connect(masterGain);
                }

                osc.start(time);
                osc.stop(time + duration + 1);
            }

            function playNote(freq, time, duration) {
                playNoteCore(freq, time, duration, {});
            }

            function computeCombinedIntensity(state) {
                return Math.max(
                    0,
                    Math.min(
                        1,
                        state.geoIntensity * 0.6 * MIXER.proximitySensitivity + state.combatDanger * 0.9
                    )
                );
            }

            function applyContinuousState() {
                if (!ctx || !droneFilter) return;
                const state = lastState || defaultState;
                const combinedIntensity = computeCombinedIntensity(state);
                const targetFreq = 200 + Math.sqrt(combinedIntensity) * 2500;
                droneFilter.frequency.setTargetAtTime(
                    targetFreq,
                    ctx.currentTime,
                    0.08
                );
            }

            function scheduleMiningDroneExplosion(time) {
                // Descending, slightly dissonant cadence
                const base = currentScale[0] || 130.81;
                const g = MIXER.layers.miningExplosion;
                playNoteCore(base * 2, time, 0.4, {
                    type: 'sawtooth',
                    gain: g,
                    pan: 0,
                    delayGain: 0.25
                });
                playNoteCore(base * 1.5, time + 0.15, 0.6, {
                    type: 'sawtooth',
                    gain: g * 0.9,
                    pan: -0.2
                });
                playNoteCore(base, time + 0.35, 0.9, {
                    type: 'triangle',
                    gain: g * 0.8,
                    pan: 0.15
                });
            }

            function scheduleVolleyStartHit(time) {
                const base = currentScale[currentScale.length - 1] || 196.0;
                playNoteCore(base * 3, time, 0.25, {
                    type: 'square',
                    gain: MIXER.layers.volleyStart,
                    pan: 0,
                    noEcho: true,
                    attack: 0.01,
                    release: 0.2
                });
            }

            function scheduleNextNote() {
                if (!ctx) return;
                const secondsPerBeat = 0.25;
                const lookahead = 0.1;

                if (isPlaying && ctx.currentTime + lookahead >= nextNoteTime) {
                    const state = lastState || defaultState;
                    const time = nextNoteTime;

                    // Combined danger drives harmonic tension and brightness
                    const combinedIntensity = computeCombinedIntensity(state);

                    // Base melodic notes ÔÇô sparser at rest, denser in danger
                    const baseProb =
                        MIXER.probs.baseMelodyBase +
                        state.geoIntensity * 0.25 +
                        state.combatDanger * 0.3;
                    if (beatCount % 2 === 0 && Math.random() < baseProb) {
                        const noteIdx = Math.floor(Math.random() * currentScale.length);
                        const octave =
                            Math.random() > (state.combatDanger > 0.5 ? 0.6 : 0.8)
                                ? 2
                                : 1;
                        playNoteCore(
                            currentScale[noteIdx] * octave,
                            time,
                            0.4,
                            { gain: MIXER.layers.baseMelody }
                        );
                    }

                    // Occasional low pedal note to anchor harmony
                    if (beatCount % 8 === 0 && Math.random() < 0.9) {
                        playNoteCore(
                            currentScale[0] / 2,
                            time,
                            0.9,
                            { gain: MIXER.layers.pedal }
                        );
                    }

                    // Tunnel warning lights: bright ticks hugging the walls
                    if (state.hasTunnelLights && state.biomeType === 'tunnel') {
                        const tickProb =
                            MIXER.probs.tunnelTicksBase + state.geoIntensity * 0.4;
                        if (Math.random() < tickProb) {
                            const high = currentScale[currentScale.length - 1] * 4;
                            const pan = Math.random() < 0.5 ? -0.7 : 0.7;
                            playNoteCore(high, time, 0.18, {
                                type: 'square',
                                gain:
                                    MIXER.layers.tunnelTicks *
                                    (0.7 + state.geoIntensity * 0.8),
                                pan,
                                noEcho: true,
                                attack: 0.01,
                                release: 0.16
                            });
                        }
                    }

                    // Canyon water: soft, wide ripples underneath
                    if (state.hasWater && state.biomeType === 'canyon') {
                        const waterProb = MIXER.probs.waterBase;
                        if (Math.random() < waterProb) {
                            const root = currentScale[0];
                            const wobble = (Math.random() * 0.12) - 0.06;
                            playNoteCore(root * (1 + wobble), time, 1.0, {
                                type: 'sine',
                                gain: MIXER.layers.water,
                                pan: 0,
                                delayTime: 0.35,
                                delayGain: 0.35,
                                attack: 0.08,
                                release: 1.2
                            });
                        }
                    }

                    // Mining drone: friendly motif guiding the player
                    if (state.miningDroneAlive && !state.miningDroneExploding) {
                        if (beatCount % 4 === 0) {
                            const root = currentScale[0];
                            playNoteCore(root * 2, time, 0.35, {
                                type: 'triangle',
                                gain: MIXER.layers.miningMotif,
                                pan: -0.1
                            });
                            playNoteCore(root * 2.5, time + 0.18, 0.35, {
                                type: 'triangle',
                                gain: MIXER.layers.miningMotif * 0.9,
                                pan: 0.1
                            });
                        }
                    }

                    // Attack drone present: add tense stabs
                    if (
                        state.attackDroneActive &&
                        state.attackDroneIsTargetingGlider &&
                        (state.attackDroneState === 'engage' ||
                            state.attackDroneState === 'fire')
                    ) {
                        const stabProb =
                            MIXER.probs.attackStabsBase +
                            (state.combatDanger || 0) * 0.5;
                        if (Math.random() < stabProb) {
                            const idx =
                                Math.floor(Math.random() * currentScale.length);
                            const base = currentScale[idx];
                            const dissonant = base * Math.pow(2, 1 / 12); // +1 semitone
                            playNoteCore(dissonant * 3, time, 0.22, {
                                type: 'sawtooth',
                                gain: MIXER.layers.attackStabs,
                                pan: 0,
                                noEcho: true,
                                attack: 0.01,
                                release: 0.21
                            });
                        }
                    }

                    // City neon strips: light buzzing flickers
                    if (state.hasCityNeon && state.biomeType === 'city') {
                        const neonProb =
                            MIXER.probs.cityNeonBase + state.geoIntensity * 0.3;
                        if (Math.random() < neonProb) {
                            const high = currentScale[currentScale.length - 1] * 4;
                            playNoteCore(high, time, 0.12, {
                                type: 'sawtooth',
                                gain: MIXER.layers.cityNeon,
                                pan: (Math.random() * 1.6) - 0.8,
                                noEcho: true,
                                attack: 0.01,
                                release: 0.12
                            });
                        }
                    }

                    // Marble gardens: sparse bell-like chimes
                    if (state.hasGardens && state.biomeType === 'gardens') {
                        const gardenProb = MIXER.probs.gardensBase;
                        if (Math.random() < gardenProb) {
                            const noteIdx = Math.floor(
                                Math.random() * currentScale.length
                            );
                            const base = currentScale[noteIdx];
                            playNoteCore(base * 2, time, 1.4, {
                                type: 'sine',
                                gain: MIXER.layers.gardens,
                                pan: (Math.random() * 1.4) - 0.7,
                                delayTime: 0.45,
                                delayGain: 0.4,
                                attack: 0.02,
                                release: 1.6
                            });
                        }
                    }

                    // Skeletal Structure: Metallic, dissonant clanks
                    if (state.hasSkeletal && state.biomeType === 'skeletal') {
                        const skeletalProb = MIXER.probs.skeletalBase;
                        // Low probability, heavy impact
                        if (Math.random() < skeletalProb) {
                            const noteIdx = Math.floor(Math.random() * currentScale.length);
                            const base = currentScale[noteIdx];
                            // Use a very low frequency for "structure groans" or high for "metallic pings"
                            const isLow = Math.random() > 0.6;
                            const freq = isLow ? base / 2 : base * 4;

                            playNoteCore(freq, time, isLow ? 0.8 : 0.1, {
                                type: isLow ? 'sawtooth' : 'square',
                                gain: MIXER.layers.skeletal,
                                pan: (Math.random() * 1.8) - 0.9,
                                delayTime: 0.15,
                                delayGain: 0.5, // High feedback for metallic ring
                                attack: 0.01,
                                release: isLow ? 0.8 : 0.2,
                            });
                        }
                    }

                    nextNoteTime += secondsPerBeat;
                    beatCount++;
                }

                // Keep the scheduler running regardless of isPlaying so that
                // starting / stopping the game later still produces notes.
                requestAnimationFrame(scheduleNextNote);
            }

            function update(state) {
                // Accept either legacy (biomeType, intensity) or new state object
                if (typeof state === 'string') {
                    state = {
                        biomeType: state,
                        geoIntensity: arguments[1] || 0,
                        combatDanger: 0
                    };
                }

                prevState = lastState;
                lastState = { ...defaultState, ...lastState, ...state };

                const biomeKey = lastState.biomeType;
                if (BIOME_SCALES[biomeKey]) {
                    currentScale = BIOME_SCALES[biomeKey];
                }

                if (!ctx || !droneFilter) return;

                // Event: mining drone just died
                if (
                    !prevState.miningDroneDestroyed &&
                    lastState.miningDroneDestroyed
                ) {
                    scheduleMiningDroneExplosion(ctx.currentTime + 0.02);
                }

                // Event: attack volley just started against the player
                if (
                    prevState.attackDroneState !== 'fire' &&
                    lastState.attackDroneState === 'fire' &&
                    lastState.attackDroneIsTargetingGlider
                ) {
                    scheduleVolleyStartHit(ctx.currentTime + 0.02);
                }

                // Per-frame continuous updates (drone brightness, etc.)
                applyContinuousState();
            }

            function nearMiss(pan) {
                if (!ctx) return;
                const clampedPan = Math.max(-1, Math.min(1, pan || 0));
                const base = currentScale[currentScale.length - 1] || 196.0;
                playNoteCore(base * 4, ctx.currentTime + 0.01, 0.18, {
                    type: 'triangle',
                    gain: MIXER.layers.nearMiss,
                    pan: clampedPan,
                    noEcho: true,
                    attack: 0.01,
                    release: 0.17
                });
            }

            return { init, update, nearMiss };
        })();

        // --- GAME ENGINE ---
        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(BIOMES[0].fog);
            // Reintroduce fog with balanced density
            scene.fog = new THREE.FogExp2(BIOMES[0].fog, 0.018);

            camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, CONFIG.viewDistance);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 3);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffaa00, 1.5);
            dirLight.position.set(50, 50, -50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const sunGeo = new THREE.CircleGeometry(100, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.z = -300;
            scene.add(sun);
            menuSun = sun;

            randomizeRunSeed();
            createPlayer();
            createVoxelSystem();
            createWarningLights();
            createWater();
            createTunnelDebris();
            createCityProps();
            createMiningDrone();
            createAttackDrone();

            // Initial Positioning
            const startPos = getSafePath(0);
            player.position.set(startPos.x, startPos.y, 0);
            camera.position.set(startPos.x, startPos.y + 5, -25);
            camera.lookAt(startPos.x, startPos.y, 50);

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
            clock = new THREE.Clock();
            animate();
        }

        function createPlayer() {
            const geometry = new THREE.ConeGeometry(1, 4, 3);
            geometry.rotateX(Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffff, emissive: 0x0088aa, emissiveIntensity: 0.8, roughness: 0.2
            });
            player.mesh = new THREE.Mesh(geometry, material);
            player.mesh.castShadow = true;
            scene.add(player.mesh);

            const glowGeo = new THREE.SphereGeometry(0.5);

            player.mesh.add(glow);
        }

        function createVoxelSystem() {
            const geometry = new THREE.BoxGeometry(CONFIG.voxelSize, CONFIG.voxelSize, CONFIG.voxelSize);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff
            });

            const count = CONFIG.gridWidth * CONFIG.gridHeight * CONFIG.gridDepth;
            voxelMesh = new THREE.InstancedMesh(geometry, material, count);
            voxelMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            voxelMesh.castShadow = true;
            voxelMesh.receiveShadow = true;
            scene.add(voxelMesh);

            // Initialize instanceColor buffer explicitly
            const colorArray = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                colorArray[i * 3 + 0] = 1.0;
                colorArray[i * 3 + 1] = 1.0;
                colorArray[i * 3 + 2] = 1.0;
            }
            voxelMesh.instanceColor = new THREE.InstancedBufferAttribute(colorArray, 3);

            let i = 0;
            for (let x = 0; x < CONFIG.gridWidth; x++) {
                for (let y = 0; y < CONFIG.gridHeight; y++) {
                    for (let z = 0; z < CONFIG.gridDepth; z++) {
                        voxels.push({
                            id: i++,
                            vx: x - CONFIG.gridWidth / 2,
                            vy: y - CONFIG.gridHeight / 2,
                            vz: z
                        });
                    }
                }
            }
        }

        // Tunnel wall warning lights (voxel-art fixtures)

        // Canyon mining drone: floating indicator of the safe passage
        function createMiningDrone() {
            miningDrone = new THREE.Group();

            // Dodecahedral metallic body (about half the previous visual size)
            const bodyGeom = new THREE.DodecahedronGeometry(1.5, 0);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x777777,
                metalness: 0.9,
                roughness: 0.25,
                emissive: 0x111122,
                emissiveIntensity: 0.4
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            miningDrone.add(body);

            // Magenta scanning light cones on left/right
            const coneGeom = new THREE.ConeGeometry(1.2, 14, 20);
            // Move cone so the tip is at the origin and the base extends outward
            coneGeom.translate(0, -7, 0);
            const coneMat = new THREE.MeshStandardMaterial({
                color: 0xff00ff,
                emissive: 0xff55ff,
                emissiveIntensity: 3.5,
                roughness: 0.2,
                metalness: 0.3,
                transparent: true,
                opacity: 0.35
            });

            miningDroneLeft = new THREE.Mesh(coneGeom, coneMat);
            miningDroneLeft.position.set(0, 0, 0);
            miningDrone.add(miningDroneLeft);

            miningDroneRight = new THREE.Mesh(coneGeom, coneMat.clone());
            miningDroneRight.position.set(0, 0, 0);
            miningDrone.add(miningDroneRight);

            // Explosion effect (additive glowing sphere, initially hidden)
            const expGeom = new THREE.SphereGeometry(1, 16, 16);
            const expMat = new THREE.MeshBasicMaterial({
                color: 0xffaa55,
                transparent: true,
                opacity: 0.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            miningDroneExplosionMesh = new THREE.Mesh(expGeom, expMat);
            miningDroneExplosionMesh.visible = false;
            miningDrone.add(miningDroneExplosionMesh);
