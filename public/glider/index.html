        function updateEnvironment() {
            const z = player.position.z;
            const zScaled = z / CONFIG.biomeLength;
            let idx = Math.floor(zScaled) % BIOMES.length;
            if (idx < 0) idx += BIOMES.length;
            const nextIdx = (idx + 1) % BIOMES.length;
            const progress = zScaled - Math.floor(zScaled);
            let blend = 0;
            if (progress > 0.85) blend = (progress - 0.85) * 6.66;

            const b1 = BIOMES[idx];
            const b2 = BIOMES[nextIdx];

            if (currentBiomeName !== b1.name) {
                currentBiomeName = b1.name;
                const disp = document.getElementById('biome-display');
                disp.innerText = `SECTOR: ${currentBiomeName}`;
                disp.style.display = 'block';
                disp.style.transform = "scale(1.5)";
                setTimeout(() => disp.style.transform = "scale(1)", 200);
            }

            const c1 = new THREE.Color(b1.fog);
            const c2 = new THREE.Color(b2.fog);
            scene.fog.color.lerpColors(c1, c2, blend);
            scene.background.copy(scene.fog.color);

            return { b1, b2, blend };
        }

        // Helper for detailed coloring logic based on biome type
        function getVoxelStyle(x, y, z, den, biome) {
            const color = new THREE.Color();
            const h = biome.colorBase.h; const s = biome.colorBase.s; const l = biome.colorBase.l;

            if (biome.type === 'tunnel') {
                // Debris check (must match geometry logic)
                const path = getSafePath(z);
                const relY = y - path.y;
                const debrisNoise = noise3D(x * 0.15, y * 0.15, z * 0.15);

                if (relY > -45 && relY < -20 && debrisNoise > 0.2) {
                    // Debris is darker and less saturated
                    color.setHSL(h, s * 0.5, l * 0.4);
                } else {
                    // Standard wall
                    color.setHSL(h, s, l + den * 0.2);
                }
            } else if (biome.type === 'canyon') {
                // Stratified warm rock faces (no blue tints ÔÇô water plane handles all blue)
                const strata = Math.sin((y + z * 0.2) * 0.12) * 0.2
                    + noise3D(x * 0.03, y * 0.03, z * 0.03) * 0.2;
                const bandChoice = noise3D(x * 0.01, y * 0.02, z * 0.01);
                const hue = THREE.MathUtils.clamp(0.05 + strata * 0.06, 0.03, 0.13); // warm ochreÔÇôrust
                const sat = 0.7 + bandChoice * 0.15;
                const light = THREE.MathUtils.clamp(
                    0.26 + den * 0.24 + strata * 0.06,
                    0.16,
                    0.78
                );
                color.setHSL(hue, sat, light);
            } else if (biome.type === 'city') {
                const blockSize = 120;
                const gx = Math.floor(x / blockSize);
                const gz = Math.floor(z / blockSize);

                // Tower ID hash for color variation
                const towerHash = hash3(gx, 0, gz);

                // Base Color: PITCH BLACK / HYPER DARK
                // "Hypermodern slick" = almost no diffuse color, just specular highlights (simulated)
                const baseHue = 0.6; // Blue-ish tint
                const baseSat = 0.2;
                const baseLight = 0.08 + den * 0.03; // Lightness range: very dark

                color.setHSL(baseHue, baseSat, baseLight);

                // Neon Stripes: Blue / Green / Teal
                // Vertical stripes for slickness - VERY SPARSE (2% coverage)
                const stripeNoise = noise3D(x * 0.05, 0, z * 0.05); // Low freq vertical
                // Increase spacing to 40, reduce width to 1.0
                const isStripe = Math.abs(x % 40) < 1.0 || Math.abs(z % 40) < 1.0;

                // Neon stripe threshold
                if (isStripe && stripeNoise > 0.3) {
                    // Palette: Blue (0.6), Cyan (0.5), Green (0.33), Teal (0.45)
                    const neonChoice = hash3(gx, Math.floor(y / 40), gz);
                    let neonH = 0.6; // Blue
                    if (neonChoice > 0.4) neonH = 0.5; // Cyan
                    if (neonChoice > 0.7) neonH = 0.35; // Green

                    color.setHSL(neonH, 1.0, 0.55); // Bright neon
                }

                // Occasional "Data Lights" (sparse points)
                const pointNoise = noise3D(x * 0.4, y * 0.4, z * 0.4);
                if (pointNoise > 0.95) {
                    color.setHSL(0.5, 1.0, 0.9); // White-blue glint
                }

                // Warning lights (Red) - keep them sparse
                if (y > 200 && y % 100 > 98) {
                    const cornerDist = Math.max(Math.abs((x % blockSize) - blockSize / 2), Math.abs((z % blockSize) - blockSize / 2));
                    if (cornerDist > blockSize * 0.3) {
                        color.setHSL(0.0, 1.0, 0.5);
                    }
                }
            } else if (biome.type === 'gardens') {
                const path = getSafePath(z);
                const ceiling = path.y + 80 + Math.sin(z * 0.003) * 6;
                const marbleVein = noise3D(x * 0.08, y * 0.08, z * 0.08);

                const colSpacing = 70;
                const gx = Math.abs((x + colSpacing / 2) % colSpacing - colSpacing / 2);
                const gz = Math.abs((z + colSpacing / 2) % colSpacing - colSpacing / 2);
                const nearColumn = gx < 6 && gz < 6 && y < ceiling;

                if (y > ceiling - 6) {
                    color.setHSL(0.09, 0.08, 0.9 - marbleVein * 0.05);
                } else {
                    const lawnNoise = noise3D(x * 0.03, z * 0.03, y * 0.02);
                    if (lawnNoise > 0.35 && y < path.y + 8) {
                        color.setHSL(0.32, 0.6, 0.55 + lawnNoise * 0.1);
                    } else {
                        color.setHSL(0.08, 0.08, 0.86 - marbleVein * 0.08);
                    }

                    if (nearColumn) {
                        color.setHSL(0.07, 0.16, 0.82);
                    }
                }
            } else if (biome.type === 'skeletal') {
                // Black/Dark Gray variation (Alien/Cybernetic)
                // Vary from pure black to dark gray (~15-20% lightness)
                // Use noise to create "panels" or "structure"
                const structureNoise = noise3D(x * 0.1, y * 0.1, z * 0.1);
                let lightness = 0.02; // Base black

                if (structureNoise > 0.2) {
                    lightness += structureNoise * 0.12; // Up to ~0.14
                }

                // Occasional "active" elements (faint red glow on edges)
                const glowNoise = noise3D(x * 0.3, y * 0.3, z * 0.3);
                if (glowNoise > 0.7) {
                    color.setHSL(0.0, 0.8, 0.15); // Dark red glow
                } else {
                    color.setHSL(0.0, 0.0, lightness);
                }
            } else {
                // Fallback for other biomes (simple density gradient)
                color.setHSL(h, s, l + den * 0.2);
            }
            return color;
        }

        function updateVoxels(envData) {
            const px = player.position.x; const py = player.position.y; const pz = player.position.z;
            const rangeX = (CONFIG.gridWidth * CONFIG.voxelSize) / 2;
            const rangeY = (CONFIG.gridHeight * CONFIG.voxelSize) / 2;
            const rangeZ = CONFIG.gridDepth * CONFIG.voxelSize;
            const gridStep = CONFIG.voxelSize;

            const snapX = Math.floor(px / gridStep) * gridStep;
            const snapY = Math.floor(py / gridStep) * gridStep;
            const snapZ = Math.floor(pz / gridStep) * gridStep;

            voxels.forEach(v => {
                let x = v.vx * gridStep; let y = v.vy * gridStep; let z = v.vz * gridStep;
                while (z < snapZ - 20) { z += rangeZ; }
                while (z > snapZ - 20 + rangeZ) { z -= rangeZ; }
                while (x < snapX - rangeX) { x += rangeX * 2; }
                while (x > snapX + rangeX) { x -= rangeX * 2; }
                while (y < snapY - rangeY) { y += rangeY * 2; }
                while (y > snapY + rangeY) { y -= rangeY * 2; }

                const den = getDensity(x, y, z);
                dummy.position.set(x, y, z);

                // Threshold for rendering
                const threshold = isMenuPreview ? 0.2 : 0.1;
                if (den > threshold) {
                    dummy.scale.set(1, 1, 1);

                    // Detailed biome-aware coloring with smooth blending
                    const colA = getVoxelStyle(x, y, z, den, envData.b1);
                    voxelColorHelper.copy(colA);
                    if (envData.blend > 0) {
                        const colB = getVoxelStyle(x, y, z, den, envData.b2);
                        voxelColorHelper.lerp(colB, envData.blend);
                    }
                    voxelMesh.setColorAt(v.id, voxelColorHelper);
                } else {
                    dummy.scale.set(0, 0, 0);
                }
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(v.id, dummy.matrix);
            });

            voxelMesh.instanceMatrix.needsUpdate = true;
            if (voxelMesh.instanceColor) voxelMesh.instanceColor.needsUpdate = true;
        }

        // Update wall-mounted tunnel warning lights
        function updateWarningLightInstances(envData, time) {
            if (!warningLightMesh) return;

            const isTunnel = envData.b1.type === 'tunnel';
            const count = warningLights.length;
            const segmentLength = 800;
            const baseBand = Math.floor(player.position.z / segmentLength);

            for (let i = 0; i < count; i++) {
                const info = warningLights[i];

                // Position lights only in tunnel; hide elsewhere
                if (!isTunnel) {
                    dummy.scale.set(0, 0, 0);
                    dummy.updateMatrix();
                    warningLightMesh.setMatrixAt(info.id, dummy.matrix);
                    continue;
                }

                const worldZ = baseBand * segmentLength + info.zOffset;
                const path = getSafePath(worldZ);
                const radius = info.radialOffset;

                const lx = path.x + Math.cos(info.angle) * radius;
                const ly = path.y + Math.sin(info.angle) * radius;

                dummy.position.set(lx, ly, worldZ);

                // Aim fixture toward tunnel center
                dummy.lookAt(path.x, path.y, worldZ);

                // Subtle flicker via scale pulsing
                const flicker = 0.85 + 0.25 * Math.max(0, Math.sin(time * 6 + info.flickerOffset));
                dummy.scale.set(flicker, flicker, flicker);

                dummy.updateMatrix();
                warningLightMesh.setMatrixAt(info.id, dummy.matrix);
            }

            warningLightMesh.instanceMatrix.needsUpdate = true;
        }

        // Update tunnel floor debris instances
        function updateTunnelDebrisInstances(envData, time) {
            if (!tunnelDebrisMesh) return;

            const isTunnel = envData.b1.type === 'tunnel';
            const count = tunnelDebris.length;
            const segmentLength = 800;
            const baseBand = Math.floor(player.position.z / segmentLength);

            for (let i = 0; i < count; i++) {
                const info = tunnelDebris[i];

                if (!isTunnel) {
                    dummy.scale.set(0, 0, 0);
                    dummy.updateMatrix();
                    tunnelDebrisMesh.setMatrixAt(info.id, dummy.matrix);
                    continue;
                }

                const worldZ = baseBand * segmentLength + info.zOffset;
                const path = getSafePath(worldZ);

                const dx = info.offsetX;
                const dy = info.offsetY;

                dummy.position.set(path.x + dx, path.y + dy, worldZ);

                // Small random rotation and breathing scale so piles feel varied
                const wobble = 0.1 * Math.sin(time * 1.5 + info.rotOffset);
                dummy.rotation.set(0, wobble, info.rotOffset);

                const s = info.scaleJitter;
                dummy.scale.set(s, s, s);

                dummy.updateMatrix();
                tunnelDebrisMesh.setMatrixAt(info.id, dummy.matrix);
            }

            tunnelDebrisMesh.instanceMatrix.needsUpdate = true;
        }

        // Update canyon water surface and placement
        function updateWaterInstance(envData, time) {
            if (!waterMesh || !waterMaterial) return;

            const isCanyon = envData.b1.type === 'canyon';
            waterMesh.visible = isCanyon;
            if (!isCanyon) return;

            // Place water ribbon in a repeating world-space band under the safe path canyon floor
            const segmentLength = 1200;
            const baseBand = Math.floor(player.position.z / segmentLength);
            const centerZ = baseBand * segmentLength + segmentLength * 0.5;
            const path = getSafePath(centerZ);
            const waterY = path.y - 52;
            waterMesh.position.set(path.x, waterY, centerZ);

            // Animate surface waves
            const posAttr = waterMesh.geometry.attributes.position;
            const arr = posAttr.array;
            for (let i = 0; i < posAttr.count; i++) {
                const idx = i * 3;
                const baseX = waterBasePositions[idx];
                const baseY = waterBasePositions[idx + 1];
                const baseZ = waterBasePositions[idx + 2];

                const wave1 = Math.sin(baseX * 0.08 + time * 2.0) * 0.6;
                const wave2 = Math.cos(baseZ * 0.12 + time * 1.3) * 0.4;
                arr[idx] = baseX;
                arr[idx + 1] = baseY + wave1 + wave2;
                arr[idx + 2] = baseZ;
            }
            posAttr.needsUpdate = true;
            waterMesh.geometry.computeVertexNormals();

            // Slight color shimmer
            const shimmer = 0.05 * Math.sin(time * 1.7);
            const newL = THREE.MathUtils.clamp(waterBaseHSL.l + shimmer, 0, 1);
            waterMaterial.color.setHSL(waterBaseHSL.h, waterBaseHSL.s, newL);
        }

        // Update canyon mining drone (safe passage indicator)
        function updateMiningDrone(envData, dt, time) {
            if (!miningDrone) return;

            const mainBiome = envData.b1.type;

            // Once fully destroyed and done exploding, keep hidden.
            if (miningDroneDestroyed && !miningDroneExploding) {
                miningDrone.visible = false;
                return;
            }

            // Before the player ever reaches the canyon biome, keep the drone hidden.
            // It should "enter the scene" only once the glider is in canyon.
            if (!miningDroneActivated) {
                if (mainBiome !== 'canyon') {
                    miningDrone.visible = false;
                    return;
                }
                miningDroneActivated = true;
            }

            // From here on, keep the mining drone alive across biome transitions
            // so the attack drone can still destroy it near the canyon->city handoff.
            miningDrone.visible = true;

            // Explosion animation takes over when triggered
            if (miningDroneExploding) {
                miningDroneExplosionTime += dt;
                const tNorm = miningDroneExplosionTime / 0.9;
                const scale = THREE.MathUtils.lerp(1, 55, Math.min(tNorm, 1));
                miningDroneExplosionMesh.visible = true;
                miningDroneExplosionMesh.scale.set(scale, scale, scale);
                miningDroneExplosionMesh.material.opacity = Math.max(0, 1 - tNorm);

                // Drone falls out of the scene while exploding
                miningDrone.position.y -= 45 * dt;
                miningDrone.position.z += 10 * dt;

                if (miningDroneExplosionTime > 0.9) {
                    miningDrone.visible = false;
                    miningDroneExploding = false;
                }
                return;
            }

            // Place the drone ahead, slightly closer for better visibility
            const droneDist = 50 + Math.sin(time * 2 + player.position.z * 0.01) * 3;
            const baseZ = player.position.z + droneDist;
            const path = getSafePath(baseZ);

            // Janky, slightly unpredictable wobble tightly around the safe path center
            const wobbleX = (Math.sin(time * 1.9 + baseZ * 0.01) * 3
                + noise3D(baseZ * 0.03, 0, time * 0.8) * 3);
            const wobbleY = (Math.cos(time * 1.3 + baseZ * 0.007) * 2
                + noise3D(0, baseZ * 0.025, time * 0.6) * 3);

            const droneX = path.x + wobbleX;
            const droneY = path.y - 6 + wobbleY;

            miningDrone.position.set(droneX, droneY, baseZ);

            // Orient the drone to look roughly back toward the glider
            miningDrone.lookAt(player.position.x, player.position.y, player.position.z);

            // Add a small roll/pitch jitter
            miningDrone.rotation.z += (Math.sin(time * 2.3 + baseZ * 0.02) * 0.15 - miningDrone.rotation.z) * 0.2;
            miningDrone.rotation.x += (Math.cos(time * 1.7 + baseZ * 0.015) * 0.12 - miningDrone.rotation.x) * 0.2;

            // Animate magenta light cones scanning the canyon walls
            if (miningDroneLeft && miningDroneRight) {
                // Aim laterally and sweep gently like wall-scanning sensors
                const scan = Math.sin(time * 1.4 + baseZ * 0.02) * 0.35; // ~20┬░ sweep
                const baseAngle = Math.PI / 2; // sideways relative to forward (Z+)
                miningDroneLeft.position.set(-1.5, 0, 0);
                miningDroneRight.position.set(1.5, 0, 0);
                miningDroneLeft.rotation.set(0, -baseAngle + scan, 0);  // left points to -X
                miningDroneRight.rotation.set(0, baseAngle - scan, 0);  // right points to +X
            }
        }

        // Hostile attack drone logic:
        //  - appears near canyon->city transition to kill the mining drone
        //  - appears 2ÔÇô3 more times in the city to attack the glider
        function updateAttackDrone(envData, dt, time) {
            if (!attackDrone) return;

            const mainBiome = envData.b1.type;
            const nextBiome = envData.b2.type;

            // Trigger spawn:
            // 1) Once when transitioning to city (mining drone target)
            // 2) Then repeatedly in the city biome targeting the glider, roughly every 10 seconds
            if (!attackDroneActive) {
                if (!miningDroneDestroyed &&
                    nextBiome === 'city' &&
                    envData.blend > 0.1) {
                    const engageZ = player.position.z + 180;
                    const path = getSafePath(engageZ);
                    attackDrone.position.set(path.x + 40, path.y + 20, engageZ);
                    attackDrone.visible = true;
                    attackDroneState = 'approach';
                    attackDroneTimer = 0;
                    attackDroneShotsFired = 0;
                    attackDroneActive = true;
                } else if (miningDroneDestroyed &&
                    mainBiome === 'city' &&
                    time - lastCityAttackTime > 10.0) {
                    // Vary spawn distance randomly to ensure visibility chances
                    const engageZ = player.position.z + 120 + Math.random() * 120;
                    const path = getSafePath(engageZ);
                    attackDrone.position.set(path.x + (Math.random() * 2 - 1) * 50,
                        path.y + 25,
                        engageZ);
                    attackDrone.visible = true;
                    attackDroneState = 'approach';
                    attackDroneTimer = 0;
                    attackDroneShotsFired = 0;
                    attackDroneActive = true;
                    lastCityAttackTime = time;
                }

                if (attackDroneActive) {
                    // Reset bullets on each new engagement
                    attackDroneBullets.forEach(b => {
                        b.visible = false;
                        b.userData.active = false;
                        b.userData.life = 0;
                        b.userData.nearMissPlayed = false;
                        b.userData.lastDistToPlayer = Infinity;
                        b.position.set(0, 0, 0);
                        b.userData.vel.set(0, 0, 0);
                    });
                }
            }

            // Determine target:
            //  - mining drone if present and alive (canyon phase)
            //  - glider in city re-engagements
            //  - otherwise fall back to safe path ahead
            const hasMiningDrone = miningDrone && miningDrone.visible && !miningDroneExploding;
            let targetPos = new THREE.Vector3();
            let targetType = 'path';
            if (hasMiningDrone) {
                targetPos.copy(miningDrone.position);
                targetType = 'mining';
            } else if (mainBiome === 'city' && !player.isDead) {
                targetPos.copy(player.position);
                targetType = 'glider';
            } else {
                const tz = player.position.z + 80;
                const pathAhead = getSafePath(tz);
                targetPos.set(pathAhead.x, pathAhead.y, tz);
            }

            // Reset velocity estimation when switching targets to avoid stale velocities
            if (targetType !== attackTargetLastType) {
                attackTargetHasPrev = false;
                attackTargetLastType = targetType;
            }

            // Estimate target velocity for smarter leading shots
            if (attackTargetHasPrev && dt > 0) {
                attackTargetVel.copy(targetPos).sub(attackTargetLastPos).divideScalar(dt);
            } else {
                attackTargetVel.set(0, 0, CONFIG.speed);
            }
            attackTargetLastPos.copy(targetPos);
            attackTargetHasPrev = true;

            let isTargetingGlider = (!hasMiningDrone && mainBiome === 'city' && !player.isDead);

            // Move bullets and check collision with mining drone / glider (independent of drone state)
            attackDroneBullets.forEach(b => {
                if (!b.userData.active) return;
                b.userData.life += dt;
                b.position.add(b.userData.vel.clone().multiplyScalar(dt));

                // Collision with mining drone
                if (hasMiningDrone && !miningDroneExploding && miningDrone && miningDrone.visible) {
                    const distToDrone = b.position.distanceTo(miningDrone.position);
                    if (distToDrone < 5) {
                        // Trigger explosion on the canyon drone
                        miningDroneExploding = true;
                        miningDroneExplosionTime = 0;
                        miningDroneDestroyed = true;
                        // Hide normal drone meshes, keep only explosion mesh
                        miningDrone.children.forEach(child => {
                            if (child !== miningDroneExplosionMesh) {
                                child.visible = false;
                            }
                        });
                        // Abort volley and retreat after successful kill
                        attackDroneState = 'retreat';
                        attackDroneTimer = 0;
                        b.userData.active = false;
                        b.visible = false;
                        return;
                    }
                }
                // Glider interactions (only if glider is current target)
                if (isTargetingGlider && !player.isDead) {
                    const distToPlayer = b.position.distanceTo(player.position);

                    // Near-miss "zing" if the bullet passes close but not a direct hit
                    if (!b.userData.nearMissPlayed && distToPlayer < 10 && distToPlayer > 4) {
                        const pan = (b.position.x - player.position.x) / 40;
                        if (typeof AudioEngine !== 'undefined' && AudioEngine.nearMiss) {
                            AudioEngine.nearMiss(pan);
                        }
                        b.userData.nearMissPlayed = true;
                    }

                    // Direct hit
                    if (distToPlayer < 4) {
                        gameOver();
                        // Abort volley and retreat after killing the player
                        attackDroneState = 'retreat';
                        attackDroneTimer = 0;
                        b.userData.active = false;
                        b.visible = false;
                        return;
                    }
                }

                // Simple timed "hit": after some time, consider bullets spent
                // Lifetime extended to compensate for slower bullets (70u/s) so they can still reach targets ahead
                if (b.userData.life > 3.0) {
                    b.userData.active = false;
                    b.visible = false;
                }
            });

            if (!attackDroneActive) return;

            attackDroneTimer += dt;

            // Simple state machine
            // Compute a "matched" position near the target with a small menacing hover offset
            attackDroneIsTargetingGlider = isTargetingGlider;
            const dangerHud = document.getElementById('danger-display');
            if (dangerHud) {
                const inDangerPhase = attackDroneActive && isTargetingGlider &&
                    (attackDroneState === 'engage' || attackDroneState === 'fire');
                dangerHud.style.display = inDangerPhase ? 'block' : 'none';
            }

            const baseOffset = new THREE.Vector3(0, 18, isTargetingGlider ? 60 : -15); // stay in front of glider
            const hoverOffset = new THREE.Vector3(
                Math.sin(time * 2.1 + targetPos.z * 0.03) * 2.0,
                Math.cos(time * 1.7 + targetPos.z * 0.025) * 2.0,
                Math.sin(time * 1.3 + targetPos.z * 0.02) * 1.5
            );
            const matchedPos = targetPos.clone().add(baseOffset).add(hoverOffset);
            if (isTargetingGlider) {
                // Ensure the attack drone remains ahead of the player for visibility/dodging
                const minFrontZ = player.position.z + 20;
                if (matchedPos.z < minFrontZ) matchedPos.z = minFrontZ;
            }

            if (attackDroneState === 'approach') {
                // Move aggressively toward the matched position from the fog
                const toTarget = matchedPos.clone().sub(attackDrone.position);
                const dist = toTarget.length();
                if (dist > 1) {
                    toTarget.normalize();
                    const speed = 100;
                    attackDrone.position.add(toTarget.multiplyScalar(speed * dt));
                }
                // Once sufficiently close, switch to engage
                if (dist < 30 || attackDroneTimer > 3.0) {
                    attackDroneState = 'engage';
                    attackDroneTimer = 0;
                }
            } else if (attackDroneState === 'engage') {
                // Hover near the target, matching its speed and adding a menacing wobble
                attackDrone.position.lerp(matchedPos, 6 * dt);
                if (attackDroneTimer > 1.0) {
                    attackDroneState = 'fire';
                    attackDroneTimer = 0;
                    attackDroneShotsFired = 0;
                }
            } else if (attackDroneState === 'fire') {
                // Maintain matched hover while firing; never stop moving
                attackDrone.position.lerp(matchedPos, 6 * dt);

                // Fire three bullets toward current target (mining drone or glider). 
                // Only abort if there is no valid target (e.g., player dead).
                const canFire = (hasMiningDrone) || (mainBiome === 'city' && !player.isDead);
                if (!canFire) {
                    attackDroneState = 'retreat';
                    attackDroneTimer = 0;
                } else {
                    const fireInterval = 0.25;
                    while (attackDroneShotsFired < 3 && attackDroneTimer > fireInterval * attackDroneShotsFired) {

                        // NEW: Line of Sight Check
                        // Only fire if the path to the target is clear of voxels
                        const hasLOS = checkVoxelLineOfSight(attackDrone.position, targetPos);

                        if (hasLOS) {
                            const b = attackDroneBullets[attackDroneShotsFired];
                            if (b) {
                                b.visible = true;
                                const origin = attackDrone.position.clone();
                                // Spawn slightly in front of the attack drone along a leading shot direction
                                const bulletSpeed = 120;
                                const toTarget = targetPos.clone().sub(origin);
                                const dist = toTarget.length();
                                let dir;
                                if (dist > 0.0001) {
                                    // Relative-velocity intercept (solves |r + (v_rel)*t| = s*t)
                                    const relVel = attackTargetVel.clone(); // shooter motion after firing does not affect the projectile
                                    const a = relVel.dot(relVel) - bulletSpeed * bulletSpeed;
                                    const bq = 2 * toTarget.dot(relVel);
                                    const c = toTarget.dot(toTarget);
                                    let tHit = null;
                                    if (Math.abs(a) < 1e-4) {
                                        if (Math.abs(bq) > 1e-4) {
                                            const t = -c / bq;
                                            if (t > 0) tHit = t;
                                        }
                                    } else {
                                        const disc = bq * bq - 4 * a * c;
                                        if (disc >= 0) {
                                            const sqrtDisc = Math.sqrt(disc);
                                            const t1 = (-bq - sqrtDisc) / (2 * a);
                                            const t2 = (-bq + sqrtDisc) / (2 * a);
                                            const candidates = [t1, t2].filter(t => t > 0);
                                            if (candidates.length) tHit = Math.min(...candidates);
                                        }
                                    }
                                    if (!tHit || tHit <= 0) {
                                        tHit = dist / bulletSpeed;
                                    }
                                    const predicted = targetPos.clone().add(relVel.multiplyScalar(tHit));
                                    dir = predicted.sub(origin).normalize();
                                } else {
                                    dir = toTarget.normalize();
                                }
                                if (dir.lengthSq() === 0) {
                                    dir = new THREE.Vector3(0, -1, 0).normalize();
                                }

                                b.position.copy(origin).add(dir.clone().multiplyScalar(3));
                                b.userData.vel.copy(dir.multiplyScalar(bulletSpeed));
                                b.userData.active = true;
                                b.userData.life = 0;
                            }
                        }

                        // We increment shots fired even if blocked, consuming the "slot" in the volley sequence.
                        // This prevents the drone from hanging or rapid-firing later.
                        attackDroneShotsFired++;
                    }
                }

                if (attackDroneTimer > 1.5) {
                    attackDroneState = 'retreat';
                    attackDroneTimer = 0;
                }
            } else if (attackDroneState === 'retreat') {
                // Drift off into the fog and then deactivate
                attackDrone.position.z += 80 * dt;
                attackDrone.position.y += 20 * dt;
                if (attackDroneTimer > 2.0) {
                    attackDrone.visible = false;
                    attackDroneActive = false;
                    attackDroneState = 'idle';
                }
            }

            // Always face roughly toward the target
            attackDrone.lookAt(targetPos);
        }

        // Update cyber city neon strips and industrial rooftop blocks
        function updateCityProps(envData, time) {
            const isCity = envData.b1.type === 'city';

            if (!cityNeonMesh || !cityIndustrialMesh) return;

            const segmentLength = 1200;
            const baseBand = Math.floor(player.position.z / segmentLength);

            // Replicate geometry constants
            const blockSize = 120;

            // Neon strips
            for (let i = 0; i < cityNeons.length; i++) {
                const info = cityNeons[i];

                if (!isCity) {
                    dummy.scale.set(0, 0, 0);
                    dummy.updateMatrix();
                    cityNeonMesh.setMatrixAt(info.id, dummy.matrix);
                    continue;
                }

                const worldZ = baseBand * segmentLength + info.zOffset;
                const path = getSafePath(worldZ);

                // Determine which tower we are on
                const bx = Math.floor((path.x + info.offsetX) / blockSize);
                const bz = Math.floor(worldZ / blockSize);
                const blockHash = hash3(bx, 0, bz);
                const towerHeight = 300 + blockHash * 1200;

                // Calculate Height first to get Taper
                const neonY = path.y - 20 + info.heightFrac * (towerHeight - (path.y - 20));

                if (neonY > towerHeight) {
                    dummy.scale.set(0, 0, 0);
                    dummy.updateMatrix();
                    cityNeonMesh.setMatrixAt(info.id, dummy.matrix);
                    continue;
                }

                // Calculate Taper and Width at this height
                const taper = 1.0 - (neonY / 1600) * 0.3;
                const W = (blockSize * 0.4 + blockHash * 5) * taper;

                // Solve for surface X given Z
                // Equation: 0.6 u^2 + 0.4 W u + (0.64 z^2 - W^2) = 0
                // where u = |localX|

                const towerCenterX = (bx + 0.5) * blockSize;
                const towerCenterZ = (bz + 0.5) * blockSize; // Center of the block in Z

                // We need to use the actual worldZ relative to the block center
                // But wait, worldZ is just the position along the track.
                // The tower is grid-aligned.
                const localZ = Math.abs((worldZ % blockSize) - blockSize / 2);

                // Quadratic coeffs
                const a = 0.6;
                const b = 0.4 * W;
                const c = 0.64 * localZ * localZ - W * W;

                let localX = 0;
                const disc = b * b - 4 * a * c;
                if (disc >= 0) {
                    localX = (-b + Math.sqrt(disc)) / (2 * a);
                } else {
                    // If discriminant is negative, it means localZ is already outside the shape?
                    // Or we are near the corner.
                    // Fallback to simple box edge
                    localX = W;
                }

                // Decide side based on original offset
                const distToCenter = (path.x + info.offsetX) - towerCenterX;
                const sign = distToCenter > 0 ? 1 : -1;

                const neonX = towerCenterX + sign * localX;

                dummy.position.set(neonX, neonY, worldZ);

                // Rotation: Face outward
                // Calculate normal vector at this point for perfect rotation?
                // Normal of f(x,z) = 0.2 max(|x|,|z|) + 0.8 length(x,z)
                // Approximate: just face away from center
                const dx = neonX - towerCenterX;
                const dz = worldZ - towerCenterZ;
                const angle = Math.atan2(dx, dz);
                dummy.rotation.set(0, angle, 0);

                // Tilt
                dummy.rotateX(info.tilt);

                const pulse = 0.75 + 0.35 * Math.sin(time * 8.0 + info.zOffset * 0.1);
                dummy.scale.set(pulse, pulse, pulse);

                dummy.updateMatrix();
                cityNeonMesh.setMatrixAt(info.id, dummy.matrix);
            }

            // Rooftop industrial clutter
            for (let i = 0; i < cityIndustrials.length; i++) {
                const info = cityIndustrials[i];

                if (!isCity) {
                    dummy.scale.set(0, 0, 0);
                    dummy.updateMatrix();
                    cityIndustrialMesh.setMatrixAt(info.id, dummy.matrix);
                    continue;
                }

                const worldZ = baseBand * segmentLength + info.zOffset;
                const path = getSafePath(worldZ);

                // Find tower top
                const bx = Math.floor((path.x + info.offsetX) / blockSize);
                const bz = Math.floor(worldZ / blockSize);
                const blockHash = hash3(bx, 0, bz);
                const towerHeight = 300 + blockHash * 1200;

                // Place on roof
                // Clamp X/Z to be within the tapered top
                const taperAtTop = 1.0 - (towerHeight / 1600) * 0.3;
                const W_top = (blockSize * 0.4 + blockHash * 5) * taperAtTop;

                const towerCenterX = (bx + 0.5) * blockSize;
                const towerCenterZ = (bz + 0.5) * blockSize; // We need to snap Z too for the check

                // Original intended position
                let ex = path.x + info.offsetX;

                // Clamp relative to center
                let dx = ex - towerCenterX;
                // Simple box clamp for props is fine, just keep them inside W_top
                // Maybe pull them in a bit (0.8 factor) so they don't hang off edge
                const safeW = W_top * 0.8;
                if (Math.abs(dx) > safeW) {
                    dx = Math.sign(dx) * safeW;
                }
                ex = towerCenterX + dx;

                dummy.position.set(ex, towerHeight, worldZ);

                const wobble = 0.05 * Math.sin(time * 1.5 + info.jitter);
                dummy.rotation.set(0, wobble, 0);

                dummy.scale.set(1, 1, 1);
                dummy.updateMatrix();
                cityIndustrialMesh.setMatrixAt(info.id, dummy.matrix);
            }

            cityNeonMesh.instanceMatrix.needsUpdate = true;
            cityIndustrialMesh.instanceMatrix.needsUpdate = true;
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function checkCollision() {
            const den = getDensity(player.position.x, player.position.y, player.position.z + 2);
            if (den > 0.1) {
                gameOver();
            }
        }

        function updatePlayer(dt) {
            if (player.isDead) return;

            // More direct, snappy mapping from mouse to glider orientation
            // Increase lateral (roll) range by ~10 degrees
            const targetRotZ = mouse.x * 1.97;
            const targetRotX = (player.invertPitch ? -1 : 1) * mouse.y * 1.5;

            player.rotation.z += (targetRotZ - player.rotation.z) * 8 * dt;
            player.rotation.x += (targetRotX - player.rotation.x) * 8 * dt;

            player.mesh.rotation.z = player.rotation.z;
            player.mesh.rotation.x = player.rotation.x;
            player.mesh.rotation.y = -player.rotation.z * 0.3;

            // Forward direction based on current glider orientation (for camera look-ahead)
            const forwardDir = new THREE.Vector3(0, 0, 1).applyEuler(player.mesh.rotation).normalize();

            // Base movement
            let forwardSpeed = CONFIG.speed;
            let xSpeed = -player.rotation.z * 65;
            let ySpeed = -player.rotation.x * 55;

            // Lift-off easing: ramp from hover to full speed and gently pull toward the safe path
            if (isLiftOff) {
                liftOffTime += dt;
                const duration = 1.8;
                const tNorm = Math.min(liftOffTime / duration, 1.0);
                const easeOut = 1 - Math.pow(1 - tNorm, 3); // cubic ease-out

                forwardSpeed *= 0.3 + 0.7 * easeOut;
                xSpeed *= easeOut * 0.4;
                ySpeed *= easeOut * 0.4;

                const path = getSafePath(player.position.z + 30);
                const targetY = THREE.MathUtils.lerp(path.y - 8, path.y - 3, easeOut);
                player.position.y += (targetY - player.position.y) * 2.0 * dt;

                if (tNorm >= 1.0) {
                    isLiftOff = false;
                }
            }

            player.position.x += xSpeed * dt;
            player.position.y += ySpeed * dt;
            player.position.z += forwardSpeed * dt;

            // Camera: strictly follow the glider heading (no path blending).
            // This reflects yaw/pitch/roll immediately in the view.
            const camOffsetY = 7;
            const camBack = 25;
            const camPos = new THREE.Vector3().copy(player.position)
                .add(forwardDir.clone().multiplyScalar(-camBack));
            camPos.y += camOffsetY;
            camera.position.copy(camPos);

            const lookAheadDist = 80;
            const lookTarget = new THREE.Vector3().copy(player.position)
                .add(forwardDir.clone().multiplyScalar(lookAheadDist));
            camera.lookAt(lookTarget);

            player.mesh.position.copy(player.position);

            const sun = scene.children.find(c => c.type === "Mesh" && c.geometry.type === "CircleGeometry");
            if (sun) {
                sun.position.z = player.position.z + 400;
                sun.position.x = player.position.x;
                sun.position.y = player.position.y + 50;
            }

            player.score = Math.floor(player.position.z / 10);
            document.getElementById('score-display').innerText = `SCORE: ${player.score}`;
        }

        function gameOver() {
            player.isDead = true;
            isPlaying = false;
            document.getElementById('crash-overlay').style.display = 'flex';
            document.getElementById('final-score').innerText = `FINAL SCORE: ${player.score}`;
            document.getElementById('score-display').style.display = 'none';
            const danger = document.getElementById('danger-display');
            if (danger) danger.style.display = 'none';
        }

        function resetGame() {
            player.isDead = false;
            randomizeRunSeed();
            // Spawn location
            const spawnZ = 0;
            const spawnPath = getSafePath(spawnZ);
            player.position.set(spawnPath.x, spawnPath.y - 20, spawnZ);
            player.rotation.set(0, 0, 0);
            camera.position.set(spawnPath.x, spawnPath.y + 10, spawnZ - 40);
            camera.lookAt(spawnPath.x, spawnPath.y - 5, spawnZ + 60);
            player.score = 0;
            document.getElementById('crash-overlay').style.display = 'none';
            document.getElementById('score-display').style.display = 'block';
            const danger = document.getElementById('danger-display');
            if (danger) danger.style.display = 'none';
            isPlaying = true;
            isMenuPreview = false;
            isLiftOff = true;
            liftOffTime = 0;
            attackDroneActive = false;
            attackDroneState = 'idle';
            attackDroneCityEngages = 0;
            attackDroneCityMaxEngages = 0;
            lastCityAttackTime = -Infinity;
            miningDroneDestroyed = false;
            miningDroneExploding = false;
            miningDroneExplosionTime = 0;
            miningDroneActivated = false;
            if (miningDrone) {
                miningDrone.visible = false;
                // Restore all children except explosion mesh in case they were hidden
                miningDrone.children.forEach(child => {
                    if (child === miningDroneExplosionMesh) {
                        child.visible = false;
                    } else {
                        child.visible = true;
                    }
                });
            }
            attackTargetHasPrev = false;
            if (attackDrone) {
                attackDrone.visible = false;
                attackDroneBullets.forEach(b => {
                    b.visible = false;
                    b.userData.active = false;
                    b.userData.life = 0;
                });
            }
            if (player.mesh) {
                player.mesh.visible = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const t = performance.now() * 0.001;

            isMenuPreview = false;

            if (isPlaying) {
                updatePlayer(dt);
                checkCollision();
                const envData = updateEnvironment();
                updateVoxels(envData);
                updateWarningLightInstances(envData, t);
                updateWaterInstance(envData, t);
                updateCityProps(envData, t);
                updateTunnelDebrisInstances(envData, t);
                updateMiningDrone(envData, dt, t);
                updateAttackDrone(envData, dt, t);

                // Audio Reactivity
                const path = getSafePath(player.position.z);
                const dx = player.position.x - path.x;
                const dy = player.position.y - path.y;
                const distFromSafeCenter = Math.sqrt(dx * dx + dy * dy);
                let geoIntensity = Math.max(0, (distFromSafeCenter - 10) / 25);

                const lookAheadDist = 30;
                const forwardZ = player.position.z + lookAheadDist;
                const densityAhead = getDensity(player.position.x, player.position.y, forwardZ);
                if (densityAhead > -0.5) geoIntensity += (densityAhead + 0.5);

                geoIntensity = Math.min(1.0, Math.max(0.0, geoIntensity));

                // Combat danger driven by attack drone and targeting state
                let combatDanger = 0;
                if (attackDroneActive && attackDroneIsTargetingGlider) {
                    if (attackDroneState === 'approach') {
                        combatDanger = 0.35;
                    } else if (attackDroneState === 'engage') {
                        combatDanger = 0.6;
                    } else if (attackDroneState === 'fire') {
                        const firePhase = Math.min(attackDroneTimer / 1.5, 1.0);
                        const midEmphasis = 1 - Math.abs(0.5 - firePhase) * 2;
                        combatDanger = 0.7 + 0.3 * midEmphasis;
                    }
                }

                const biomeType = envData.b1.type;
                const audioState = {
                    biomeType,
                    geoIntensity,
                    combatDanger,
                    hasWater: biomeType === 'canyon',
                    hasTunnelLights: biomeType === 'tunnel',
                    hasCityNeon: biomeType === 'city',
                    hasGardens: biomeType === 'gardens',
                    hasSkeletal: biomeType === 'skeletal',
                    miningDroneAlive: !miningDroneDestroyed && !miningDroneExploding,
                    miningDroneExploding,
                    miningDroneDestroyed,
                    attackDroneActive,
                    attackDroneState,
                    attackDroneIsTargetingGlider
                };

                AudioEngine.update(audioState);
            } else if (voxelMesh && !player.isDead) {
                // Stylized menu background: static neon-synth abstract landscape
                updateMenuPreview();
                updateMenuAbstractVoxels();
            }

            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('score-display').style.display = 'block';
            AudioEngine.init();
            resetGame();
        });
        document.getElementById('restart-btn').addEventListener('click', resetGame);

        initGame();

    </script>
</body>
