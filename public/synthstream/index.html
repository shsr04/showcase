<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthstream</title>
    <style>
        :root {
            --bg: #050607;
            --panel: rgba(12, 16, 17, 0.92);
            --panel-soft: rgba(255, 255, 255, 0.055);
            --panel-hard: rgba(0, 0, 0, 0.34);
            --line: rgba(120, 255, 217, 0.24);
            --line-hot: rgba(117, 255, 214, 0.76);
            --text: #e9fff9;
            --muted: #7f9790;
            --green: #75ffd6;
            --amber: #ffd166;
            --pink: #ff5c9d;
            --blue: #65b7ff;
            --red: #ff6b62;
            --shadow: rgba(117, 255, 214, 0.28);
            --knob-sm: 34px;
            --knob-md: 50px;
            --knob-lg: 58px;
            --font: "Inter", "Segoe UI", system-ui, sans-serif;
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow-x: hidden;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 12px;
            background:
                linear-gradient(rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(117, 255, 214, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 50% 16%, rgba(101, 183, 255, 0.18), transparent 34rem),
                radial-gradient(circle at 84% 86%, rgba(255, 92, 157, 0.12), transparent 24rem),
                linear-gradient(135deg, #07090a 0%, #101414 48%, #040505 100%);
            background-size: 34px 34px, 34px 34px, auto, auto, auto;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            z-index: 4;
            background:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 4px),
                radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.7) 100%);
            mix-blend-mode: screen;
            opacity: 0.38;
        }

        body::after {
            z-index: 5;
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.88);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            color: inherit;
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: 74px minmax(0, 1fr) 210px;
            gap: 12px;
            width: min(1600px, calc(100vw - 24px), calc((100vh - 24px) * 16 / 9));
            aspect-ratio: 16 / 9;
            min-height: 0;
            padding: 12px;
        }

        .app.is-station-locked,
        .app.is-station-locked * {
            cursor: none;
        }

        .virtual-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 20;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(233, 255, 249, 0.95);
            border-radius: 50%;
            background: rgba(117, 255, 214, 0.2);
            box-shadow: 0 0 14px rgba(117, 255, 214, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate3d(-999px, -999px, 0);
            transition: opacity 120ms ease;
        }

        .app.is-station-locked .virtual-cursor {
            opacity: 1;
        }

        .app.is-virtual-knob-dragging .virtual-cursor {
            opacity: 0;
        }

        .topbar,
        .deck,
        .mixer {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow:
                inset 0 0 32px rgba(117, 255, 214, 0.045),
                0 24px 80px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(14px);
        }

        .topbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            min-height: 64px;
            padding: 10px 14px;
        }

        .brand {
            display: grid;
            gap: 4px;
            min-width: 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--green);
            font-size: clamp(1.25rem, 2.4vw, 2rem);
            line-height: 1;
            letter-spacing: 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--shadow);
        }

        .readout,
        .tag,
        .deck-kicker,
        .lane,
        .control-label,
        .status,
        .step-readout,
        .meter-label,
        .pattern {
            font-family: var(--mono);
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .tag,
        .readout {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .readout {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            color: var(--amber);
            white-space: nowrap;
        }

        .tempo-light {
            width: 10px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 18px rgba(255, 209, 102, 0.75);
            opacity: 0.45;
        }

        .tempo-light.is-hot {
            opacity: 1;
        }

        .decks {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            min-height: 0;
        }

        .deck {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-width: 0;
            min-height: 0;
            padding: 12px;
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .deck-title {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .deck-title strong {
            font-size: 0.88rem;
            text-transform: uppercase;
        }

        .deck-kicker {
            color: var(--muted);
            font-size: 0.66rem;
        }

        .deck-status-light {
            width: 10px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
        }

        .deck.has-enabled .deck-status-light {
            border-color: rgba(117, 255, 214, 0.5);
            background: rgba(117, 255, 214, 0.34);
            box-shadow: 0 0 10px rgba(117, 255, 214, 0.22);
        }

        .deck.is-active .deck-status-light {
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
        }

        .channel-cell {
            display: grid;
            justify-items: center;
            align-content: start;
            gap: 6px;
            min-width: 0;
        }

        .channel-label {
            display: flex;
            align-items: center;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.56rem;
            line-height: 1;
            text-transform: uppercase;
        }

        .insert-fx-bank {
            display: grid;
            grid-template-columns: repeat(14, min-content);
            gap: 5px;
            align-items: start;
            width: auto;
        }

        .insert-fx {
            display: grid;
            justify-items: center;
            align-content: start;
            gap: 3px;
            min-width: 0;
        }

        .insert-fx-label {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.5rem;
            line-height: 1;
            text-transform: uppercase;
        }

        .transport-button,
        .division-button,
        .knob-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: var(--text);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .lane-grid {
            display: grid;
            grid-template-columns: 72px 40px minmax(260px, 1fr) 18px;
            align-content: start;
            gap: 5px 8px;
            padding: 12px 0;
            min-height: 0;
        }

        .lane {
            display: contents;
        }

        .lane-cell {
            display: flex;
            align-items: center;
            min-height: 30px;
            min-width: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lane-name {
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .lane.is-enabled .lane-name {
            color: var(--text);
        }

        .pattern {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            width: 100%;
            gap: 2px;
            font-size: 0.74rem;
            color: var(--muted);
        }

        .pattern span {
            display: grid;
            place-items: center;
            min-width: 0;
            height: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.22);
        }

        .pattern span.is-hit {
            color: var(--green);
            border-color: rgba(117, 255, 214, 0.24);
            background: rgba(117, 255, 214, 0.055);
        }

        .pattern span.is-soft {
            color: var(--blue);
        }

        .pattern span.is-sustain {
            color: var(--amber);
        }

        .pattern span.is-current {
            color: #03100d;
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        }

        .level {
            justify-content: center;
        }

        .value {
            flex: 0 0 25px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.66rem;
            text-align: right;
        }

        .lane-meter {
            justify-content: center;
        }

        .lane-meter span {
            width: 7px;
            height: 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }

        .lane.is-pulsing .lane-meter span {
            background: var(--pink);
            box-shadow: 0 0 14px rgba(255, 92, 157, 0.55);
        }

        .deck-strip {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-items: start;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .insert-strip {
            grid-column: 1 / -1;
        }

        .strip-block {
            display: grid;
            align-content: start;
            justify-items: start;
            gap: 6px;
            min-width: 0;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.22);
        }

        .channel-strip-block {
            align-items: start;
            justify-items: stretch;
        }

        .channel-mixer-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 58px)) minmax(16px, 1fr) minmax(58px, 72px) minmax(126px, 1fr);
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .eq-filter-bank {
            display: contents;
        }

        .channel-output-bank {
            display: contents;
        }

        .channel-output-bank .deck-level {
            grid-column: 6;
        }

        .channel-output-bank .channel-meter {
            grid-column: 7;
        }

        .deck-level {
            min-width: 0;
            border-color: rgba(117, 255, 214, 0.18);
            background: rgba(117, 255, 214, 0.035);
        }

        .control-row {
            display: inline-grid;
            grid-template-columns: max-content;
            align-items: center;
            justify-items: center;
            gap: 4px;
            width: max-content;
            min-width: max-content;
        }

        .control-label,
        .meter-label {
            color: var(--muted);
            font-size: 0.66rem;
        }

        .meter {
            display: grid;
            gap: 5px;
            align-content: center;
            justify-items: stretch;
        }

        .meter-track {
            position: relative;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            background:
                repeating-linear-gradient(90deg, transparent 0 18%, rgba(255, 255, 255, 0.13) 18% 19%, transparent 19% 20%),
                rgba(0, 0, 0, 0.34);
        }

        .meter-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            background: linear-gradient(90deg, var(--green) 0 68%, var(--amber) 68% 86%, var(--red) 86% 100%);
            box-shadow: 0 0 18px rgba(117, 255, 214, 0.26);
        }

        .meter-hint {
            color: rgba(127, 151, 144, 0.78);
            font-family: var(--mono);
            font-size: 0.56rem;
            text-transform: uppercase;
        }

        .mixer {
            display: grid;
            grid-template-columns: minmax(330px, 0.95fr) minmax(390px, 1.08fr) minmax(340px, 0.95fr);
            gap: 12px;
            min-height: 0;
            padding: 12px;
        }

        .transport,
        .fx-panel,
        .master-panel {
            display: grid;
            align-content: start;
            gap: 10px;
            min-width: 0;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.24);
        }

        .transport {
            grid-template:
                "buttons buttons" auto
                "step step" auto
                "status reset" auto / minmax(0, 1fr) auto;
            align-content: stretch;
            overflow: hidden;
        }

        .transport-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            grid-area: buttons;
            min-width: 0;
        }

        .transport-button {
            min-height: 38px;
            padding: 0 10px;
            color: var(--text);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .transport-button.primary {
            color: #03100d;
            border-color: var(--line-hot);
            background: linear-gradient(135deg, var(--green), var(--blue));
            box-shadow: 0 0 24px rgba(117, 255, 214, 0.22);
        }

        .transport-button.hot {
            border-color: rgba(255, 92, 157, 0.62);
            background: rgba(255, 92, 157, 0.14);
            box-shadow: inset 0 0 18px rgba(255, 92, 157, 0.14);
        }

        .reset-button {
            grid-area: reset;
            justify-self: start;
            align-self: center;
            min-height: 28px;
            white-space: nowrap;
            border-color: rgba(255, 107, 98, 0.26);
            color: rgba(255, 107, 98, 0.82);
            background: rgba(255, 107, 98, 0.045);
            font-size: 0.64rem;
        }

        .step-module {
            display: grid;
            grid-area: step;
            gap: 5px;
            min-width: 0;
        }

        .step-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
        }

        .step-readout {
            color: var(--amber);
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .step-legend {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            gap: 3px;
            min-width: 0;
            color: rgba(127, 151, 144, 0.8);
            font-family: var(--mono);
            font-size: 0.52rem;
            line-height: 1;
            text-align: center;
        }

        .step-grid {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            align-items: center;
            gap: 3px;
            min-width: 0;
        }

        .step-grid span {
            display: grid;
            place-items: center;
            justify-self: center;
            width: 7px;
            height: 7px;
            min-height: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: transparent;
            font-size: 0;
            background: rgba(255, 255, 255, 0.12);
        }

        .step-grid span.is-beat {
            width: 9px;
            height: 9px;
            border-color: rgba(117, 255, 214, 0.24);
            background: rgba(117, 255, 214, 0.2);
        }

        .step-grid span.is-current {
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 12px rgba(255, 209, 102, 0.34);
        }

        .fx-row,
        .master-row {
            display: grid;
            grid-template-columns: 82px max-content minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        .send-fx-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: start;
            gap: 8px;
        }

        .send-fx-control {
            display: grid;
            justify-items: center;
            gap: 6px;
            min-width: 0;
        }

        .division-group {
            display: inline-grid;
            grid-template-columns: repeat(4, 42px);
            gap: 0;
            overflow: hidden;
            width: max-content;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.24);
        }

        .division-button {
            min-height: 28px;
            padding: 0;
            border: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.68rem;
        }

        .division-button:last-child {
            border-right: 0;
        }

        .division-button.is-active {
            color: #03100d;
            border-color: var(--green);
            background: var(--green);
        }

        [data-control].is-virtual-hover {
            border-color: rgba(117, 255, 214, 0.52);
            box-shadow: 0 0 0 1px rgba(117, 255, 214, 0.12), 0 0 16px rgba(117, 255, 214, 0.18);
        }

        [data-control].is-virtual-pressed {
            transform: translateY(1px);
        }

        .xfade {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: 22px 1fr 22px;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.7rem;
        }

        .xfade-block {
            display: grid;
            gap: 8px;
            padding: 10px;
            border: 1px solid rgba(117, 255, 214, 0.22);
            border-radius: 7px;
            background: rgba(117, 255, 214, 0.045);
        }

        .xfade-title {
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.72rem;
            text-transform: uppercase;
        }

        .xfade input {
            accent-color: var(--amber);
        }

        .scope {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            background:
                radial-gradient(circle at 50% 50%, rgba(117, 255, 214, 0.08), transparent 58%),
                linear-gradient(rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                rgba(2, 5, 5, 0.9);
            background-size: auto, 24px 24px, 24px 24px, auto;
        }

        #scopeCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .status {
            display: inline-flex;
            grid-area: status;
            align-items: center;
            align-self: center;
            min-height: 26px;
            min-width: 0;
            max-width: 100%;
            padding: 4px 8px;
            border: 1px solid rgba(255, 209, 102, 0.18);
            border-radius: 6px;
            color: rgba(255, 209, 102, 0.9);
            background: rgba(255, 209, 102, 0.045);
            font-size: 0.66rem;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--green);
        }

        .knob-button {
            --knob-size: var(--knob-md);
            --knob-color: var(--green);
            position: relative;
            display: inline-grid;
            place-items: center;
            width: var(--knob-size);
            min-width: var(--knob-size);
            max-width: var(--knob-size);
            height: var(--knob-size);
            min-height: var(--knob-size);
            max-height: var(--knob-size);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            padding: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(0, 0, 0, 0.88) 0 57%, transparent 58%);
            touch-action: none;
            user-select: none;
        }

        .knob-button::before {
            content: "";
            position: absolute;
            inset: 5px;
            z-index: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.12), transparent 46%),
                rgba(0, 0, 0, 0.82);
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.06);
        }

        .knob-ring {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .knob-track,
        .knob-active {
            fill: none;
            stroke-linecap: round;
            stroke-width: 5;
        }

        .knob-track {
            stroke: rgba(255, 255, 255, 0.12);
        }

        .knob-active {
            stroke: var(--knob-color);
        }

        .knob-notch {
            stroke: rgba(233, 255, 249, 0.72);
            stroke-linecap: round;
            stroke-width: 4;
        }

        .knob-button.is-off {
            color: rgba(255, 107, 98, 0.86);
            border-color: rgba(255, 107, 98, 0.3);
        }

        .knob-button.is-bipolar {
            --knob-size: var(--knob-md);
        }

        .knob-button.is-lane-knob {
            --knob-size: var(--knob-sm);
        }

        .knob-button.is-insert-knob {
            --knob-size: var(--knob-sm);
        }

        .knob-button.is-master-knob {
            --knob-size: var(--knob-lg);
        }

        .knob-button.is-negative {
            color: rgba(101, 183, 255, 0.9);
        }

        .knob-value {
            position: relative;
            z-index: 3;
            max-width: calc(var(--knob-size) - 10px);
            overflow: hidden;
            color: currentColor;
            font-family: var(--mono);
            font-size: 0.58rem;
            font-weight: 800;
            line-height: 1;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 980px) {

    </style>
</head>
<body>

    <script>
        const BPM = 128;
        const STEPS = 16;
        const LOOKAHEAD_MS = 25;
        const SCHEDULE_AHEAD = 0.14;
        const KNOB_SENSITIVITY = 0.75;
        const KNOB_DRAG_WIDTH = 220;
        const LANE_OFF_LEVEL = 1;
        const SCALE = [36.71, 41.2, 43.65, 49, 55, 61.74, 65.41, 73.42, 82.41, 87.31, 98, 110, 123.47, 146.83, 164.81, 174.61, 196, 220, 246.94, 293.66];
        const DIVISIONS = [
            { label: "1/2", steps: 8 },
            { label: "1/4", steps: 4 },
            { label: "1/8", steps: 2 },
            { label: "3/16", steps: 3 },
        ];
        const INSERT_FX = [
            { id: "dirt", label: "Dirt" },
            { id: "crush", label: "Crush" },
            { id: "noise", label: "Noise" },
            { id: "reso", label: "Reso" },
            { id: "shift", label: "Shift" },
            { id: "sweep", label: "Sweep" },
            { id: "reverse", label: "Reverse" },
            { id: "stutter", label: "Stutter" },
            { id: "spiral", label: "Spiral" },
            { id: "mobius", label: "Mobius" },
            { id: "gate", label: "Gate" },
            { id: "space", label: "Space" },
            { id: "pump", label: "Pump" },
            { id: "width", label: "Width" },
        ];

        const BASE_DECKS = [
            {
                id: "a",
                label: "Deck A",
                title: "Hypnotic Techno",
                color: "var(--green)",
                defaults: { level: 82, filter: 0, send: 18 },
                lanes: [
                    { id: "kick", label: "Kick", voice: "kick", pattern: "K---K---K---K---", level: 86, enabled: false },
                    { id: "bass", label: "Bass", voice: "bass", pattern: "--B---B---B---B-", level: 76, enabled: false, notes: [2, 2, 4, 2, 5, 2, 7, 4] },
                    { id: "hat", label: "Hat", voice: "hat", pattern: "--H---H---H---H-", level: 68, enabled: false },
                    { id: "perc", label: "Perc", voice: "perc", pattern: "---P-----P----P-", level: 52, enabled: false },
                    { id: "lead", label: "Lead", voice: "lead", pattern: "L------L----L---", level: 42, enabled: false, notes: [9, 12, 14, 12, 9, 7] },
                    { id: "drone", label: "Drone", voice: "drone", pattern: "D~~~D~~~D~~~D~~~", level: 64, enabled: true, notes: [0, 7] },
                    { id: "texture", label: "Texture", voice: "texture", pattern: "T--t--T--t--T--t", level: 38, enabled: false },
                ],
            },
            {
                id: "b",
                label: "Deck B",
                title: "Acid Techno",
                color: "var(--pink)",
                defaults: { level: 78, filter: 0, send: 24 },
                lanes: [
                    { id: "kick", label: "Kick", voice: "kick", pattern: "K---K---K---K---", level: 82, enabled: false },
                    { id: "bass", label: "Bass", voice: "bass", pattern: "B-bB-B-bB--B-bB-", level: 84, enabled: false, notes: [4, 2, 7, 5, 9, 7, 5, 2] },
                    { id: "hat", label: "Hat", voice: "hat", pattern: "-hHh-hHh-hHh-hHh", level: 74, enabled: false },
                    { id: "perc", label: "Perc", voice: "perc", pattern: "--P--P---P-P--P-", level: 56, enabled: false },
                    { id: "lead", label: "Lead", voice: "lead", pattern: "---L------L----L", level: 58, enabled: false, notes: [12, 14, 16, 14, 12, 9] },
                    { id: "drone", label: "Drone", voice: "drone", pattern: "D~~~D~~~D~~~D~~~", level: 44, enabled: false, notes: [2, 9] },
                    { id: "texture", label: "Texture", voice: "texture", pattern: "-t--T--t--T--t--", level: 56, enabled: false },
                ],
            },
        ];

        const els = {
            station: document.getElementById("station"),
            virtualCursor: document.getElementById("virtualCursor"),
            decks: document.getElementById("decks"),
            play: document.getElementById("playButton"),
            stop: document.getElementById("stopButton"),
            mutate: document.getElementById("mutateButton"),
            reset: document.getElementById("resetButton"),
            status: document.getElementById("status"),
            readout: document.getElementById("readout"),
            tempoLight: document.getElementById("tempoLight"),
            stepReadout: document.getElementById("stepReadout"),
            stepGrid: document.getElementById("stepGrid"),
            divisionGroup: document.getElementById("divisionGroup"),
            divisionValue: document.getElementById("divisionValue"),
            feedback: document.getElementById("feedbackControl"),
            feedbackValue: document.getElementById("feedbackValue"),
            fxReturn: document.getElementById("fxReturnControl"),
            fxReturnValue: document.getElementById("fxReturnValue"),
            master: document.getElementById("masterControl"),
            masterValue: document.getElementById("masterValue"),
            crossfader: document.getElementById("crossfaderControl"),
            masterMeter: document.querySelector("[data-master-meter]"),
            canvas: document.getElementById("scopeCanvas"),
        };

        const canvasCtx = els.canvas.getContext("2d");
        const stepTime = 60 / BPM / 4;
        let decks = cloneDecks();
        let audioCtx;
        let mixBus;
        let compressor;
        let masterLimiter;
        let masterGain;
        let masterAnalyser;
        let delay;
        let delayFeedback;
        let delayHighpass;
        let delayLowpass;
        let delayReturn;
        let noiseBuffer;
        let insertWorkletReady = false;
        let insertWorkletStatusShown = false;
        let deckNodes = {};
        let laneNodes = {};
        let bassPumpState = {};
        let schedulerId = 0;
        let nextStepTime = 0;
        let currentStep = 0;
        let visibleStep = 0;
        let isPlaying = false;
        let seed = 3;
        let selectedDivision = "1/4";
        let dpr = 1;
        let width = 0;
        let height = 0;
        let frequencyData;
        let timeData;
        let masterMeterData;
        let uiTimers = [];
        let activeKnobDrag = null;
        let activeVirtualDrag = null;
        let virtualPressedControl = null;
        let virtualHoverControl = null;
        let virtualCursorX = 0;
        let virtualCursorY = 0;

        function cloneDecks() {
            return BASE_DECKS.map(deck => ({
                ...deck,
                eq: { low: 0, mid: 0, high: 0 },
                insertFx: Object.fromEntries(INSERT_FX.map(effect => [effect.id, 0])),
                controls: { ...deck.defaults },
                lanes: deck.lanes.map(lane => ({
                    ...lane,
                    level: lane.enabled ? lane.level : 0,
                    defaultLevel: lane.level,
                    lastNonZeroLevel: lane.level,
                    pattern: normalizePattern(lane.pattern),
                    lastPulse: 0,
                })),
            }));
        }

        function normalizePattern(pattern) {
            return String(pattern).padEnd(STEPS, "-").slice(0, STEPS);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function seeded(index) {
            const x = Math.sin((seed + 1) * 91.17 + index * 47.31) * 10000;
            return x - Math.floor(x);
        }

        function setStatus(text) {
            els.status.textContent = text;
        }

        function deckById(deckId) {
            return decks.find(deck => deck.id === deckId);
        }

        function laneById(deckId, laneId) {
            return deckById(deckId).lanes.find(lane => lane.id === laneId);
        }

        function nodeKey(deckId, laneId) {
            return `${deckId}:${laneId}`;
        }

        function isLaneActive(lane) {
            return lane.level > LANE_OFF_LEVEL;
        }

        function knobRingMarkup() {
            return `
                <svg class="knob-ring" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                    <path class="knob-track"></path>
                    <path class="knob-active"></path>
                    <line class="knob-notch" x1="50" y1="13" x2="50" y2="24"></line>
                </svg>
            `;
        }

        function knobMarkup({ id, value, min = 0, max = 100, kind = "unipolar", label, dataset = "", inputAttrs = "", className = "", showValue = true }) {
            return `
                <button class="knob-button ${kind === "bipolar" ? "is-bipolar" : ""} ${className}" type="button" data-control="knob" data-knob data-input="${id}" data-kind="${kind}" data-show-value="${showValue}" aria-label="${label}" ${dataset}>
                    ${knobRingMarkup()}
                    ${showValue ? `<span class="knob-value">${formatKnobValue(value, min, max, kind)}</span>` : ""}
                </button>
                <input class="knob-input" id="${id}" type="range" min="${min}" max="${max}" value="${value}" tabindex="-1" ${inputAttrs}>
            `;
        }

        function formatKnobValue(value, min, max, kind) {
            const rounded = Math.round(value);
            if (kind === "unipolar") {
                if (rounded <= min) return "OFF";
                if (rounded >= max) return "MAX";
            }
            if (kind === "bipolar" && rounded === 0) return "0";
            return String(rounded);
        }

        function formatEqGain(value) {
            const rounded = Math.round(value);
            return `${rounded > 0 ? "+" : ""}${rounded}`;
        }

        function initKnobs(root = document) {
            root.querySelectorAll("[data-knob]").forEach(button => {
                refreshKnob(button);
                if (button.dataset.knobReady === "true") return;
                button.dataset.knobReady = "true";
                button.addEventListener("pointerdown", startKnobDrag);
                button.addEventListener("keydown", handleKnobKeydown);
            });
        }

        function knobInput(button) {
            return document.getElementById(button.dataset.input);
        }

        function knobBounds(input) {
            return {
                min: Number(input.min || 0),
                max: Number(input.max || 100),
            };
        }

        function setInputValue(input, value) {
            const { min, max } = knobBounds(input);
            const rounded = Math.round(clamp(value, min, max));
            if (Number(input.value) === rounded) return;
            input.value = String(rounded);
            input.dispatchEvent(new Event("input", { bubbles: true }));
            refreshKnob(document.querySelector(`[data-knob][data-input="${input.id}"]`));
        }

        function ensureKnobRing(button) {
            if (!button.querySelector(".knob-ring")) button.insertAdjacentHTML("afterbegin", knobRingMarkup());
        }

        function knobPoint(cx, cy, radius, angle) {
            const radians = angle * Math.PI / 180;
            return {
                x: cx + radius * Math.sin(radians),
                y: cy - radius * Math.cos(radians),
            };
        }

        function describeKnobArc(startAngle, endAngle) {
            const start = knobPoint(50, 50, 42, startAngle);
            const end = knobPoint(50, 50, 42, endAngle);
            const largeArc = Math.abs(endAngle - startAngle) > 180 ? 1 : 0;
            const sweep = endAngle >= startAngle ? 1 : 0;
            return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} A 42 42 0 ${largeArc} ${sweep} ${end.x.toFixed(3)} ${end.y.toFixed(3)}`;
        }

        function setKnobRendering(button, trackStart, trackEnd, activeStart, activeEnd, color) {
            ensureKnobRing(button);
            const track = button.querySelector(".knob-track");
            const active = button.querySelector(".knob-active");
            const notch = button.querySelector(".knob-notch");
            const hasActiveArc = Math.abs(activeEnd - activeStart) > 0.001;

            if (track) track.setAttribute("d", describeKnobArc(trackStart, trackEnd));
            if (active) {
                active.setAttribute("d", hasActiveArc ? describeKnobArc(activeStart, activeEnd) : "");
                active.style.display = hasActiveArc ? "" : "none";
            }
            if (notch) notch.setAttribute("transform", `rotate(${activeEnd} 50 50)`);
            button.style.setProperty("--knob-color", color);
        }

        function refreshKnob(button) {
            if (!button) return;
            const input = knobInput(button);
            if (!input) return;
            const { min, max } = knobBounds(input);
            const value = Number(input.value);
            const kind = button.dataset.kind || "unipolar";
            const norm = clamp((value - min) / (max - min), 0, 1);
            const display = button.querySelector(".knob-value");
            const color = kind === "bipolar" && value < 0 ? "var(--blue)" : value >= max ? "var(--amber)" : "var(--green)";

            if (display && button.dataset.showValue !== "false") display.textContent = formatKnobValue(value, min, max, kind);
            button.classList.toggle("is-off", kind === "unipolar" && value <= min);
            button.classList.toggle("is-negative", kind === "bipolar" && value < 0);

            if (kind === "bipolar") {
                const maxAbs = Math.max(Math.abs(min), Math.abs(max));
                const angle = maxAbs > 0 ? clamp(value / maxAbs, -1, 1) * 150 : 0;
                setKnobRendering(button, -150, 150, 0, angle, color);
                return;
            }

            const angle = -150 + norm * 300;
            setKnobRendering(button, -150, 150, -150, angle, color);
        }

        function startKnobDrag(event) {
            const button = event.currentTarget;
            const input = knobInput(button);
            if (!input) return;

            if (event.shiftKey && button.dataset.laneKnob) {
                event.preventDefault();
                toggleLaneKnob(button);
                return;
            }

            const { min, max } = knobBounds(input);
            const startValue = Number(input.value);

            activeKnobDrag = {
                button,
                input,
                pointerId: event.pointerId,
                startX: event.clientX,
                startNorm: (startValue - min) / (max - min),
                norm: (startValue - min) / (max - min),
                min,
                max,
            };

            button.setPointerCapture(event.pointerId);
            window.addEventListener("pointermove", moveKnobDrag);
            window.addEventListener("pointerup", finishKnobDrag);
            window.addEventListener("pointercancel", finishKnobDrag);
            window.addEventListener("keydown", cancelKnobOnEscape);
            event.preventDefault();
        }

        function moveKnobDrag(event) {
            if (!activeKnobDrag || event.pointerId !== activeKnobDrag.pointerId) return;
            const hasPointerLock = document.pointerLockElement === activeKnobDrag.button;
            const delta = hasPointerLock
                ? event.movementX / KNOB_DRAG_WIDTH * KNOB_SENSITIVITY
                : (event.clientX - activeKnobDrag.startX) / KNOB_DRAG_WIDTH * KNOB_SENSITIVITY;
            const norm = clamp(hasPointerLock ? activeKnobDrag.norm + delta : activeKnobDrag.startNorm + delta, 0, 1);
            activeKnobDrag.norm = norm;
            const value = activeKnobDrag.min + norm * (activeKnobDrag.max - activeKnobDrag.min);
            setInputValue(activeKnobDrag.input, value);
            event.preventDefault();
        }

        function finishKnobDrag(event) {
            if (!activeKnobDrag || event.pointerId !== activeKnobDrag.pointerId) return;
            closeKnobDrag();
        }

        function cancelKnobOnEscape(event) {
            if (event.key === "Escape") closeKnobDrag();
        }

        function closeKnobDrag() {
            if (!activeKnobDrag) return;
            if (activeKnobDrag.button.hasPointerCapture?.(activeKnobDrag.pointerId)) {
                activeKnobDrag.button.releasePointerCapture(activeKnobDrag.pointerId);
            }
            activeKnobDrag = null;
            window.removeEventListener("pointermove", moveKnobDrag);
            window.removeEventListener("pointerup", finishKnobDrag);
            window.removeEventListener("pointercancel", finishKnobDrag);
            window.removeEventListener("keydown", cancelKnobOnEscape);
        }

        function isStationLocked() {
            return document.pointerLockElement === els.station;
        }

        function stationBounds() {
            return els.station.getBoundingClientRect();
        }

        function clampVirtualCursor() {
            const bounds = stationBounds();
            virtualCursorX = clamp(virtualCursorX, bounds.left, bounds.right - 1);
            virtualCursorY = clamp(virtualCursorY, bounds.top, bounds.bottom - 1);
        }

        function renderVirtualCursor() {
            els.virtualCursor.style.transform = `translate3d(${virtualCursorX - 8}px, ${virtualCursorY - 8}px, 0)`;
        }

        function setVirtualCursorFromEvent(event) {
            virtualCursorX = event.clientX;
            virtualCursorY = event.clientY;
            clampVirtualCursor();
            renderVirtualCursor();
        }

        function moveVirtualCursor(event) {
            virtualCursorX += event.movementX || 0;
            virtualCursorY += event.movementY || 0;
            clampVirtualCursor();
            renderVirtualCursor();
        }

        function resolveVirtualControl() {
            const target = document.elementFromPoint(virtualCursorX, virtualCursorY);
            return target?.closest?.("[data-control]") || null;
        }

        function setVirtualHover(control) {
            if (virtualHoverControl === control) return;
            virtualHoverControl?.classList.remove("is-virtual-hover");
            virtualHoverControl = control;
            virtualHoverControl?.classList.add("is-virtual-hover");
        }

        function clearVirtualPressed() {
            virtualPressedControl?.classList.remove("is-virtual-pressed");
            virtualPressedControl = null;
        }

        function beginVirtualKnobDrag(control, event) {
            const input = knobInput(control);
            if (!input) return;

            if (event.shiftKey && control.dataset.laneKnob) {
                toggleLaneKnob(control);
                return;
            }

            const { min, max } = knobBounds(input);
            const value = Number(input.value);
            activeVirtualDrag = {
                type: "knob",
                control,
                input,
                norm: (value - min) / (max - min),
                min,
                max,
            };
            els.station.classList.add("is-virtual-knob-dragging");
        }

        function beginVirtualSliderDrag(control) {
            activeVirtualDrag = { type: "slider", control };
            updateVirtualSlider(control);
        }

        function updateVirtualKnob(event) {
            const delta = (event.movementX || 0) / KNOB_DRAG_WIDTH * KNOB_SENSITIVITY;
            activeVirtualDrag.norm = clamp(activeVirtualDrag.norm + delta, 0, 1);
            const value = activeVirtualDrag.min + activeVirtualDrag.norm * (activeVirtualDrag.max - activeVirtualDrag.min);
            setInputValue(activeVirtualDrag.input, value);
        }

        function updateVirtualSlider(control) {
            const bounds = control.getBoundingClientRect();
            const min = Number(control.min || 0);
            const max = Number(control.max || 100);
            const norm = bounds.width > 0 ? clamp((virtualCursorX - bounds.left) / bounds.width, 0, 1) : 0;
            const value = Math.round(min + norm * (max - min));
            if (Number(control.value) === value) return;
            control.value = String(value);
            control.dispatchEvent(new Event("input", { bubbles: true }));
        }

        function handleVirtualPointerDown(event) {
            if (!isStationLocked()) return;
            if (event.button !== 0) return;
            const control = resolveVirtualControl();
            if (!control) return;

            setVirtualHover(control);
            virtualPressedControl = control;
            virtualPressedControl.classList.add("is-virtual-pressed");

            if (control.dataset.control === "knob") beginVirtualKnobDrag(control, event);
            if (control.dataset.control === "slider") beginVirtualSliderDrag(control);

            event.preventDefault();
        }

        function handleVirtualPointerMove(event) {
            if (!isStationLocked()) return;

            if (activeVirtualDrag?.type === "knob") {
                updateVirtualKnob(event);
            } else {
                moveVirtualCursor(event);
                if (activeVirtualDrag?.type === "slider") updateVirtualSlider(activeVirtualDrag.control);
                else setVirtualHover(resolveVirtualControl());
            }

            event.preventDefault();
        }

        function handleVirtualPointerUp(event) {
            if (!isStationLocked()) return;
            if (event.button !== 0) return;
            const releaseControl = resolveVirtualControl();
            if (virtualPressedControl?.dataset.control === "button" && releaseControl === virtualPressedControl) {
                virtualPressedControl.click();
            }
            activeVirtualDrag = null;
            els.station.classList.remove("is-virtual-knob-dragging");
            clearVirtualPressed();
            setVirtualHover(releaseControl);
            event.preventDefault();
        }

        function handleStationPointerDown(event) {
            if (!els.station.contains(event.target)) return;
            if (!isStationLocked() && typeof els.station.requestPointerLock === "function") {
                setVirtualCursorFromEvent(event);
                els.station.requestPointerLock();
            }
        }

        function handleStationPointerLockChange() {
            const locked = isStationLocked();
            els.station.classList.toggle("is-station-locked", locked);
            if (!locked) {
                activeVirtualDrag = null;
                els.station.classList.remove("is-virtual-knob-dragging");
                setVirtualHover(null);
                clearVirtualPressed();
            } else {
                clampVirtualCursor();
                renderVirtualCursor();
                setVirtualHover(resolveVirtualControl());
            }
        }

        function toggleLaneKnob(button) {
            const input = knobInput(button);
            const [deckId, laneId] = button.dataset.laneKnob.split(":");
            const lane = laneById(deckId, laneId);
            if (!input || !lane) return;
            if (isLaneActive(lane)) {
                if (lane.level > LANE_OFF_LEVEL) lane.lastNonZeroLevel = lane.level;
                setInputValue(input, 0);
                setStatus(`${lane.label} muted on ${deckById(deckId).label}`);
                return;
            }
            setInputValue(input, lane.lastNonZeroLevel || lane.defaultLevel || 64);
            setStatus(`${lane.label} restored on ${deckById(deckId).label}`);
        }

        function handleKnobKeydown(event) {
            const input = knobInput(event.currentTarget);
            if (!input) return;
            const step = event.shiftKey ? 10 : 1;
            if (event.key === "ArrowRight" || event.key === "ArrowUp") {
                setInputValue(input, Number(input.value) + step);
                event.preventDefault();
            }
            if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
                setInputValue(input, Number(input.value) - step);
                event.preventDefault();
            }
        }

        function createNoiseBuffer(duration) {
            const length = Math.floor(audioCtx.sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let last = 0;

            for (let i = 0; i < length; i += 1) {
                const white = Math.random() * 2 - 1;
                last = (last + white * 0.12) / 1.12;
                data[i] = last * 1.8;
            }

            return buffer;
        }

        function insertFxWorkletCode() {
            return `
                class SynthstreamInsertFx extends AudioWorkletProcessor {
                    constructor() {
                        super();
                        this.targets = { dirt: 0, crush: 0, noise: 0, pump: 0, stutter: 0, gate: 0, space: 0, sweep: 0, reverse: 0, reso: 0, shift: 0, spiral: 0, mobius: 0, width: 0 };
                        this.smooth = { dirt: 0, crush: 0, noise: 0, pump: 0, stutter: 0, gate: 0, space: 0, sweep: 0, reverse: 0, reso: 0, shift: 0, spiral: 0, mobius: 0, width: 0 };
                        this.kicks = [];
                        this.phase = 0;
                        this.tempo = 124;
                        this.maxBuffer = Math.floor(sampleRate * 2);
                        this.sweepBufferLength = Math.floor(sampleRate * 0.07);
                        this.resoBufferLength = Math.floor(sampleRate * 0.08);
                        this.widthBufferLength = Math.floor(sampleRate * 0.025);
                        this.writeIndex = 0;
                        this.repeatIndex = 0;
                        this.repeatLength = 1;
                        this.nextLatchFrame = 0;
                        this.wasStuttering = false;
                        this.pumpEnv = 0;
                        this.noiseKickEnv = 0;
                        this.noiseMaxWet = 0.18;
                        this.mobiusMaxWet = 0.12;
                        this.spaceMaxWet = 0.52;
                        this.gateGain = 1;
                        this.widthLp = 0;
                        this.widthMidLp = 0;
                        this.widthLeftIndex = 0;
                        this.widthRightIndex = Math.floor(this.widthBufferLength * 0.5);
                        this.widthLeftDelay = new Float32Array(this.widthBufferLength);
                        this.widthRightDelay = new Float32Array(this.widthBufferLength);
                        this.widthModPhaseA = 0;
                        this.widthModPhaseB = Math.PI * 0.5;
                        this.resoFrequencies = [73.42, 82.41, 98, 110, 123.47, 146.83, 164.81, 196, 220, 246.94, 293.66, 329.63, 392, 440];
                        this.channels = Array.from({ length: 2 }, (_, ch) => ({
                            dirtTone: 0,
                            crushHeld: 0,
                            crushCount: 0,
                            noiseSeed: (0x6d2b79f5 + ch * 0x1b873593) >>> 0,
                            noiseLow: 0,
                            noiseBand: 0,
                            noiseAir: 0,
                            noiseGate: 1,
                            noiseRms: 0,
                            noiseLimitGain: 1,
                            noiseWetRms: 0,
                            noiseWetLimitGain: 1,
                            buffer: new Float32Array(this.maxBuffer),
                            repeat: new Float32Array(this.maxBuffer),
                            reverseBuffer: new Float32Array(this.maxBuffer),
                            spiralBuffer: new Float32Array(this.maxBuffer),
                            spiralIndex: 0,
                            spiralLp: 0,
                            spiralBp: 0,
                            spiralReturnRms: 0,
                            spiralReturnLimitGain: 1,
                            mobiusPhases: [0, 0, 0, 0],
                            mobiusFb: 0,
                            mobiusLp: 0,
                            mobiusBp: 0,
                            sweepBuffer: new Float32Array(this.sweepBufferLength),
                            sweepIndex: 0,
                            resoBuffer: new Float32Array(this.resoBufferLength),
                            resoIndex: 0,
                            shiftPhase: 0,
                            shiftQuad: 0,
                            shiftLast: 0,
                            spaceLp: 0,
                            spaceDamp: [0, 0, 0, 0],
                            spaceLines: [
                                new Float32Array(Math.floor(sampleRate * 0.029)),
                                new Float32Array(Math.floor(sampleRate * 0.037)),
                                new Float32Array(Math.floor(sampleRate * 0.053)),
                                new Float32Array(Math.floor(sampleRate * 0.071)),
                            ],
                        }));
                        this.port.onmessage = (event) => {
                            const data = event.data || {};
                            if (data.type === "params") {
                                Object.keys(this.targets).forEach(key => {
                                    this.targets[key] = Math.max(0, Math.min(1, Number(data.values?.[key] || 0) / 100));
                                });
                            }
                            if (data.type === "kick") {
                                const frame = Math.max(currentFrame, Math.round(Number(data.time || currentTime) * sampleRate));
                                this.kicks.push(frame);
                                if (this.kicks.length > 32) this.kicks.splice(0, this.kicks.length - 32);
                            }
                            if (data.type === "tempo") this.tempo = Number(data.bpm);
                        };
                    }

                    smoothParam(name) {
                        const coeff = 1 - Math.exp(-1 / (sampleRate * 0.022));
                        this.smooth[name] += (this.targets[name] - this.smooth[name]) * coeff;
                        return this.smooth[name];
                    }

                    softClip(x, amount, channel) {
                        if (amount < 0.002) return x;
                        const pregain = 1 + amount * amount * 13;
                        const wet = Math.min(0.92, amount * 0.94);
                        const trim = 1 / (1 + amount * 1.8);
                        const toneTarget = Math.tanh(x * pregain) * trim;
                        channel.dirtTone += (toneTarget - channel.dirtTone) * (0.08 + amount * 0.18);
                        const driven = toneTarget * (1 - amount * 0.34) + channel.dirtTone * amount * 0.34;
                        return x * (1 - wet) + driven * wet;
                    }

                    crush(x, amount, channel) {
                        if (amount < 0.002) return x;
                        const usable = Math.min(1, amount * 2);
                        const harsh = Math.max(0, amount * 2 - 1);
                        const holdSamples = Math.max(1, Math.round(1 + usable * 7 + harsh * harsh * 56));
                        const bits = Math.max(4, 16 - usable * 4 - harsh * 8);
                        const levels = Math.pow(2, Math.round(bits));
                        if (channel.crushCount <= 0) {
                            channel.crushHeld = Math.round(x * levels) / levels;
                            channel.crushCount = holdSamples;
                        }
                        channel.crushCount -= 1;
                        const wet = Math.min(0.92, amount * 0.9);
                        return x * (1 - wet) + channel.crushHeld * wet;
