                <div class="xfade-block">
                    <span class="xfade-title">Crossfader</span>
                    <label class="xfade">
                        <span>A</span>
                        <input id="crossfaderControl" type="range" min="0" max="100" value="50" aria-label="Crossfader" data-control="slider">
                        <span>B</span>
                    </label>
                </div>
            </div>
        </section>
        <span class="virtual-cursor" id="virtualCursor" aria-hidden="true"></span>
    </main>

    <script>
        const BPM = 124;
        const STEPS = 16;
        const LOOKAHEAD_MS = 25;
        const SCHEDULE_AHEAD = 0.14;
        const KNOB_SENSITIVITY = 0.75;
        const KNOB_DRAG_WIDTH = 220;
        const LANE_OFF_LEVEL = 1;
        const SCALE = [36.71, 41.2, 43.65, 49, 55, 61.74, 65.41, 73.42, 82.41, 87.31, 98, 110, 123.47, 146.83, 164.81, 174.61, 196, 220, 246.94, 293.66];
        const DIVISIONS = [
            { label: "1/2", steps: 8 },
            { label: "1/4", steps: 4 },
            { label: "1/8", steps: 2 },
            { label: "3/16", steps: 3 },
        ];

        const BASE_DECKS = [
            {
                id: "a",
                label: "Deck A",
                title: "Hypnotic / Driving Techno",
                color: "var(--green)",
                defaults: { level: 82, filter: 0, send: 18 },
                lanes: [
                    { id: "kick", label: "Kick", voice: "kick", pattern: "K---K---K---K---", level: 86, enabled: false },
                    { id: "bass", label: "Bass", voice: "bass", pattern: "--B---B---B---B-", level: 76, enabled: false, notes: [2, 2, 4, 2, 5, 2, 7, 4] },
                    { id: "hat", label: "Hat", voice: "hat", pattern: "--H---H---H---H-", level: 68, enabled: false },
                    { id: "perc", label: "Perc", voice: "perc", pattern: "---P-----P----P-", level: 52, enabled: false },
                    { id: "lead", label: "Lead", voice: "lead", pattern: "L------L----L---", level: 42, enabled: false, notes: [9, 12, 14, 12, 9, 7] },
                    { id: "drone", label: "Drone", voice: "drone", pattern: "D~~~D~~~D~~~D~~~", level: 64, enabled: true, notes: [0, 7] },
                    { id: "texture", label: "Texture", voice: "texture", pattern: "T--t--T--t--T--t", level: 38, enabled: false },
                ],
            },
            {
                id: "b",
                label: "Deck B",
                title: "Acid Techno",
                color: "var(--pink)",
                defaults: { level: 78, filter: 0, send: 24 },
                lanes: [
                    { id: "kick", label: "Kick", voice: "kick", pattern: "K---K---K---K---", level: 82, enabled: false },
                    { id: "bass", label: "Bass", voice: "bass", pattern: "B-bB-B-bB--B-bB-", level: 84, enabled: false, notes: [4, 2, 7, 5, 9, 7, 5, 2] },
                    { id: "hat", label: "Hat", voice: "hat", pattern: "-hHh-hHh-hHh-hHh", level: 74, enabled: false },
                    { id: "perc", label: "Perc", voice: "perc", pattern: "--P--P---P-P--P-", level: 56, enabled: false },
                    { id: "lead", label: "Lead", voice: "lead", pattern: "---L------L----L", level: 58, enabled: false, notes: [12, 14, 16, 14, 12, 9] },
                    { id: "drone", label: "Drone", voice: "drone", pattern: "D~~~D~~~D~~~D~~~", level: 44, enabled: false, notes: [2, 9] },
                    { id: "texture", label: "Texture", voice: "texture", pattern: "-t--T--t--T--t--", level: 56, enabled: false },
                ],
            },
        ];

        const els = {
            station: document.getElementById("station"),
            virtualCursor: document.getElementById("virtualCursor"),
            decks: document.getElementById("decks"),
            play: document.getElementById("playButton"),
            stop: document.getElementById("stopButton"),
            mutate: document.getElementById("mutateButton"),
            reset: document.getElementById("resetButton"),
            status: document.getElementById("status"),
            readout: document.getElementById("readout"),
            tempoLight: document.getElementById("tempoLight"),
            stepReadout: document.getElementById("stepReadout"),
            stepGrid: document.getElementById("stepGrid"),
            divisionGroup: document.getElementById("divisionGroup"),
            divisionValue: document.getElementById("divisionValue"),
            feedback: document.getElementById("feedbackControl"),
            feedbackValue: document.getElementById("feedbackValue"),
            fxReturn: document.getElementById("fxReturnControl"),
            fxReturnValue: document.getElementById("fxReturnValue"),
            master: document.getElementById("masterControl"),
            masterValue: document.getElementById("masterValue"),
            crossfader: document.getElementById("crossfaderControl"),
            masterMeter: document.querySelector("[data-master-meter]"),
            canvas: document.getElementById("scopeCanvas"),
        };

        const canvasCtx = els.canvas.getContext("2d");
        const stepTime = 60 / BPM / 4;
        let decks = cloneDecks();
        let audioCtx;
        let mixBus;
        let compressor;
        let masterGain;
        let masterAnalyser;
        let delay;
        let delayFeedback;
        let delayHighpass;
        let delayLowpass;
        let delayReturn;
        let noiseBuffer;
        let deckNodes = {};
        let laneNodes = {};
        let schedulerId = 0;
        let nextStepTime = 0;
        let currentStep = 0;
        let visibleStep = 0;
        let isPlaying = false;
        let seed = 3;
        let selectedDivision = "1/4";
        let dpr = 1;
        let width = 0;
        let height = 0;
        let frequencyData;
        let timeData;
        let masterMeterData;
        let uiTimers = [];
        let activeKnobDrag = null;
        let activeVirtualDrag = null;
        let virtualPressedControl = null;
        let virtualHoverControl = null;
        let virtualCursorX = 0;
        let virtualCursorY = 0;

        function cloneDecks() {
            return BASE_DECKS.map(deck => ({
                ...deck,
                eq: { low: 0, mid: 0, high: 0 },
                controls: { ...deck.defaults },
                lanes: deck.lanes.map(lane => ({
                    ...lane,
                    level: lane.enabled ? lane.level : 0,
                    defaultLevel: lane.level,
                    lastNonZeroLevel: lane.level,
                    pattern: normalizePattern(lane.pattern),
                    lastPulse: 0,
                })),
            }));
        }

        function normalizePattern(pattern) {
            return String(pattern).padEnd(STEPS, "-").slice(0, STEPS);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function seeded(index) {
            const x = Math.sin((seed + 1) * 91.17 + index * 47.31) * 10000;
            return x - Math.floor(x);
        }

        function setStatus(text) {
            els.status.textContent = text;
        }

        function deckById(deckId) {
            return decks.find(deck => deck.id === deckId);
        }

        function laneById(deckId, laneId) {
            return deckById(deckId).lanes.find(lane => lane.id === laneId);
        }

        function nodeKey(deckId, laneId) {
            return `${deckId}:${laneId}`;
        }

        function isLaneActive(lane) {
            return lane.level > LANE_OFF_LEVEL;
        }

        function knobRingMarkup() {
            return `
                <svg class="knob-ring" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                    <path class="knob-track"></path>
                    <path class="knob-active"></path>
                    <line class="knob-notch" x1="50" y1="13" x2="50" y2="24"></line>
                </svg>
            `;
        }

        function knobMarkup({ id, value, min = 0, max = 100, kind = "unipolar", label, dataset = "", inputAttrs = "", className = "", showValue = true }) {
            return `
                <button class="knob-button ${kind === "bipolar" ? "is-bipolar" : ""} ${className}" type="button" data-control="knob" data-knob data-input="${id}" data-kind="${kind}" data-show-value="${showValue}" aria-label="${label}" ${dataset}>
                    ${knobRingMarkup()}
                    ${showValue ? `<span class="knob-value">${formatKnobValue(value, min, max, kind)}</span>` : ""}
                </button>
                <input class="knob-input" id="${id}" type="range" min="${min}" max="${max}" value="${value}" tabindex="-1" ${inputAttrs}>
            `;
        }

        function formatKnobValue(value, min, max, kind) {
            const rounded = Math.round(value);
            if (kind === "unipolar") {
                if (rounded <= min) return "OFF";
                if (rounded >= max) return "MAX";
            }
            if (kind === "bipolar" && rounded === 0) return "0";
            return String(rounded);
        }

        function formatEqGain(value) {
            const rounded = Math.round(value);
            return `${rounded > 0 ? "+" : ""}${rounded}`;
        }

        function initKnobs(root = document) {
            root.querySelectorAll("[data-knob]").forEach(button => {
                refreshKnob(button);
                if (button.dataset.knobReady === "true") return;
                button.dataset.knobReady = "true";
                button.addEventListener("pointerdown", startKnobDrag);
                button.addEventListener("keydown", handleKnobKeydown);
            });
        }

        function knobInput(button) {
            return document.getElementById(button.dataset.input);
        }

        function knobBounds(input) {
            return {
                min: Number(input.min || 0),
                max: Number(input.max || 100),
            };
        }

        function setInputValue(input, value) {
            const { min, max } = knobBounds(input);
            const rounded = Math.round(clamp(value, min, max));
            if (Number(input.value) === rounded) return;
            input.value = String(rounded);
            input.dispatchEvent(new Event("input", { bubbles: true }));
            refreshKnob(document.querySelector(`[data-knob][data-input="${input.id}"]`));
        }

        function ensureKnobRing(button) {
            if (!button.querySelector(".knob-ring")) button.insertAdjacentHTML("afterbegin", knobRingMarkup());
        }

        function knobPoint(cx, cy, radius, angle) {
            const radians = angle * Math.PI / 180;
            return {
                x: cx + radius * Math.sin(radians),
                y: cy - radius * Math.cos(radians),
            };
        }

        function describeKnobArc(startAngle, endAngle) {
            const start = knobPoint(50, 50, 42, startAngle);
            const end = knobPoint(50, 50, 42, endAngle);
            const largeArc = Math.abs(endAngle - startAngle) > 180 ? 1 : 0;
            const sweep = endAngle >= startAngle ? 1 : 0;
            return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} A 42 42 0 ${largeArc} ${sweep} ${end.x.toFixed(3)} ${end.y.toFixed(3)}`;
        }

        function setKnobRendering(button, trackStart, trackEnd, activeStart, activeEnd, color) {
            ensureKnobRing(button);
            const track = button.querySelector(".knob-track");
            const active = button.querySelector(".knob-active");
            const notch = button.querySelector(".knob-notch");
            const hasActiveArc = Math.abs(activeEnd - activeStart) > 0.001;

            if (track) track.setAttribute("d", describeKnobArc(trackStart, trackEnd));
            if (active) {
                active.setAttribute("d", hasActiveArc ? describeKnobArc(activeStart, activeEnd) : "");
                active.style.display = hasActiveArc ? "" : "none";
            }
            if (notch) notch.setAttribute("transform", `rotate(${activeEnd} 50 50)`);
            button.style.setProperty("--knob-color", color);
        }

        function refreshKnob(button) {
            if (!button) return;
            const input = knobInput(button);
            if (!input) return;
            const { min, max } = knobBounds(input);
            const value = Number(input.value);
            const kind = button.dataset.kind || "unipolar";
            const norm = clamp((value - min) / (max - min), 0, 1);
            const display = button.querySelector(".knob-value");
            const color = kind === "bipolar" && value < 0 ? "var(--blue)" : value >= max ? "var(--amber)" : "var(--green)";

            if (display && button.dataset.showValue !== "false") display.textContent = formatKnobValue(value, min, max, kind);
            button.classList.toggle("is-off", kind === "unipolar" && value <= min);
            button.classList.toggle("is-negative", kind === "bipolar" && value < 0);

            if (kind === "bipolar") {
                const maxAbs = Math.max(Math.abs(min), Math.abs(max));
                const angle = maxAbs > 0 ? clamp(value / maxAbs, -1, 1) * 150 : 0;
                setKnobRendering(button, -150, 150, 0, angle, color);
                return;
            }

            const angle = -150 + norm * 300;
            setKnobRendering(button, -150, 150, -150, angle, color);
        }

        function startKnobDrag(event) {
            const button = event.currentTarget;
            const input = knobInput(button);
            if (!input) return;

            if (event.shiftKey && button.dataset.laneKnob) {
                event.preventDefault();
                toggleLaneKnob(button);
                return;
            }

            const { min, max } = knobBounds(input);
            const startValue = Number(input.value);

            activeKnobDrag = {
                button,
                input,
                pointerId: event.pointerId,
                startX: event.clientX,
                startNorm: (startValue - min) / (max - min),
                norm: (startValue - min) / (max - min),
                min,
                max,
            };

            button.setPointerCapture(event.pointerId);
            window.addEventListener("pointermove", moveKnobDrag);
            window.addEventListener("pointerup", finishKnobDrag);
            window.addEventListener("pointercancel", finishKnobDrag);
            window.addEventListener("keydown", cancelKnobOnEscape);
            event.preventDefault();
        }

        function moveKnobDrag(event) {
            if (!activeKnobDrag || event.pointerId !== activeKnobDrag.pointerId) return;
            const hasPointerLock = document.pointerLockElement === activeKnobDrag.button;
            const delta = hasPointerLock
                ? event.movementX / KNOB_DRAG_WIDTH * KNOB_SENSITIVITY
                : (event.clientX - activeKnobDrag.startX) / KNOB_DRAG_WIDTH * KNOB_SENSITIVITY;
            const norm = clamp(hasPointerLock ? activeKnobDrag.norm + delta : activeKnobDrag.startNorm + delta, 0, 1);
            activeKnobDrag.norm = norm;
            const value = activeKnobDrag.min + norm * (activeKnobDrag.max - activeKnobDrag.min);
            setInputValue(activeKnobDrag.input, value);
            event.preventDefault();
        }

        function finishKnobDrag(event) {
            if (!activeKnobDrag || event.pointerId !== activeKnobDrag.pointerId) return;
            closeKnobDrag();
        }

        function cancelKnobOnEscape(event) {
            if (event.key === "Escape") closeKnobDrag();
        }

        function closeKnobDrag() {
            if (!activeKnobDrag) return;
            if (activeKnobDrag.button.hasPointerCapture?.(activeKnobDrag.pointerId)) {
                activeKnobDrag.button.releasePointerCapture(activeKnobDrag.pointerId);
            }
            activeKnobDrag = null;
            window.removeEventListener("pointermove", moveKnobDrag);
            window.removeEventListener("pointerup", finishKnobDrag);
            window.removeEventListener("pointercancel", finishKnobDrag);
            window.removeEventListener("keydown", cancelKnobOnEscape);
        }

        function isStationLocked() {
            return document.pointerLockElement === els.station;
        }

        function stationBounds() {
            return els.station.getBoundingClientRect();
        }

        function clampVirtualCursor() {
            const bounds = stationBounds();
            virtualCursorX = clamp(virtualCursorX, bounds.left, bounds.right - 1);
            virtualCursorY = clamp(virtualCursorY, bounds.top, bounds.bottom - 1);
        }

        function renderVirtualCursor() {
            els.virtualCursor.style.transform = `translate3d(${virtualCursorX - 8}px, ${virtualCursorY - 8}px, 0)`;
        }

        function setVirtualCursorFromEvent(event) {
            virtualCursorX = event.clientX;
            virtualCursorY = event.clientY;
            clampVirtualCursor();
            renderVirtualCursor();
        }

        function moveVirtualCursor(event) {
            virtualCursorX += event.movementX || 0;
            virtualCursorY += event.movementY || 0;
            clampVirtualCursor();
            renderVirtualCursor();
        }

        function resolveVirtualControl() {
            const target = document.elementFromPoint(virtualCursorX, virtualCursorY);
            return target?.closest?.("[data-control]") || null;
        }

        function setVirtualHover(control) {
            if (virtualHoverControl === control) return;
            virtualHoverControl?.classList.remove("is-virtual-hover");
            virtualHoverControl = control;
            virtualHoverControl?.classList.add("is-virtual-hover");
        }

        function clearVirtualPressed() {
            virtualPressedControl?.classList.remove("is-virtual-pressed");
            virtualPressedControl = null;
        }

        function beginVirtualKnobDrag(control, event) {
            const input = knobInput(control);
            if (!input) return;

            if (event.shiftKey && control.dataset.laneKnob) {
                toggleLaneKnob(control);
                return;
            }

            const { min, max } = knobBounds(input);
            const value = Number(input.value);
            activeVirtualDrag = {
                type: "knob",
                control,
                input,
                norm: (value - min) / (max - min),
                min,
                max,
            };
            els.station.classList.add("is-virtual-knob-dragging");
        }

        function beginVirtualSliderDrag(control) {
            activeVirtualDrag = { type: "slider", control };
            updateVirtualSlider(control);
        }

        function updateVirtualKnob(event) {
            const delta = (event.movementX || 0) / KNOB_DRAG_WIDTH * KNOB_SENSITIVITY;
            activeVirtualDrag.norm = clamp(activeVirtualDrag.norm + delta, 0, 1);
            const value = activeVirtualDrag.min + activeVirtualDrag.norm * (activeVirtualDrag.max - activeVirtualDrag.min);
            setInputValue(activeVirtualDrag.input, value);
        }

        function updateVirtualSlider(control) {
            const bounds = control.getBoundingClientRect();
            const min = Number(control.min || 0);
            const max = Number(control.max || 100);
            const norm = bounds.width > 0 ? clamp((virtualCursorX - bounds.left) / bounds.width, 0, 1) : 0;
            const value = Math.round(min + norm * (max - min));
            if (Number(control.value) === value) return;
            control.value = String(value);
            control.dispatchEvent(new Event("input", { bubbles: true }));
        }

        function handleVirtualPointerDown(event) {
            if (!isStationLocked()) return;
            if (event.button !== 0) return;
            const control = resolveVirtualControl();
            if (!control) return;

            setVirtualHover(control);
            virtualPressedControl = control;
            virtualPressedControl.classList.add("is-virtual-pressed");

            if (control.dataset.control === "knob") beginVirtualKnobDrag(control, event);
            if (control.dataset.control === "slider") beginVirtualSliderDrag(control);

            event.preventDefault();
        }

        function handleVirtualPointerMove(event) {
            if (!isStationLocked()) return;

            if (activeVirtualDrag?.type === "knob") {
                updateVirtualKnob(event);
            } else {
                moveVirtualCursor(event);
                if (activeVirtualDrag?.type === "slider") updateVirtualSlider(activeVirtualDrag.control);
                else setVirtualHover(resolveVirtualControl());
            }

            event.preventDefault();
        }

        function handleVirtualPointerUp(event) {
            if (!isStationLocked()) return;
            if (event.button !== 0) return;
            const releaseControl = resolveVirtualControl();
            if (virtualPressedControl?.dataset.control === "button" && releaseControl === virtualPressedControl) {
                virtualPressedControl.click();
            }
            activeVirtualDrag = null;
            els.station.classList.remove("is-virtual-knob-dragging");
            clearVirtualPressed();
            setVirtualHover(releaseControl);
            event.preventDefault();
        }

        function handleStationPointerDown(event) {
            if (!els.station.contains(event.target)) return;
            if (!isStationLocked() && typeof els.station.requestPointerLock === "function") {
                setVirtualCursorFromEvent(event);
                els.station.requestPointerLock();
            }
        }

        function handleStationPointerLockChange() {
            const locked = isStationLocked();
            els.station.classList.toggle("is-station-locked", locked);
            if (!locked) {
                activeVirtualDrag = null;
                els.station.classList.remove("is-virtual-knob-dragging");
                setVirtualHover(null);
                clearVirtualPressed();
            } else {
                clampVirtualCursor();
                renderVirtualCursor();
                setVirtualHover(resolveVirtualControl());
            }
        }

        function toggleLaneKnob(button) {
            const input = knobInput(button);
            const [deckId, laneId] = button.dataset.laneKnob.split(":");
            const lane = laneById(deckId, laneId);
            if (!input || !lane) return;
            if (isLaneActive(lane)) {
                if (lane.level > LANE_OFF_LEVEL) lane.lastNonZeroLevel = lane.level;
                setInputValue(input, 0);
                setStatus(`${lane.label} muted on ${deckById(deckId).label}`);
                return;
            }
            setInputValue(input, lane.lastNonZeroLevel || lane.defaultLevel || 64);
            setStatus(`${lane.label} restored on ${deckById(deckId).label}`);
        }

        function handleKnobKeydown(event) {
            const input = knobInput(event.currentTarget);
            if (!input) return;
            const step = event.shiftKey ? 10 : 1;
            if (event.key === "ArrowRight" || event.key === "ArrowUp") {
                setInputValue(input, Number(input.value) + step);
                event.preventDefault();
            }
            if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
                setInputValue(input, Number(input.value) - step);
                event.preventDefault();
            }
        }

        function renderStaticUi() {
            els.decks.innerHTML = decks.map(deck => `
                <article class="deck" data-deck="${deck.id}" style="--deck-color: ${deck.color}">
                    <header class="deck-header">
                        <div class="deck-title">
                            <strong>${deck.label} - ${deck.title}</strong>
                            <span class="deck-kicker">${deck.id === "a" ? "Stable foundation" : "Acidic escalation"}</span>
                        </div>
                        <span class="deck-status-light" aria-hidden="true"></span>
                    </header>
                    <div class="lane-grid">
                        ${deck.lanes.map(lane => renderLane(deck, lane)).join("")}
                    </div>
                    <div class="deck-strip">
                        <div class="strip-block">
                            <span class="control-label">EQ</span>
                            <div class="eq-bank" aria-label="${deck.label} EQ controls">
                                ${["low", "mid", "high"].map(band => `
                                    <span class="eq-band">
                                        <span class="eq-band-label">${band[0].toUpperCase()}</span>
                                        ${knobMarkup({
                                            id: `eq-${deck.id}-${band}`,
                                            value: deck.eq[band],
                                            min: -26,
                                            max: 6,
                                            kind: "bipolar",
                                            label: `${deck.label} EQ ${band}`,
                                            inputAttrs: `data-eq-band="${deck.id}:${band}"`,
                                            className: "is-eq-knob",
                                            showValue: false
                                        })}
                                    </span>
                                `).join("")}
                            </div>
                        </div>
                        <div class="strip-block">
                            <span class="control-label">Filter</span>
                            <span class="control-row">
                                ${knobMarkup({ id: `filter-${deck.id}`, value: deck.controls.filter, min: -100, max: 100, kind: "bipolar", label: `${deck.label} filter`, inputAttrs: `data-filter="${deck.id}"`, showValue: false })}
                            </span>
                        </div>
                        <div class="strip-block deck-level">
                            <span class="control-label">CH Level</span>
                            <span class="control-row">
                                ${knobMarkup({ id: `deck-level-${deck.id}`, value: deck.controls.level, label: `${deck.label} channel level`, inputAttrs: `data-deck-level="${deck.id}"`, showValue: false })}
                            </span>
                        </div>
                        <div class="strip-block">
                            <span class="control-label">FX Send</span>
                            <span class="control-row">
                                ${knobMarkup({ id: `send-${deck.id}`, value: deck.controls.send, label: `${deck.label} FX send`, inputAttrs: `data-send="${deck.id}"`, showValue: false })}
                            </span>
                        </div>
                        <div class="strip-block meter">
                            <span class="meter-label">${deck.label} Meter</span>
                            <div class="meter-track"><span class="meter-fill" data-deck-meter="${deck.id}"></span></div>
                            <span class="meter-hint">Pre-Xfade</span>
                        </div>
                    </div>
                </article>
            `).join("");

            els.stepGrid.innerHTML = Array.from({ length: STEPS }, (_, index) => `<span class="${index % 4 === 0 ? "is-beat" : ""}" data-step-cell="${index}" aria-label="Step ${index + 1}"></span>`).join("");
            els.divisionGroup.innerHTML = DIVISIONS.map(division => `
                <button class="division-button ${division.label === selectedDivision ? "is-active" : ""}" type="button" data-control="button" data-division="${division.label}">${division.label}</button>
            `).join("");
            bindDynamicEvents();
            renderState();
        }

        function renderLane(deck, lane) {
            const pattern = Array.from(lane.pattern).map((symbol, index) => {
                const classes = [
                    symbol !== "-" ? "is-hit" : "",
                    symbol !== "-" && symbol === symbol.toLowerCase() ? "is-soft" : "",
                    symbol === "~" ? "is-sustain" : "",
                ].filter(Boolean).join(" ");
                return `<span class="${classes}" data-pattern-cell="${deck.id}:${lane.id}:${index}">${symbol}</span>`;
            }).join("");

            return `
                <div class="lane ${isLaneActive(lane) ? "is-enabled" : ""}" data-lane="${deck.id}:${lane.id}">
                    <div class="lane-cell lane-name">
                        <span>${lane.label}</span>
                    </div>
                    <div class="lane-cell level">
                        ${knobMarkup({ id: `lane-level-${deck.id}-${lane.id}`, value: lane.level, label: `${deck.label} ${lane.label} level`, dataset: `data-lane-knob="${deck.id}:${lane.id}"`, inputAttrs: `data-lane-level="${deck.id}:${lane.id}"`, className: "is-lane-knob", showValue: false })}
                    </div>
                    <div class="lane-cell">
                        <div class="pattern" aria-label="${lane.label} pattern">${pattern}</div>
                    </div>
                    <div class="lane-cell lane-meter"><span aria-hidden="true"></span></div>
                </div>
            `;
        }

        function bindDynamicEvents() {
            document.querySelectorAll("[data-lane-level]").forEach(input => {
                input.addEventListener("input", syncLaneLevel);
            });

            document.querySelectorAll("[data-deck-level], [data-filter], [data-send]").forEach(input => {
                input.addEventListener("input", syncDeckControls);
            });

            document.querySelectorAll("[data-eq-band]").forEach(input => {
                input.addEventListener("input", syncEq);
            });

            document.querySelectorAll("[data-division]").forEach(button => {
                button.addEventListener("click", () => {
                    selectedDivision = button.dataset.division;
                    syncFxControls();
                    renderState();
                    setStatus(`Delay division ${selectedDivision}`);
                });
            });

            initKnobs(els.decks);
        }

        function createNoiseBuffer(duration) {
            const length = Math.floor(audioCtx.sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let last = 0;

            for (let i = 0; i < length; i += 1) {
                const white = Math.random() * 2 - 1;
                last = (last + white * 0.12) / 1.12;
                data[i] = last * 1.8;
            }

            return buffer;
        }

        function ensureAudio() {
            if (audioCtx) return;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            mixBus = audioCtx.createGain();
            compressor = audioCtx.createDynamicsCompressor();
            masterGain = audioCtx.createGain();
            masterAnalyser = audioCtx.createAnalyser();
            delay = audioCtx.createDelay(1);
            delayFeedback = audioCtx.createGain();
            delayHighpass = audioCtx.createBiquadFilter();
            delayLowpass = audioCtx.createBiquadFilter();
            delayReturn = audioCtx.createGain();
            noiseBuffer = createNoiseBuffer(2);

            compressor.threshold.value = -18;
            compressor.knee.value = 18;
            compressor.ratio.value = 2.8;
            compressor.attack.value = 0.006;
            compressor.release.value = 0.18;
            masterAnalyser.fftSize = 2048;
            masterAnalyser.smoothingTimeConstant = 0.78;
            delayHighpass.type = "highpass";
            delayHighpass.frequency.value = 420;
            delayLowpass.type = "lowpass";
            delayLowpass.frequency.value = 5200;

            decks.forEach(deck => createDeckNodes(deck));

            delay.connect(delayFeedback);
            delayFeedback.connect(delay);
            delay.connect(delayHighpass);
            delayHighpass.connect(delayLowpass);
            delayLowpass.connect(delayReturn);
            delayReturn.connect(mixBus);
            mixBus.connect(compressor);
            compressor.connect(masterAnalyser);
            masterAnalyser.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            frequencyData = new Uint8Array(masterAnalyser.frequencyBinCount);
            timeData = new Uint8Array(masterAnalyser.fftSize);
            masterMeterData = new Uint8Array(masterAnalyser.frequencyBinCount);
            syncAllControls();
        }

        function createDeckNodes(deck) {
            const input = audioCtx.createGain();
            const low = audioCtx.createBiquadFilter();
            const mid = audioCtx.createBiquadFilter();
            const high = audioCtx.createBiquadFilter();
            const filter = audioCtx.createBiquadFilter();
            const level = audioCtx.createGain();
            const analyser = audioCtx.createAnalyser();
            const crossfade = audioCtx.createGain();
            const send = audioCtx.createGain();

            low.type = "lowshelf";
            low.frequency.value = 220;
            mid.type = "peaking";
            mid.frequency.value = 1000;
            mid.Q.value = 1.1;
            high.type = "highshelf";
            high.frequency.value = 4200;
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.78;

            input.connect(low);
            low.connect(mid);
            mid.connect(high);
            high.connect(filter);
            filter.connect(level);
            level.connect(analyser);
            analyser.connect(crossfade);
            crossfade.connect(mixBus);
            crossfade.connect(send);
            send.connect(delay);

            deckNodes[deck.id] = { input, low, mid, high, filter, level, analyser, data: new Uint8Array(analyser.frequencyBinCount), crossfade, send };

            deck.lanes.forEach(lane => {
                const gain = audioCtx.createGain();
                gain.gain.value = lane.level / 100;
                gain.connect(input);
                laneNodes[nodeKey(deck.id, lane.id)] = { gain };
            });
        }

        function configureDeckFilter(filter, value) {
            if (!filter) return;

            const amount = clamp(value / 100, -1, 1);
            const setFrequency = (frequency) => {
                if (audioCtx) filter.frequency.setTargetAtTime(frequency, audioCtx.currentTime, 0.035);
                else filter.frequency.value = frequency;
            };
            const setQ = (q) => {
                if (audioCtx) filter.Q.setTargetAtTime(q, audioCtx.currentTime, 0.035);
                else filter.Q.value = q;
            };

            if (Math.abs(amount) < 0.04) {
                filter.type = "allpass";
                setFrequency(1000);
                setQ(0.0001);
                return;
            }

            if (amount < 0) {
                const depth = Math.abs(amount);
                filter.type = "lowpass";
                setFrequency(18000 * Math.pow(260 / 18000, depth));
                setQ(0.7 + depth * 4.8);
                return;
            }

            filter.type = "highpass";
            setFrequency(24 * Math.pow(1500 / 24, amount));
            setQ(0.7 + amount * 3.6);
        }

        function rampParam(param, value, time, duration) {
            param.cancelScheduledValues(time);
            param.setTargetAtTime(value, time, Math.max(0.01, duration));
        }

        function syncAllControls() {
            syncLaneLevel();
            syncDeckControls();
            syncEq();
            syncCrossfader();
            syncFxControls();
            syncMaster();
        }

        function syncLaneLevel(event) {
            const inputs = event ? [event.currentTarget] : Array.from(document.querySelectorAll("[data-lane-level]"));
            inputs.forEach(input => {
                const [deckId, laneId] = input.dataset.laneLevel.split(":");
                const lane = laneById(deckId, laneId);
                let value = Number(input.value);
                if (value <= LANE_OFF_LEVEL) {
                    value = 0;
                    input.value = "0";
                }
                lane.level = value;
                lane.enabled = isLaneActive(lane);
                if (isLaneActive(lane)) lane.lastNonZeroLevel = value;
                refreshKnob(document.querySelector(`[data-knob][data-lane-knob="${deckId}:${laneId}"]`));
                const node = laneNodes[nodeKey(deckId, laneId)];
                if (node && audioCtx) rampParam(node.gain.gain, value / 100, audioCtx.currentTime, 0.035);
            });
            renderState();
        }

        function syncDeckControls(event) {
            const deckIds = event ? [event.currentTarget.dataset.deckLevel || event.currentTarget.dataset.filter || event.currentTarget.dataset.send] : decks.map(deck => deck.id);
            deckIds.forEach(deckId => {
                const deck = deckById(deckId);
                const levelInput = document.querySelector(`[data-deck-level="${deckId}"]`);
                const filterInput = document.querySelector(`[data-filter="${deckId}"]`);
                const sendInput = document.querySelector(`[data-send="${deckId}"]`);
                if (levelInput) deck.controls.level = Number(levelInput.value);
                if (filterInput) deck.controls.filter = Number(filterInput.value);
                if (sendInput) deck.controls.send = Number(sendInput.value);

                const levelValue = document.querySelector(`[data-deck-level-value="${deckId}"]`);
                const filterValue = document.querySelector(`[data-filter-value="${deckId}"]`);
                const sendValue = document.querySelector(`[data-send-value="${deckId}"]`);
                if (levelValue) levelValue.textContent = String(deck.controls.level);
                if (filterValue) filterValue.textContent = String(deck.controls.filter);
                if (sendValue) sendValue.textContent = String(deck.controls.send);
                refreshKnob(document.querySelector(`[data-knob][data-input="deck-level-${deckId}"]`));
                refreshKnob(document.querySelector(`[data-knob][data-input="filter-${deckId}"]`));
                refreshKnob(document.querySelector(`[data-knob][data-input="send-${deckId}"]`));

                const nodes = deckNodes[deckId];
                if (nodes && audioCtx) {
                    rampParam(nodes.level.gain, deck.controls.level / 100, audioCtx.currentTime, 0.04);
                    rampParam(nodes.send.gain, deck.controls.send / 100 * 1.15, audioCtx.currentTime, 0.04);
                    configureDeckFilter(nodes.filter, deck.controls.filter);
                }
            });
        }

        function syncEq(event) {
            const deckIds = event ? [event.currentTarget.dataset.eqBand.split(":")[0]] : decks.map(deck => deck.id);
            deckIds.forEach(deckId => {
                const deck = deckById(deckId);
                const nodes = deckNodes[deck.id];
                ["high", "mid", "low"].forEach(band => {
                    const input = document.querySelector(`[data-eq-band="${deck.id}:${band}"]`);
                    if (input) deck.eq[band] = Number(input.value);
                    const value = document.querySelector(`[data-eq-value="${deck.id}:${band}"]`);
                    if (value) value.textContent = formatEqGain(deck.eq[band]);
                    refreshKnob(document.querySelector(`[data-knob][data-input="eq-${deck.id}-${band}"]`));
                });
                if (nodes && audioCtx) {
                    const now = audioCtx.currentTime;
                    rampParam(nodes.low.gain, deck.eq.low, now, 0.04);
                    rampParam(nodes.mid.gain, deck.eq.mid, now, 0.04);
                    rampParam(nodes.high.gain, deck.eq.high, now, 0.04);
                }
            });
        }

        function syncCrossfader() {
            if (!audioCtx || !deckNodes.a || !deckNodes.b) return;

            const x = Number(els.crossfader.value) / 100;
            const gainA = Math.cos(x * Math.PI / 2);
            const gainB = Math.sin(x * Math.PI / 2);
            const now = audioCtx.currentTime;
            rampParam(deckNodes.a.crossfade.gain, gainA, now, 0.035);
            rampParam(deckNodes.b.crossfade.gain, gainB, now, 0.035);
        }

        function syncFxControls() {
            els.feedbackValue.textContent = els.feedback.value;
            els.fxReturnValue.textContent = els.fxReturn.value;
            refreshKnob(document.querySelector('[data-knob][data-input="feedbackControl"]'));
            refreshKnob(document.querySelector('[data-knob][data-input="fxReturnControl"]'));
            els.divisionValue.textContent = selectedDivision;
            document.querySelectorAll("[data-division]").forEach(button => {
                button.classList.toggle("is-active", button.dataset.division === selectedDivision);
            });

            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const division = DIVISIONS.find(item => item.label === selectedDivision) || DIVISIONS[1];
            delay.delayTime.setTargetAtTime(stepTime * division.steps, now, 0.04);
            delayFeedback.gain.setTargetAtTime(Number(els.feedback.value) / 100, now, 0.04);
            delayReturn.gain.setTargetAtTime(Number(els.fxReturn.value) / 100, now, 0.04);
        }

        function syncMaster() {
            els.masterValue.textContent = els.master.value;
            refreshKnob(document.querySelector('[data-knob][data-input="masterControl"]'));
            if (masterGain && audioCtx) rampParam(masterGain.gain, Number(els.master.value) / 100, audioCtx.currentTime, 0.03);
        }

        function playKick(deck, lane, time, velocity) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const click = audioCtx.createBufferSource();
            const clickGain = audioCtx.createGain();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;

            osc.type = "sine";
            osc.frequency.setValueAtTime(deck.id === "a" ? 112 : 126, time);
            osc.frequency.exponentialRampToValueAtTime(deck.id === "a" ? 42 : 48, time + 0.12);
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.95 * velocity, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.34);
            click.buffer = noiseBuffer;
            clickGain.gain.setValueAtTime(0.15 * velocity, time);
            clickGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.018);
            osc.connect(gain);
            click.connect(clickGain);
            gain.connect(out);
            clickGain.connect(out);
            osc.start(time);
            click.start(time);
            osc.stop(time + 0.38);
            click.stop(time + 0.03);
        }

        function playBass(deck, lane, time, step, velocity) {
            const noteIndex = lane.notes[(step + seed) % lane.notes.length] + (deck.id === "b" ? 2 : 0);
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            const freq = SCALE[noteIndex + 2] || 73.42;

            osc.type = deck.id === "b" ? "sawtooth" : "square";
            osc.frequency.setValueAtTime(freq, time);
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(deck.id === "b" ? 360 + seeded(step) * 260 : 220 + seeded(step) * 120, time);
            filter.frequency.exponentialRampToValueAtTime((deck.id === "b" ? 1400 : 820) + seeded(step + 10) * 700, time + 0.05);
            filter.frequency.exponentialRampToValueAtTime(180, time + 0.22);
            filter.Q.value = deck.id === "b" ? 13 : 8;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.23 * velocity, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.24);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(out);
            osc.start(time);
            osc.stop(time + 0.28);
        }

        function playHat(deck, lane, time, velocity) {
            const noise = audioCtx.createBufferSource();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;

            noise.buffer = noiseBuffer;
            filter.type = "highpass";
            filter.frequency.value = (deck.id === "b" ? 7600 : 6600) + velocity * 1700;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.13 * velocity, time + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05 + velocity * 0.04);
            pan.pan.value = seeded(time * 10) * 0.8 - 0.4;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            noise.start(time);
            noise.stop(time + 0.12);
        }

        function playPerc(deck, lane, time, step, velocity) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            osc.type = "triangle";
            osc.frequency.value = deck.id === "b" ? 520 + seeded(step) * 360 : 360 + seeded(step) * 260;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.16 * velocity, time + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);
            pan.pan.value = seeded(step + (deck.id === "b" ? 80 : 40)) * 1.3 - 0.65;
            osc.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            osc.start(time);
            osc.stop(time + 0.14);
        }

        function playLead(deck, lane, time, step, velocity) {
            const noteIndex = lane.notes[(step + seed) % lane.notes.length];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            osc.type = deck.id === "b" ? "square" : "sawtooth";
            osc.frequency.value = (SCALE[noteIndex] || 146.83) * (deck.id === "b" ? 2 : 1.5);
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(deck.id === "b" ? 1800 : 1200, time);
            filter.frequency.exponentialRampToValueAtTime(deck.id === "b" ? 3600 : 2200, time + 0.08);
            filter.Q.value = 2.2;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.1 * velocity, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.32);
            pan.pan.value = Math.sin((step + seed) * 0.7) * 0.45;
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            osc.start(time);
            osc.stop(time + 0.38);
        }

        function playDrone(deck, lane, time, step, symbol) {
            if (symbol === "~") return;

            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            const root = SCALE[lane.notes[0]] || 36.71;
            [root, SCALE[lane.notes[1]] || root * 2].forEach((freq, voice) => {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = voice === 0 ? "sawtooth" : "triangle";
                osc.frequency.value = freq * (deck.id === "b" ? 1.5 : 1);
                osc.detune.value = voice === 0 ? -5 : 7;
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(160 + (seed % 6) * 24 + voice * 80, time);
                filter.Q.value = 4.5;
                gain.gain.setValueAtTime(0.0001, time);
                gain.gain.exponentialRampToValueAtTime((deck.id === "a" ? 0.12 : 0.08) / (voice + 1), time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + stepTime * 4.05);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(out);
                osc.start(time);
                osc.stop(time + stepTime * 4.2);
            });
        }

        function playTexture(deck, lane, time, velocity) {
            const noise = audioCtx.createBufferSource();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            noise.buffer = noiseBuffer;
            filter.type = "bandpass";
            filter.frequency.value = deck.id === "b" ? 5200 + seeded(time) * 1400 : 3800 + seeded(time) * 1200;
            filter.Q.value = 0.7;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.09 * velocity, time + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.42);
            pan.pan.value = seeded(time * 5) * 1.2 - 0.6;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            noise.start(time);
            noise.stop(time + 0.5);
        }

        function playLane(deck, lane, step, time) {
            if (!isLaneActive(lane)) return;

            const symbol = lane.pattern[step];
            if (!symbol || symbol === "-") return;

            const velocity = symbol === symbol.toUpperCase() && symbol !== "~" ? 1 : 0.55;
            lane.lastPulse = performance.now();
            scheduleUiPulse(deck.id, lane.id, time);

            if (lane.voice === "kick") playKick(deck, lane, time, velocity);
            if (lane.voice === "bass") playBass(deck, lane, time, step, velocity);
            if (lane.voice === "hat") playHat(deck, lane, time, velocity);
            if (lane.voice === "perc") playPerc(deck, lane, time, step, velocity);
            if (lane.voice === "lead") playLead(deck, lane, time, step, velocity);
            if (lane.voice === "drone") playDrone(deck, lane, time, step, symbol);
            if (lane.voice === "texture") playTexture(deck, lane, time, velocity);
        }

        function scheduleUiPulse(deckId, laneId, time) {
            const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
            uiTimers.push(window.setTimeout(() => {
                laneById(deckId, laneId).lastPulse = performance.now();
                renderState();
            }, delayMs));
        }

        function scheduleStep(step, time) {
            const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
            uiTimers.push(window.setTimeout(() => {
                visibleStep = step;
                renderStep();
                if (step % 4 === 0) {
                    els.tempoLight.classList.add("is-hot");
                    window.setTimeout(() => els.tempoLight.classList.remove("is-hot"), 90);
                }
            }, delayMs));

            decks.forEach(deck => {
                deck.lanes.forEach(lane => playLane(deck, lane, step, time));
            });
        }

        function scheduler() {
            while (nextStepTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
                scheduleStep(currentStep, nextStepTime);
                nextStepTime += stepTime;
                currentStep = (currentStep + 1) % STEPS;
            }
        }

        async function play() {
            ensureAudio();
            if (audioCtx.state === "suspended") await audioCtx.resume();
            const now = audioCtx.currentTime;
            isPlaying = true;
            nextStepTime = now + 0.04;
            currentStep = visibleStep;
            window.clearInterval(schedulerId);
            schedulerId = window.setInterval(scheduler, LOOKAHEAD_MS);
            els.play.textContent = "Pause";
            els.readout.textContent = "124 BPM / 4/4 / 16 Steps / Playing";
            setStatus("Playing");
        }

        function pause() {
            if (!audioCtx) return;
            window.clearInterval(schedulerId);
            schedulerId = 0;
            isPlaying = false;
            audioCtx.suspend();
            els.play.textContent = "Play";
            els.readout.textContent = "124 BPM / 4/4 / 16 Steps / Paused";
            setStatus("Playback paused");
        }

        function stop() {
            if (audioCtx && audioCtx.state !== "closed") audioCtx.suspend();
            window.clearInterval(schedulerId);
            schedulerId = 0;
            isPlaying = false;
            currentStep = 0;
            visibleStep = 0;
            clearUiTimers();
            els.play.textContent = "Play";
            els.readout.textContent = "124 BPM / 4/4 / 16 Steps / Stopped";
            setStatus("Playback stopped");
            renderStep();
        }

        function resetAll() {
            stop();
            decks = cloneDecks();
            seed = 3;
            selectedDivision = "1/4";
            deckNodes = {};
            laneNodes = {};
            if (audioCtx && audioCtx.state !== "closed") {
                audioCtx.close();
            }
            audioCtx = null;
            renderStaticUi();
            els.feedback.value = 48;
            els.fxReturn.value = 42;
            els.master.value = 58;
            els.crossfader.value = 50;
            syncFxControls();
            syncMaster();
            setStatus("Station reset");
        }

        function mutate() {
            seed = (seed + 1 + Math.floor(Math.random() * 7)) % 97;
            decks.forEach(deck => {
                deck.lanes.forEach((lane, laneIndex) => {
                    if (lane.voice !== "drone" && seeded(laneIndex + seed) > 0.72) {
                        const chars = Array.from(lane.pattern);
                        const pos = Math.floor(seeded(laneIndex * 13 + seed) * STEPS) % STEPS;
                        if (chars[pos] === "-") chars[pos] = lane.label[0].toLowerCase();
                        lane.pattern = chars.join("");
                    }
                });
            });
            if (audioCtx) {
                const now = audioCtx.currentTime;
                delayFeedback.gain.setTargetAtTime(Number(els.feedback.value) / 100 + (seed % 5) * 0.018, now, 0.05);
            }
            renderStaticUi();
            setStatus(`Mutation seed ${String(seed).padStart(2, "0")}`);
            els.readout.textContent = `124 BPM / 4/4 / 16 Steps / Seed ${String(seed).padStart(2, "0")}`;
        }

        function clearUiTimers() {
            uiTimers.forEach(timer => window.clearTimeout(timer));
            uiTimers = [];
        }

        function renderState() {
            const now = performance.now();
            decks.forEach(deck => {
                const deckElement = document.querySelector(`[data-deck="${deck.id}"]`);
                const hasEnabledLane = deck.lanes.some(lane => isLaneActive(lane));
                const hasRecentPulse = deck.lanes.some(lane => now - lane.lastPulse < 130);
                if (deckElement) {
                    deckElement.classList.toggle("has-enabled", hasEnabledLane);
                    deckElement.classList.toggle("is-active", hasRecentPulse);
                }
                deck.lanes.forEach(lane => {
                    const row = document.querySelector(`[data-lane="${deck.id}:${lane.id}"]`);
                    if (!row) return;
                    row.classList.toggle("is-enabled", isLaneActive(lane));
                    row.classList.toggle("is-pulsing", now - lane.lastPulse < 130);
                });
            });
            renderStep();
        }

        function renderStep() {
            els.stepReadout.textContent = `Step ${String(visibleStep + 1).padStart(2, "0")} / 16`;
            document.querySelectorAll("[data-step-cell]").forEach(cell => {
                cell.classList.toggle("is-current", Number(cell.dataset.stepCell) === visibleStep);
            });
            document.querySelectorAll("[data-pattern-cell]").forEach(cell => {
                const [, , index] = cell.dataset.patternCell.split(":");
                cell.classList.toggle("is-current", Number(index) === visibleStep);
            });
        }

        function meterValue(analyser, data) {
            analyser.getByteFrequencyData(data);
            let total = 0;
            for (let i = 0; i < data.length; i += 1) total += data[i] / 255;
            return clamp(total / data.length * 2.6, 0, 1);
        }

        function renderMeters() {
            decks.forEach(deck => {
                const meter = document.querySelector(`[data-deck-meter="${deck.id}"]`);
                const nodes = deckNodes[deck.id];
                const value = nodes && isPlaying ? meterValue(nodes.analyser, nodes.data) : deck.lanes.reduce((max, lane) => {
                    return Math.max(max, performance.now() - lane.lastPulse < 130 ? lane.level / 100 : 0);
                }, 0) * 0.45;
                if (meter) meter.style.width = `${Math.round(value * 100)}%`;
            });

            const masterValue = masterAnalyser && isPlaying ? meterValue(masterAnalyser, masterMeterData) : 0;
            els.masterMeter.style.width = `${Math.round(masterValue * 100)}%`;
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = els.canvas.getBoundingClientRect();
            width = Math.max(1, rect.width);
            height = Math.max(1, rect.height);
            els.canvas.width = Math.floor(width * dpr);
            els.canvas.height = Math.floor(height * dpr);
            canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function drawStandby(time) {
            const bars = 28;
            for (let i = 0; i < bars; i += 1) {
                const x = i / bars * width;
                const h = 10 + Math.sin(time * 0.0015 + i * 0.45) * 6 + (i % 5) * 1.8;
                canvasCtx.fillStyle = `hsla(${164 + i * 1.8}, 86%, 66%, 0.18)`;
                canvasCtx.fillRect(x, height - h - 10, Math.max(2, width / bars - 4), h);
            }
        }

        function drawLive() {
            masterAnalyser.getByteFrequencyData(frequencyData);
            masterAnalyser.getByteTimeDomainData(timeData);
            let total = 0;
            for (let i = 0; i < frequencyData.length; i += 1) total += frequencyData[i] / 255;
            const energy = clamp(total / frequencyData.length * 2.2, 0, 1);
            const centerY = height * 0.48;

            canvasCtx.strokeStyle = `rgba(117, 255, 214, ${0.35 + energy * 0.5})`;
            canvasCtx.lineWidth = 2;
            canvasCtx.beginPath();
            for (let i = 0; i < timeData.length; i += 8) {
                const t = i / (timeData.length - 1);
                const x = t * width;
                const sample = (timeData[i] - 128) / 128;
                const y = centerY + sample * height * 0.32;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
            }
            canvasCtx.stroke();

            const bars = 36;
            const bandSize = Math.floor(frequencyData.length / bars);
            for (let i = 0; i < bars; i += 1) {
                let value = 0;
                for (let j = 0; j < bandSize; j += 1) value += frequencyData[i * bandSize + j] / 255;
                value /= bandSize;
                const barWidth = width / bars;
                const barHeight = Math.max(2, value * height * 0.36);
                canvasCtx.fillStyle = `hsla(${158 + i * 1.6 + energy * 24}, 92%, ${58 + value * 22}%, 0.82)`;
                canvasCtx.fillRect(i * barWidth, height - barHeight - 8, Math.max(2, barWidth - 3), barHeight);
            }
        }

        function draw(time) {
            requestAnimationFrame(draw);
            renderState();
            renderMeters();
            canvasCtx.clearRect(0, 0, width, height);
            canvasCtx.fillStyle = "rgba(2, 5, 5, 0.62)";
            canvasCtx.fillRect(0, 0, width, height);
            if (masterAnalyser && isPlaying) drawLive();
            else drawStandby(time);
        }

        els.play.addEventListener("click", () => {
            if (isPlaying) pause();
            else play().catch(() => setStatus("Audio blocked by browser"));
        });
        els.stop.addEventListener("click", stop);
        els.reset.addEventListener("click", resetAll);
        els.mutate.addEventListener("click", mutate);
        els.feedback.addEventListener("input", syncFxControls);
        els.fxReturn.addEventListener("input", syncFxControls);
        els.master.addEventListener("input", syncMaster);
        els.crossfader.addEventListener("input", syncCrossfader);
        els.station.addEventListener("pointerdown", handleStationPointerDown);
        window.addEventListener("mousemove", handleVirtualPointerMove);
        window.addEventListener("mousedown", handleVirtualPointerDown);
        window.addEventListener("mouseup", handleVirtualPointerUp);
        document.addEventListener("pointerlockchange", handleStationPointerLockChange);
        window.addEventListener("resize", resize);

        renderStaticUi();
        initKnobs();
        syncFxControls();
        syncMaster();
        resize();
        requestAnimationFrame(draw);
    </script>
</body>
</html>
