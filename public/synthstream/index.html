<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthstream</title>
    <style>
        :root {
            --bg: #050607;
            --panel: rgba(12, 16, 17, 0.92);
            --panel-soft: rgba(255, 255, 255, 0.055);
            --panel-hard: rgba(0, 0, 0, 0.34);
            --line: rgba(120, 255, 217, 0.24);
            --line-hot: rgba(117, 255, 214, 0.76);
            --text: #e9fff9;
            --muted: #7f9790;
            --green: #75ffd6;
            --amber: #ffd166;
            --pink: #ff5c9d;
            --blue: #65b7ff;
            --red: #ff6b62;
            --shadow: rgba(117, 255, 214, 0.28);
            --knob-sm: 34px;
            --knob-md: 50px;
            --knob-lg: 58px;
            --font: "Inter", "Segoe UI", system-ui, sans-serif;
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: auto;
        }

        body {
            display: grid;
            place-items: center;
            min-width: 1624px;
            min-height: 924px;
            padding: 12px;
            background:
                linear-gradient(rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(117, 255, 214, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 50% 16%, rgba(101, 183, 255, 0.18), transparent 34rem),
                radial-gradient(circle at 84% 86%, rgba(255, 92, 157, 0.12), transparent 24rem),
                linear-gradient(135deg, #07090a 0%, #101414 48%, #040505 100%);
            background-size: 34px 34px, 34px 34px, auto, auto, auto;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            z-index: 4;
            background:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 4px),
                radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.7) 100%);
            mix-blend-mode: screen;
            opacity: 0.38;
        }

        body::after {
            z-index: 5;
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.88);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            color: inherit;
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: 74px minmax(0, 1fr) 210px;
            gap: 12px;
            width: 1600px;
            height: 900px;
            min-height: 0;
            padding: 12px;
        }

        .app.is-station-locked,
        .app.is-station-locked * {
            cursor: none;
        }

        .virtual-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 20;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(233, 255, 249, 0.95);
            border-radius: 50%;
            background: rgba(117, 255, 214, 0.2);
            box-shadow: 0 0 14px rgba(117, 255, 214, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate3d(-999px, -999px, 0);
            transition: opacity 120ms ease;
        }

        .app.is-station-locked .virtual-cursor {
            opacity: 1;
        }

        .app.is-virtual-knob-dragging .virtual-cursor {
            opacity: 0;
        }

        .topbar,
        .deck,
        .mixer {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow:
                inset 0 0 32px rgba(117, 255, 214, 0.045),
                0 24px 80px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(14px);
        }

        .topbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            min-height: 64px;
            padding: 10px 14px;
        }

        .brand {
            display: grid;
            gap: 4px;
            min-width: 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--green);
            font-size: clamp(1.25rem, 2.4vw, 2rem);
            line-height: 1;
            letter-spacing: 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--shadow);
        }

        .readout,
        .tag,
        .deck-kicker,
        .lane,
        .control-label,
        .status,
        .step-readout,
        .meter-label,
        .pattern {
            font-family: var(--mono);
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .tag,
        .readout {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .readout {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            color: var(--amber);
            white-space: nowrap;
        }

        .tempo-light {
            width: 10px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 18px rgba(255, 209, 102, 0.75);
            opacity: 0.45;
        }

        .tempo-light.is-hot {
            opacity: 1;
        }

        .decks {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            min-height: 0;
        }

        .deck {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-width: 0;
            min-height: 0;
            padding: 12px;
        }

        .deck-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .deck-title {
            display: grid;
            gap: 3px;
            min-width: 0;
            flex: 1;
        }

        .deck-title strong {
            font-size: 0.88rem;
            text-transform: uppercase;
        }

        .deck-kicker {
            color: var(--muted);
            font-size: 0.66rem;
        }

        .library-switcher {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: end;
        }

        .library-button {
            display: grid;
            place-items: center;
            width: 32px;
            aspect-ratio: 1;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.055);
            color: var(--text);
            cursor: pointer;
            font-family: var(--mono);
            font-size: 0.74rem;
            line-height: 1;
        }

        .library-button:hover,
        .library-button.is-virtual-hover {
            border-color: rgba(117, 255, 214, 0.55);
            color: var(--green);
        }

        .deck-status-light {
            width: 10px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
        }

        .deck.has-enabled .deck-status-light {
            border-color: rgba(117, 255, 214, 0.5);
            background: rgba(117, 255, 214, 0.34);
            box-shadow: 0 0 10px rgba(117, 255, 214, 0.22);
        }

        .deck.is-active .deck-status-light {
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
        }

        .channel-cell {
            display: grid;
            justify-items: center;
            align-content: start;
            gap: 6px;
            min-width: 0;
        }

        .channel-label {
            display: flex;
            align-items: center;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.56rem;
            line-height: 1;
            text-transform: uppercase;
        }

        .insert-fx-bank {
            display: grid;
            grid-template-columns: repeat(12, min-content);
            grid-auto-rows: min-content;
            gap: 5px 7px;
            align-items: start;
            width: auto;
        }

        .insert-fx {
            display: grid;
            justify-items: center;
            align-content: start;
            gap: 3px;
            min-width: 0;
        }

        .insert-fx-label {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.5rem;
            line-height: 1;
            text-transform: uppercase;
        }

        .transport-button,
        .division-button,
        .knob-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: var(--text);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .lane-grid {
            display: grid;
            grid-template-columns: 72px 40px minmax(260px, 1fr) 18px;
            align-content: start;
            gap: 5px 8px;
            padding: 12px 0;
            min-height: 0;
        }

        .lane {
            display: contents;
        }

        .lane-cell {
            display: flex;
            align-items: center;
            min-height: 30px;
            min-width: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lane-name {
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .lane.is-enabled .lane-name {
            color: var(--text);
        }

        .pattern {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            width: 100%;
            gap: 2px;
            font-size: 0.74rem;
            color: var(--muted);
        }

        .pattern span {
            display: grid;
            place-items: center;
            min-width: 0;
            height: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.22);
        }

        .pattern span.is-hit {
            color: var(--green);
            border-color: rgba(117, 255, 214, 0.24);
            background: rgba(117, 255, 214, 0.055);
        }

        .pattern span.is-soft {
            color: var(--blue);
        }

        .pattern span.is-sustain {
            color: var(--amber);
        }

        .pattern span.is-current {
            color: #03100d;
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        }

        .level {
            justify-content: center;
        }

        .value {
            flex: 0 0 25px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.66rem;
            text-align: right;
        }

        .lane-meter {
            justify-content: center;
        }

        .lane-meter span {
            width: 7px;
            height: 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }

        .lane.is-pulsing .lane-meter span {
            background: var(--pink);
            box-shadow: 0 0 14px rgba(255, 92, 157, 0.55);
        }

        .deck-strip {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-items: start;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .insert-strip {
            grid-column: 1 / -1;
        }

        .strip-block {
            display: grid;
            align-content: start;
            justify-items: start;
            gap: 6px;
            min-width: 0;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.22);
        }

        .channel-strip-block {
            align-items: start;
            justify-items: stretch;
        }

        .channel-mixer-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 58px)) minmax(16px, 1fr) minmax(58px, 72px) minmax(126px, 1fr);
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .eq-filter-bank {
            display: contents;
        }

        .channel-output-bank {
            display: contents;
        }

        .channel-output-bank .deck-level {
            grid-column: 6;
        }

        .channel-output-bank .channel-meter {
            grid-column: 7;
        }

        .deck-level {
            min-width: 0;
            border-color: rgba(117, 255, 214, 0.18);
            background: rgba(117, 255, 214, 0.035);
        }

        .control-row {
            display: inline-grid;
            grid-template-columns: max-content;
            align-items: center;
            justify-items: center;
            gap: 4px;
            width: max-content;
            min-width: max-content;
        }

        .control-label,
        .meter-label {
            color: var(--muted);
            font-size: 0.66rem;
        }

        .meter {
            display: grid;
            gap: 5px;
            align-content: center;
            justify-items: stretch;
        }

        .meter-track {
            position: relative;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            background:
                repeating-linear-gradient(90deg, transparent 0 18%, rgba(255, 255, 255, 0.13) 18% 19%, transparent 19% 20%),
                rgba(0, 0, 0, 0.34);
        }

        .meter-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            background: linear-gradient(90deg, var(--green) 0 68%, var(--amber) 68% 86%, var(--red) 86% 100%);
            box-shadow: 0 0 18px rgba(117, 255, 214, 0.26);
        }

        .meter-hint {
            color: rgba(127, 151, 144, 0.78);
            font-family: var(--mono);
            font-size: 0.56rem;
            text-transform: uppercase;
        }

        .mixer {
            display: grid;
            grid-template-columns: minmax(330px, 0.95fr) minmax(390px, 1.08fr) minmax(340px, 0.95fr);
            gap: 12px;
            min-height: 0;
            padding: 12px;
        }

        .transport,
        .fx-panel,
        .master-panel {
            display: grid;
            align-content: start;
            gap: 10px;
            min-width: 0;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.24);
        }

        .master-panel {
            grid-template-columns: max-content minmax(0, 1fr);
            align-items: center;
            gap: 8px 12px;
        }

        .master-panel .meter {
            min-width: 0;
        }

        .master-panel .master-row {
            grid-template:
                "label" auto
                "control" auto / max-content;
            justify-items: center;
            gap: 4px 8px;
        }

        .master-panel .master-row .control-label {
            grid-area: label;
        }

        .master-panel .master-row .control-row {
            grid-area: control;
        }

        .master-panel .master-row .value {
            grid-area: value;
        }

        .transport {
            grid-template:
                "buttons buttons" auto
                "step step" auto
                "status reset" auto / minmax(0, 1fr) auto;
            align-content: stretch;
            overflow: hidden;
        }

        .transport-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            grid-area: buttons;
            min-width: 0;
        }

        .transport-button {
            min-height: 38px;
            padding: 0 10px;
            color: var(--text);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .transport-button.primary {
            color: #03100d;
            border-color: var(--line-hot);
            background: linear-gradient(135deg, var(--green), var(--blue));
            box-shadow: 0 0 24px rgba(117, 255, 214, 0.22);
        }

        .transport-button.hot {
            border-color: rgba(255, 92, 157, 0.62);
            background: rgba(255, 92, 157, 0.14);
            box-shadow: inset 0 0 18px rgba(255, 92, 157, 0.14);
        }

        .reset-button {
            grid-area: reset;
            justify-self: start;
            align-self: center;
            min-height: 28px;
            white-space: nowrap;
            border-color: rgba(255, 107, 98, 0.26);
            color: rgba(255, 107, 98, 0.82);
            background: rgba(255, 107, 98, 0.045);
            font-size: 0.64rem;
        }

        .step-module {
            display: grid;
            grid-area: step;
            gap: 5px;
            min-width: 0;
        }

        .step-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
        }

        .step-readout {
            color: var(--amber);
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .step-legend {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            gap: 3px;
            min-width: 0;
            color: rgba(127, 151, 144, 0.8);
            font-family: var(--mono);
            font-size: 0.52rem;
            line-height: 1;
            text-align: center;
        }

        .step-grid {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            align-items: center;
            gap: 3px;
            min-width: 0;
        }

        .step-grid span {
            display: grid;
            place-items: center;
            justify-self: center;
            width: 7px;
            height: 7px;
            min-height: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: transparent;
            font-size: 0;
            background: rgba(255, 255, 255, 0.12);
        }

        .step-grid span.is-beat {
            width: 9px;
            height: 9px;
            border-color: rgba(117, 255, 214, 0.24);
            background: rgba(117, 255, 214, 0.2);
        }

        .step-grid span.is-current {
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 12px rgba(255, 209, 102, 0.34);
        }

        .fx-row,
        .master-row {
            display: grid;
            grid-template-columns: 82px max-content minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        .send-fx-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: start;
            gap: 8px;
        }

        .send-fx-control {
            display: grid;
            justify-items: center;
            gap: 6px;
            min-width: 0;
        }

        .division-group {
            display: inline-grid;
            grid-template-columns: repeat(4, 42px);
            gap: 0;
            overflow: hidden;
            width: max-content;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.24);
        }

        .division-button {
            min-height: 28px;
            padding: 0;
            border: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.68rem;
        }

        .division-button:last-child {
            border-right: 0;
        }

        .division-button.is-active {
            color: #03100d;
            border-color: var(--green);
            background: var(--green);
        }

        [data-control].is-virtual-hover {
            border-color: rgba(117, 255, 214, 0.52);
            box-shadow: 0 0 0 1px rgba(117, 255, 214, 0.12), 0 0 16px rgba(117, 255, 214, 0.18);
        }

        [data-control].is-virtual-pressed {
            transform: translateY(1px);
        }

        .xfade {
            --xfade-side-color: rgba(117, 255, 214, 0.82);
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: 20px minmax(0, 1fr) 20px;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.7rem;
        }

        .xfade-block {
            display: grid;
            grid-column: 1 / -1;
            gap: 7px;
            padding: 8px 10px 9px;
            border: 1px solid rgba(117, 255, 214, 0.22);
            border-radius: 7px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.055), transparent 42%),
                rgba(117, 255, 214, 0.045);
            box-shadow:
                inset 0 0 18px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .xfade-title {
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.72rem;
            text-transform: uppercase;
        }

        .xfade-label {
            display: grid;
            place-items: center;
            min-height: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--xfade-side-color);
            background: rgba(0, 0, 0, 0.28);
            font-size: 0.62rem;
            font-weight: 800;
            line-height: 1;
        }

        .xfade-stage {
            position: relative;
            display: grid;
            align-items: center;
            min-width: 0;
            height: 24px;
            padding: 0 9px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background:
                linear-gradient(90deg, rgba(255, 92, 157, 0.24), transparent 30% 70%, rgba(101, 183, 255, 0.24)),
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 44%),
                rgba(0, 0, 0, 0.3);
            box-shadow:
                inset 0 0 0 1px rgba(0, 0, 0, 0.42),
                inset 0 8px 14px rgba(0, 0, 0, 0.34);
        }

        .xfade-stage::before {
            content: "";
            position: absolute;
            left: 10px;
            right: 10px;
            top: 50%;
            height: 6px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.74), rgba(20, 29, 28, 0.72)),
                repeating-linear-gradient(90deg, transparent 0 18px, rgba(255, 255, 255, 0.11) 18px 19px);
            box-shadow:
                inset 0 2px 5px rgba(0, 0, 0, 0.8),
                0 1px 0 rgba(255, 255, 255, 0.06);
            transform: translateY(-50%);
        }

        .xfade-stage::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 4px;
            bottom: 4px;
            width: 1px;
            background: rgba(255, 209, 102, 0.76);
            box-shadow: 0 0 10px rgba(255, 209, 102, 0.34);
            transform: translateX(-50%);
        }

        .xfade input {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 24px;
            margin: 0;
            accent-color: var(--amber);
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            cursor: grab;
        }

        .xfade input:active {
            cursor: grabbing;
        }

        .xfade input:focus-visible {
            outline: 2px solid rgba(255, 209, 102, 0.86);
            outline-offset: 3px;
        }

        .xfade input::-webkit-slider-runnable-track {
            height: 24px;
            background: transparent;
        }

        .xfade input::-moz-range-track {
            height: 24px;
            background: transparent;
            border: 0;
        }

        .xfade input::-webkit-slider-thumb {
            width: 26px;
            height: 18px;
            margin-top: 3px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 4px;
            background:
                linear-gradient(90deg, transparent 0 42%, rgba(0, 0, 0, 0.32) 42% 58%, transparent 58%),
                linear-gradient(180deg, #e5fff8 0%, #7f9f99 48%, #263331 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 0 -9px 14px rgba(0, 0, 0, 0.36),
                0 3px 10px rgba(0, 0, 0, 0.56),
                0 0 14px rgba(255, 209, 102, 0.22);
            appearance: none;
            -webkit-appearance: none;
        }

        .xfade input::-moz-range-thumb {
            width: 26px;
            height: 18px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 4px;
            background:
                linear-gradient(90deg, transparent 0 42%, rgba(0, 0, 0, 0.32) 42% 58%, transparent 58%),
                linear-gradient(180deg, #e5fff8 0%, #7f9f99 48%, #263331 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 0 -9px 14px rgba(0, 0, 0, 0.36),
                0 3px 10px rgba(0, 0, 0, 0.56),
                0 0 14px rgba(255, 209, 102, 0.22);
        }

        .scope {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            background:
                radial-gradient(circle at 50% 50%, rgba(117, 255, 214, 0.08), transparent 58%),
                linear-gradient(rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                rgba(2, 5, 5, 0.9);
            background-size: auto, 24px 24px, 24px 24px, auto;
        }

        #scopeCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .status {
            display: inline-flex;
            grid-area: status;
            align-items: center;
            align-self: center;
            min-height: 26px;
            min-width: 0;
            max-width: 100%;
            padding: 4px 8px;
            border: 1px solid rgba(255, 209, 102, 0.18);
            border-radius: 6px;
            color: rgba(255, 209, 102, 0.9);
            background: rgba(255, 209, 102, 0.045);
            font-size: 0.66rem;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--green);
        }

        .knob-button {
            --knob-size: var(--knob-md);
            --knob-color: var(--green);
            position: relative;
            display: inline-grid;
            place-items: center;
            width: var(--knob-size);
            min-width: var(--knob-size);
            max-width: var(--knob-size);
            height: var(--knob-size);
            min-height: var(--knob-size);
            max-height: var(--knob-size);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            padding: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(0, 0, 0, 0.88) 0 57%, transparent 58%);
            touch-action: none;
            user-select: none;
        }

        .knob-button::before {
            content: "";
            position: absolute;
            inset: 5px;
            z-index: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.12), transparent 46%),
                rgba(0, 0, 0, 0.82);
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.06);
        }

        .knob-ring {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .knob-track,
        .knob-active {
            fill: none;
            stroke-linecap: round;
            stroke-width: 5;
        }

        .knob-track {
            stroke: rgba(255, 255, 255, 0.12);
        }

        .knob-active {
            stroke: var(--knob-color);
        }

        .knob-notch {
            stroke: rgba(233, 255, 249, 0.72);
            stroke-linecap: round;
            stroke-width: 4;
        }

        .knob-button.is-off {
            color: rgba(255, 107, 98, 0.86);
            border-color: rgba(255, 107, 98, 0.3);
        }

        .knob-button.is-bipolar {
            --knob-size: var(--knob-md);
        }

        .knob-button.is-lane-knob {
            --knob-size: var(--knob-sm);
        }

        .knob-button.is-insert-knob {
            --knob-size: var(--knob-sm);
        }

        .knob-button.is-master-knob {
            --knob-size: var(--knob-lg);
        }

        .knob-button.is-negative {
            color: rgba(101, 183, 255, 0.9);
        }

        .knob-value {
            position: relative;
            z-index: 3;
            max-width: calc(var(--knob-size) - 10px);
            overflow: hidden;
            color: currentColor;
            font-family: var(--mono);
            font-size: 0.58rem;
            font-weight: 800;
            line-height: 1;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .knob-button.is-lane-knob .knob-value,
        .knob-button.is-compact .knob-value {
            display: none;
        }

        .knob-button.is-bipolar::before {
            box-shadow:
                inset 0 0 16px rgba(255, 255, 255, 0.06),
                0 -12px 0 -11px rgba(255, 209, 102, 0.82);
        }

        .knob-input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <main class="app" id="station" aria-label="Synthstream generative DJ station">
        <header class="topbar">
            <div class="brand">
                <h1>Generative DJ Synth Station</h1>
                <span class="tag">Synthstream / Hypnotic loop engine</span>
            </div>
            <div class="readout" aria-live="polite">
                <span id="tempoLight" class="tempo-light" aria-hidden="true"></span>
                <span id="readout">--- BPM / 4/4 / 16 Steps / Standby</span>
            </div>
        </header>

        <section class="decks" id="decks" aria-label="Deck controls"></section>

        <section class="mixer" aria-label="Transport and master mixer">
            <div class="transport">
                <div class="transport-buttons">
                    <button class="transport-button primary" id="playButton" type="button" data-control="button">Play</button>
                    <button class="transport-button" id="stopButton" type="button" data-control="button">Stop</button>
                    <button class="transport-button hot" id="mutateButton" type="button" data-control="button">Mutate</button>
                </div>
                <div class="step-module">
                    <div class="step-topline">
                        <div class="step-readout" id="stepReadout">Step 01 / 16</div>
                    </div>
                    <div class="step-legend" aria-hidden="true">
                        <span>1</span><span></span><span></span><span>4</span><span></span><span></span><span></span><span>8</span><span></span><span></span><span></span><span>12</span><span></span><span></span><span></span><span>16</span>
                    </div>
                    <div class="step-grid" id="stepGrid" aria-label="16-step position display"></div>
                </div>
                <div class="status" id="status">Press Play to unlock audio</div>
                <button class="transport-button reset-button" id="resetButton" type="button" data-control="button">Reset Station</button>
            </div>

            <div class="fx-panel" aria-label="Send FX">
                <div class="fx-row">
                    <span class="control-label">Delay</span>
                    <div class="division-group" id="divisionGroup" aria-label="Delay division"></div>
                    <span class="value" id="divisionValue">1/4</span>
                </div>
                <div class="send-fx-row">
                    <span class="send-fx-control">
                        <span class="control-label">Send A</span>
                        <span class="control-row">
                            <button class="knob-button" type="button" data-control="knob" data-knob data-input="send-a" data-kind="unipolar" data-show-value="false" aria-label="Deck A FX send">
                                <svg class="knob-ring" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                                    <path class="knob-track"></path>
                                    <path class="knob-active"></path>
                                    <line class="knob-notch" x1="50" y1="13" x2="50" y2="24"></line>
                                </svg>
                            </button>
                            <input class="knob-input" id="send-a" type="range" min="0" max="100" value="0" tabindex="-1" data-send="a">
                        </span>
                    </span>
                    <span class="send-fx-control">
                        <span class="control-label">Send B</span>
                        <span class="control-row">
                            <button class="knob-button" type="button" data-control="knob" data-knob data-input="send-b" data-kind="unipolar" data-show-value="false" aria-label="Deck B FX send">
                                <svg class="knob-ring" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                                    <path class="knob-track"></path>
                                    <path class="knob-active"></path>
                                    <line class="knob-notch" x1="50" y1="13" x2="50" y2="24"></line>
                                </svg>
                            </button>
                            <input class="knob-input" id="send-b" type="range" min="0" max="100" value="0" tabindex="-1" data-send="b">
                        </span>
                    </span>
                    <span class="send-fx-control">
                        <span class="control-label">Feedback</span>
                        <span class="control-row">
                            <button class="knob-button" type="button" data-control="knob" data-knob data-input="feedbackControl" data-kind="unipolar" aria-label="Feedback">
                            </button>
                            <input class="knob-input" id="feedbackControl" type="range" min="0" max="100" value="0" tabindex="-1">
                        </span>
                        <span class="value" id="feedbackValue">0</span>
                    </span>
                    <span class="send-fx-control">
                        <span class="control-label">Return</span>
                        <span class="control-row">
                            <button class="knob-button" type="button" data-control="knob" data-knob data-input="fxReturnControl" data-kind="unipolar" aria-label="FX Return">
                            </button>
                            <input class="knob-input" id="fxReturnControl" type="range" min="0" max="100" value="0" tabindex="-1">
                        </span>
                        <span class="value" id="fxReturnValue">0</span>
                    </span>
                </div>
                <div class="scope" aria-label="Compact oscilloscope">
                    <canvas id="scopeCanvas"></canvas>
                </div>
            </div>

            <div class="master-panel">
                <div class="master-row">
                    <span class="control-label">Output</span>
                    <span class="control-row">
                        <button class="knob-button is-master-knob" type="button" data-control="knob" data-knob data-input="masterControl" data-kind="unipolar" aria-label="Master output">
                        </button>
                        <input class="knob-input" id="masterControl" type="range" min="0" max="100" value="58" tabindex="-1">
                    </span>
                </div>
                <div class="meter">
                    <span class="meter-label">Master Meter</span>
                    <div class="meter-track"><span class="meter-fill" data-master-meter></span></div>
                    <span class="meter-hint">Output</span>
                </div>
                
                <div class="xfade-block">
                    <span class="xfade-title">Crossfader</span>
                    <label class="xfade">
                        <span class="xfade-label">A</span>
                        <span class="xfade-stage">
                            <input id="crossfaderControl" type="range" min="0" max="100" value="50" aria-label="Crossfader" data-control="slider">
                        </span>
                        <span class="xfade-label">B</span>
                    </label>
                </div>
            </div>
        </section>
        <span class="virtual-cursor" id="virtualCursor" aria-hidden="true"></span>
    </main>

    <script defer src="controls.js"></script>
    <script defer src="lanes.js"></script>
    <script defer src="knobs.js"></script>
    <script defer src="render.js"></script>
    <script defer src="play.js"></script>
    <script defer src="vcursor.js"></script>
    <script defer src="init.js"></script>
</body>
</html>
