<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthstream</title>
    <style>
        :root {
            --bg: #050607;
            --panel: rgba(12, 16, 17, 0.92);
            --panel-soft: rgba(255, 255, 255, 0.055);
            --panel-hard: rgba(0, 0, 0, 0.34);
            --line: rgba(120, 255, 217, 0.24);
            --line-hot: rgba(117, 255, 214, 0.76);
            --text: #e9fff9;
            --muted: #7f9790;
            --green: #75ffd6;
            --amber: #ffd166;
            --pink: #ff5c9d;
            --blue: #65b7ff;
            --red: #ff6b62;
            --shadow: rgba(117, 255, 214, 0.28);
            --knob-sm: 34px;
            --knob-md: 50px;
            --knob-lg: 58px;
            --font: "Inter", "Segoe UI", system-ui, sans-serif;
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow-x: hidden;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 12px;
            background:
                linear-gradient(rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(117, 255, 214, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 50% 16%, rgba(101, 183, 255, 0.18), transparent 34rem),
                radial-gradient(circle at 84% 86%, rgba(255, 92, 157, 0.12), transparent 24rem),
                linear-gradient(135deg, #07090a 0%, #101414 48%, #040505 100%);
            background-size: 34px 34px, 34px 34px, auto, auto, auto;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            z-index: 4;
            background:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 4px),
                radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.7) 100%);
            mix-blend-mode: screen;
            opacity: 0.38;
        }

        body::after {
            z-index: 5;
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.88);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            color: inherit;
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: 74px minmax(0, 1fr) 210px;
            gap: 12px;
            width: min(1600px, calc(100vw - 24px), calc((100vh - 24px) * 16 / 9));
            aspect-ratio: 16 / 9;
            min-height: 0;
            padding: 12px;
        }

        .app.is-station-locked,
        .app.is-station-locked * {
            cursor: none;
        }

        .virtual-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 20;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(233, 255, 249, 0.95);
            border-radius: 50%;
            background: rgba(117, 255, 214, 0.2);
            box-shadow: 0 0 14px rgba(117, 255, 214, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate3d(-999px, -999px, 0);
            transition: opacity 120ms ease;
        }

        .app.is-station-locked .virtual-cursor {
            opacity: 1;
        }

        .app.is-virtual-knob-dragging .virtual-cursor {
            opacity: 0;
        }

        .topbar,
        .deck,
        .mixer {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow:
                inset 0 0 32px rgba(117, 255, 214, 0.045),
                0 24px 80px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(14px);
        }

        .topbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            min-height: 64px;
            padding: 10px 14px;
        }

        .brand {
            display: grid;
            gap: 4px;
            min-width: 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--green);
            font-size: clamp(1.25rem, 2.4vw, 2rem);
            line-height: 1;
            letter-spacing: 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--shadow);
        }

        .readout,
        .tag,
        .deck-kicker,
        .lane,
        .control-label,
        .status,
        .step-readout,
        .meter-label,
        .pattern {
            font-family: var(--mono);
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .tag,
        .readout {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .readout {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            color: var(--amber);
            white-space: nowrap;
        }

        .tempo-light {
            width: 10px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 18px rgba(255, 209, 102, 0.75);
            opacity: 0.45;
        }

        .tempo-light.is-hot {
            opacity: 1;
        }

        .decks {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            min-height: 0;
        }

        .deck {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-width: 0;
            min-height: 0;
            padding: 12px;
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .deck-title {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .deck-title strong {
            font-size: 0.88rem;
            text-transform: uppercase;
        }

        .deck-kicker {
            color: var(--muted);
            font-size: 0.66rem;
        }

        .deck-status-light {
            width: 10px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
        }

        .deck.has-enabled .deck-status-light {
            border-color: rgba(117, 255, 214, 0.5);
            background: rgba(117, 255, 214, 0.34);
            box-shadow: 0 0 10px rgba(117, 255, 214, 0.22);
        }

        .deck.is-active .deck-status-light {
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 14px rgba(255, 209, 102, 0.45);
        }

        .eq-bank {
            display: inline-grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            align-items: start;
            width: 100%;
        }

        .eq-band {
            display: grid;
            justify-items: center;
            align-content: start;
            gap: 3px;
            min-width: 0;
        }

        .eq-band-label {
            font-family: var(--mono);
            font-size: 0.56rem;
            line-height: 1;
            text-transform: uppercase;
        }

        .eq-band-label {
            color: var(--muted);
        }

        .transport-button,
        .division-button,
        .knob-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: var(--text);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .lane-grid {
            display: grid;
            grid-template-columns: 72px 40px minmax(260px, 1fr) 18px;
            align-content: start;
            gap: 5px 8px;
            padding: 12px 0;
            min-height: 0;
        }

        .lane {
            display: contents;
        }

        .lane-cell {
            display: flex;
            align-items: center;
            min-height: 30px;
            min-width: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lane-name {
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .lane.is-enabled .lane-name {
            color: var(--text);
        }

        .pattern {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            width: 100%;
            gap: 2px;
            font-size: 0.74rem;
            color: var(--muted);
        }

        .pattern span {
            display: grid;
            place-items: center;
            min-width: 0;
            height: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.22);
        }

        .pattern span.is-hit {
            color: var(--green);
            border-color: rgba(117, 255, 214, 0.24);
            background: rgba(117, 255, 214, 0.055);
        }

        .pattern span.is-soft {
            color: var(--blue);
        }

        .pattern span.is-sustain {
            color: var(--amber);
        }

        .pattern span.is-current {
            color: #03100d;
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        }

        .level {
            justify-content: center;
        }

        .value {
            flex: 0 0 25px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.66rem;
            text-align: right;
        }

        .lane-meter {
            justify-content: center;
        }

        .lane-meter span {
            width: 7px;
            height: 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }

        .lane.is-pulsing .lane-meter span {
            background: var(--pink);
            box-shadow: 0 0 14px rgba(255, 92, 157, 0.55);
        }

        .deck-strip {
            display: grid;
            grid-template-columns: 1fr repeat(3, 92px) minmax(160px, 1fr);
            gap: 8px;
            align-items: start;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .strip-block {
            display: grid;
            align-content: start;
            justify-items: start;
            gap: 6px;
            min-width: 0;
            min-height: 74px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.22);
        }

        .deck-level {
            min-width: 0;
            border-color: rgba(117, 255, 214, 0.18);
            background: rgba(117, 255, 214, 0.035);
        }

        .control-row {
            display: inline-grid;
            grid-template-columns: max-content;
            align-items: center;
            justify-items: center;
            gap: 4px;
            width: max-content;
            min-width: max-content;
        }

        .control-label,
        .meter-label {
            color: var(--muted);
            font-size: 0.66rem;
        }

        .meter {
            display: grid;
            gap: 5px;
            align-content: center;
            justify-items: stretch;
        }

        .meter-track {
            position: relative;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            background:
                repeating-linear-gradient(90deg, transparent 0 18%, rgba(255, 255, 255, 0.13) 18% 19%, transparent 19% 20%),
                rgba(0, 0, 0, 0.34);
        }

        .meter-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            background: linear-gradient(90deg, var(--green) 0 68%, var(--amber) 68% 86%, var(--red) 86% 100%);
            box-shadow: 0 0 18px rgba(117, 255, 214, 0.26);
        }

        .meter-hint {
            color: rgba(127, 151, 144, 0.78);
            font-family: var(--mono);
            font-size: 0.56rem;
            text-transform: uppercase;
        }

        .mixer {
            display: grid;
            grid-template-columns: minmax(330px, 0.95fr) minmax(390px, 1.08fr) minmax(340px, 0.95fr);
            gap: 12px;
            min-height: 0;
            padding: 12px;
        }

        .transport,
        .fx-panel,
        .master-panel {
            display: grid;
            align-content: start;
            gap: 10px;
            min-width: 0;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.24);
        }

        .transport {
            grid-template:
                "buttons buttons" auto
                "step step" auto
                "status reset" auto / minmax(0, 1fr) auto;
            align-content: stretch;
            overflow: hidden;
        }

        .transport-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            grid-area: buttons;
            min-width: 0;
        }

        .transport-button {
            min-height: 38px;
            padding: 0 10px;
            color: var(--text);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .transport-button.primary {
            color: #03100d;
            border-color: var(--line-hot);
            background: linear-gradient(135deg, var(--green), var(--blue));
            box-shadow: 0 0 24px rgba(117, 255, 214, 0.22);
        }

        .transport-button.hot {
            border-color: rgba(255, 92, 157, 0.62);
            background: rgba(255, 92, 157, 0.14);
            box-shadow: inset 0 0 18px rgba(255, 92, 157, 0.14);
        }

        .reset-button {
            grid-area: reset;
            justify-self: start;
            align-self: center;
            min-height: 28px;
            white-space: nowrap;
            border-color: rgba(255, 107, 98, 0.26);
            color: rgba(255, 107, 98, 0.82);
            background: rgba(255, 107, 98, 0.045);
            font-size: 0.64rem;
        }

        .step-module {
            display: grid;
            grid-area: step;
            gap: 5px;
            min-width: 0;
        }

        .step-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
        }

        .step-readout {
            color: var(--amber);
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .step-legend {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            gap: 3px;
            min-width: 0;
            color: rgba(127, 151, 144, 0.8);
            font-family: var(--mono);
            font-size: 0.52rem;
            line-height: 1;
            text-align: center;
        }

        .step-grid {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            align-items: center;
            gap: 3px;
            min-width: 0;
        }

        .step-grid span {
            display: grid;
            place-items: center;
            justify-self: center;
            width: 7px;
            height: 7px;
            min-height: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: transparent;
            font-size: 0;
            background: rgba(255, 255, 255, 0.12);
        }

        .step-grid span.is-beat {
            width: 9px;
            height: 9px;
            border-color: rgba(117, 255, 214, 0.24);
            background: rgba(117, 255, 214, 0.2);
        }

        .step-grid span.is-current {
            border-color: var(--amber);
            background: var(--amber);
            box-shadow: 0 0 12px rgba(255, 209, 102, 0.34);
        }

        .fx-row,
        .master-row {
            display: grid;
            grid-template-columns: 82px max-content minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        .division-group {
            display: inline-grid;
            grid-template-columns: repeat(4, 42px);
            gap: 0;
            overflow: hidden;
            width: max-content;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.24);
        }

        .division-button {
            min-height: 28px;
            padding: 0;
            border: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.68rem;
        }

        .division-button:last-child {
            border-right: 0;
        }

        .division-button.is-active {
            color: #03100d;
            border-color: var(--green);
            background: var(--green);
        }

        [data-control].is-virtual-hover {
            border-color: rgba(117, 255, 214, 0.52);
            box-shadow: 0 0 0 1px rgba(117, 255, 214, 0.12), 0 0 16px rgba(117, 255, 214, 0.18);
        }

        [data-control].is-virtual-pressed {
            transform: translateY(1px);
        }

        .xfade {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: 22px 1fr 22px;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.7rem;
        }

        .xfade-block {
            display: grid;
            gap: 8px;
            padding: 10px;
            border: 1px solid rgba(117, 255, 214, 0.22);
            border-radius: 7px;
            background: rgba(117, 255, 214, 0.045);
        }

        .xfade-title {
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.72rem;
            text-transform: uppercase;
        }

        .xfade input {
            accent-color: var(--amber);
        }

        .scope {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            background:
                radial-gradient(circle at 50% 50%, rgba(117, 255, 214, 0.08), transparent 58%),
                linear-gradient(rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(117, 255, 214, 0.035) 1px, transparent 1px),
                rgba(2, 5, 5, 0.9);
            background-size: auto, 24px 24px, 24px 24px, auto;
        }

        #scopeCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .status {
            display: inline-flex;
            grid-area: status;
            align-items: center;
            align-self: center;
            min-height: 26px;
            min-width: 0;
            max-width: 100%;
            padding: 4px 8px;
            border: 1px solid rgba(255, 209, 102, 0.18);
            border-radius: 6px;
            color: rgba(255, 209, 102, 0.9);
            background: rgba(255, 209, 102, 0.045);
            font-size: 0.66rem;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--green);
        }

        .knob-button {
            --knob-size: var(--knob-md);
            --knob-color: var(--green);
            position: relative;
            display: inline-grid;
            place-items: center;
            width: var(--knob-size);
            min-width: var(--knob-size);
            max-width: var(--knob-size);
            height: var(--knob-size);
            min-height: var(--knob-size);
            max-height: var(--knob-size);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            padding: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(0, 0, 0, 0.88) 0 57%, transparent 58%);
            touch-action: none;
            user-select: none;
        }

        .knob-button::before {
            content: "";
            position: absolute;
            inset: 5px;
            z-index: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.12), transparent 46%),
                rgba(0, 0, 0, 0.82);
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.06);
        }

        .knob-ring {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .knob-track,
        .knob-active {
            fill: none;
            stroke-linecap: round;
            stroke-width: 5;
        }

        .knob-track {
            stroke: rgba(255, 255, 255, 0.12);
        }

        .knob-active {
            stroke: var(--knob-color);
        }

        .knob-notch {
            stroke: rgba(233, 255, 249, 0.72);
            stroke-linecap: round;
            stroke-width: 4;
        }

        .knob-button.is-off {
            color: rgba(255, 107, 98, 0.86);
            border-color: rgba(255, 107, 98, 0.3);
        }

        .knob-button.is-bipolar {
            --knob-size: var(--knob-md);
        }

        .knob-button.is-lane-knob {
            --knob-size: var(--knob-sm);
        }

        .knob-button.is-master-knob {
            --knob-size: var(--knob-lg);
        }

        .knob-button.is-negative {
            color: rgba(101, 183, 255, 0.9);
        }

        .knob-value {
            position: relative;
            z-index: 3;
            max-width: calc(var(--knob-size) - 10px);
            overflow: hidden;
            color: currentColor;
            font-family: var(--mono);
            font-size: 0.58rem;
            font-weight: 800;
            line-height: 1;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .knob-button.is-lane-knob .knob-value,
        .knob-button.is-compact .knob-value {
            display: none;
        }

        .knob-button.is-bipolar::before {
            box-shadow:
                inset 0 0 16px rgba(255, 255, 255, 0.06),
                0 -12px 0 -11px rgba(255, 209, 102, 0.82);
        }

        .knob-input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 980px) {
            .app {
                width: calc(100vw - 16px);
                height: auto;
                min-height: calc(100vh - 16px);
                aspect-ratio: auto;
                grid-template-rows: auto auto auto;
                padding: 8px;
            }

            .topbar,
            .mixer {
                grid-template-columns: 1fr;
            }

            .readout {
                justify-content: center;
            }

            .decks {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .deck {
                overflow-x: auto;
            }

            .lane-grid {
                grid-template-columns: 72px 40px 210px 18px;
                min-width: 410px;
            }

            .deck-strip {
                min-width: 620px;
            }

            .transport-buttons {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .fx-row,
            .master-row {
                grid-template-columns: 72px max-content minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
    <main class="app" id="station" aria-label="Synthstream generative DJ station">
        <header class="topbar">
            <div class="brand">
                <h1>Generative DJ Synth Station</h1>

            <div class="readout" aria-live="polite">

        <section class="decks" id="decks" aria-label="Deck controls"></section>

        <section class="mixer" aria-label="Transport and master mixer">

                        <span>1</span><span></span><span></span><span>4</span><span></span><span></span><span></span><span>8</span><span></span><span></span><span></span><span>12</span><span></span><span></span><span></span><span>16</span>

                    <div class="step-grid" id="stepGrid" aria-label="16-step position display"></div>

            <div class="fx-panel">
                <div class="fx-row">
                    <span class="control-label">Delay</span>

                <div class="fx-row">
                    <span class="control-label">FX Return</span>
                    <span class="control-row">
                        <button class="knob-button" type="button" data-control="knob" data-knob data-input="fxReturnControl" data-kind="unipolar" aria-label="FX Return">
                        </button>
                        <input class="knob-input" id="fxReturnControl" type="range" min="0" max="100" value="42" tabindex="-1">

                    <canvas id="scopeCanvas"></canvas>

                    <div class="meter-track"><span class="meter-fill" data-master-meter></span></div>
                    <span class="meter-hint">Output</span>
                </div>
                <div class="master-row">
                    <span class="control-label">Output</span>
                    <span class="control-row">
                        <button class="knob-button is-master-knob" type="button" data-control="knob" data-knob data-input="masterControl" data-kind="unipolar" aria-label="Master output">
                        </button>
                        <input class="knob-input" id="masterControl" type="range" min="0" max="100" value="58" tabindex="-1">
                    </span>
                    <span class="value" id="masterValue">58</span>
