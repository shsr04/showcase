                    randomNoise(channel) {
                        channel.noiseSeed = (channel.noiseSeed * 1664525 + 1013904223) >>> 0;
                        return channel.noiseSeed / 2147483648 - 1;
                    }

                    updateNoiseKickDuck(frame, amount) {
                        while (this.kicks.length && this.kicks[0] <= frame) {
                            this.noiseKickEnv = 1;
                            this.kicks.shift();
                        }
                        const release = 0.08 + (1 - amount) * 0.16;
                        this.noiseKickEnv *= Math.exp(-1 / (sampleRate * release));
                        const depth = Math.min(0.62, Math.max(0, amount - 0.18) * 0.78);
                        return 1 - this.noiseKickEnv * depth;
                    }

                    targetNoiseLevel(amount) {
                        return 0.024 + Math.pow(amount, 1.35) * 0.15;
                    }

                    clampNoiseRms(sample, amount, channel) {
                        const rmsCoeff = 1 - Math.exp(-1 / (sampleRate * 0.026));
                        channel.noiseRms += (sample * sample - channel.noiseRms) * rmsCoeff;
                        const rms = Math.sqrt(Math.max(0, channel.noiseRms));
                        const target = this.targetNoiseLevel(amount);
                        const desiredGain = rms > target ? target / Math.max(0.000001, rms) : 1;
                        const gainCoeff = desiredGain < channel.noiseLimitGain ? 0.18 : 0.018;
                        channel.noiseLimitGain += (desiredGain - channel.noiseLimitGain) * gainCoeff;
                        channel.noiseLimitGain = Math.min(1, Math.max(0.05, channel.noiseLimitGain));
                        return sample * channel.noiseLimitGain;
                    }

                    clampDynamicRms(sample, target, channel, rmsKey, gainKey, floor = 0.04) {
                        const rmsCoeff = 1 - Math.exp(-1 / (sampleRate * 0.03));
                        channel[rmsKey] += (sample * sample - channel[rmsKey]) * rmsCoeff;
                        const rms = Math.sqrt(Math.max(0, channel[rmsKey]));
                        const desiredGain = rms > target ? target / Math.max(0.000001, rms) : 1;
                        const gainCoeff = desiredGain < channel[gainKey] ? 0.2 : 0.016;
                        channel[gainKey] += (desiredGain - channel[gainKey]) * gainCoeff;
                        channel[gainKey] = Math.min(1, Math.max(floor, channel[gainKey]));
                        return sample * channel[gainKey];
                    }

                    targetNoiseWetLevel(amount) {
                        return 0.032 + Math.pow(amount, 1.25) * 0.063;
                    }

                    targetSpiralReturnLevel(amount) {
                        return 0.063 + Math.pow(amount, 1.15) * 0.049;
                    }

                    softLimitMixed(sample) {
                        return Math.tanh(sample * 1.22) * 0.96;
                    }

                    noiseLayer(x, amount, channel, ch, frame, kickDuck) {
                        if (amount < 0.002) {
                            channel.noiseGate += (1 - channel.noiseGate) * 0.02;
                            channel.noiseRms += (0 - channel.noiseRms) * 0.02;
                            channel.noiseLimitGain += (1 - channel.noiseLimitGain) * 0.02;
                            channel.noiseWetRms += (0 - channel.noiseWetRms) * 0.02;
                            channel.noiseWetLimitGain += (1 - channel.noiseWetLimitGain) * 0.02;
                            return x;
                        }

                        const beat = sampleRate * 60 / this.tempo;
                        const pulseAmount = Math.max(0, (amount - 0.24) / 0.76);
                        const dense = amount > 0.68;
                        const div = dense ? beat / 4 : beat / 2;
                        const phase = (this.phase % div) / div;
                        const openWidth = dense ? 0.2 + (1 - amount) * 0.12 : 0.54 - amount * 0.18;
                        const pulseOpen = phase < openWidth ? 1 : 0;
                        const pulseCurve = pulseOpen ? 1 - Math.pow(phase / Math.max(0.001, openWidth), 2) * 0.22 : 0;
                        const constantAir = Math.max(0, 1 - amount * 1.85);
                        const gateTarget = Math.max(constantAir, pulseCurve);
                        const gateCoeff = pulseOpen ? 0.038 + amount * 0.12 : 0.006 + amount * 0.035;
                        channel.noiseGate += (gateTarget - channel.noiseGate) * gateCoeff;

                        const white = this.randomNoise(channel);
                        const slowRise = dense ? Math.pow((this.phase % (beat * 4)) / (beat * 4), 1.6) : 0;
                        const wobble = Math.sin(this.phase / sampleRate * Math.PI * 2 * (0.09 + amount * 0.19) + ch * 1.9) * 0.5 + 0.5;
                        const cutoff = Math.min(11800, 1300 + amount * amount * 7800 + slowRise * 2600 + wobble * amount * 1700);
                        const f = Math.min(0.82, 2 * Math.sin(Math.PI * cutoff / sampleRate));
                        const damping = Math.max(0.16, 1.08 - amount * 0.78);

                        channel.noiseLow += f * channel.noiseBand;
                        const high = white - channel.noiseLow - damping * channel.noiseBand;
                        channel.noiseBand += f * high;
                        const airCoeff = 0.008 + amount * 0.018;
                        channel.noiseAir += (white - channel.noiseAir) * airCoeff;
                        const highpass = white - channel.noiseAir;
                        const bandpass = Math.tanh(channel.noiseBand * (1.15 + amount * 2.6));
                        const pressure = Math.tanh((bandpass * (0.72 + amount * 1.25) + highpass * (0.32 + amount * 0.18)) * (0.9 + amount * 0.7));
                        const filtered = amount < 0.35
                            ? highpass * 0.72 + bandpass * amount * 0.45
                            : pressure;

                        const env = (1 - pulseAmount * 0.45) + channel.noiseGate * pulseAmount * 1.15;
                        const resComp = 1 / (1 + amount * 1.65);
                        const cappedNoise = this.clampNoiseRms(filtered * env * kickDuck * resComp, amount, channel);
                        const wet = Math.min(1, amount * amount * 0.9 + amount * 0.12) * this.noiseMaxWet;
                        const wetNoise = this.clampDynamicRms(cappedNoise * wet, this.targetNoiseWetLevel(amount), channel, "noiseWetRms", "noiseWetLimitGain", 0.05);
                        return this.softLimitMixed(x + wetNoise);
                    }

                    updatePump(frame, amount) {
                        while (this.kicks.length && this.kicks[0] <= frame) {
                            this.pumpEnv = 1;
                            this.kicks.shift();
                        }
                        if (amount < 0.002) {
                            this.pumpEnv *= 0.995;
                            return 1;
                        }
                        const release = 0.11 + (1 - amount) * 0.24;
                        this.pumpEnv *= Math.exp(-1 / (sampleRate * release));
                        const depth = Math.min(0.82, Math.pow(amount, 1.08) * 0.82);
                        return Math.max(0.1, 1 - this.pumpEnv * depth);
                    }

                    maybeLatchStutter(amount, frame) {
                        const active = amount > 0.015;
                        const beat = sampleRate * 60 / this.tempo;
                        const lengthTarget = beat * (0.5 - Math.min(0.44, amount * 0.44));
                        const length = Math.max(96, Math.min(this.maxBuffer - 1, Math.round(lengthTarget)));
                        if (!active) {
                            this.wasStuttering = false;
                            this.nextLatchFrame = frame;
                            return;
                        }
                        if (!this.wasStuttering || frame >= this.nextLatchFrame || Math.abs(length - this.repeatLength) > sampleRate * 0.03) {
                            this.repeatLength = length;
                            const start = (this.writeIndex - length + this.maxBuffer) % this.maxBuffer;
                            this.channels.forEach(channel => {
                                for (let i = 0; i < length; i += 1) {
                                    channel.repeat[i] = channel.buffer[(start + i) % this.maxBuffer];
                                }
                            });
                            this.repeatIndex = 0;
                            this.nextLatchFrame = frame + length;
                            this.wasStuttering = true;
                        }
                    }

                    stutter(x, amount, channel) {
                        if (amount < 0.015 || this.repeatLength <= 1) return x;
                        const wet = Math.min(0.92, 0.18 + amount * 0.78);
                        const chopPhase = this.repeatIndex / Math.max(1, this.repeatLength);
                        const chop = amount < 0.45 ? 1 : (chopPhase < 0.72 - amount * 0.28 ? 1 : 1 - amount * 0.65);
                        return x * (1 - wet) + channel.repeat[this.repeatIndex] * wet * chop;
                    }

                    beatReverse(x, amount, channel) {
                        channel.reverseBuffer[this.writeIndex] = x;
                        if (amount < 0.015) return x;
                        const beat = sampleRate * 60 / this.tempo;
                        const length = Math.max(128, Math.min(this.maxBuffer - 1, Math.round(beat * (1 - amount * 0.875))));
                        const slicePos = this.phase % length;
                        const readOffset = length - 1 - slicePos;
                        const readIndex = (this.writeIndex - readOffset + this.maxBuffer) % this.maxBuffer;
                        const reversed = channel.reverseBuffer[readIndex] || 0;
                        const edge = Math.max(32, Math.min(960, length * 0.12));
                        const fade = Math.min(1, slicePos / edge, (length - 1 - slicePos) / edge);
                        const wet = Math.min(0.86, 0.12 + amount * 0.78) * Math.max(0, fade);
                        return x * (1 - wet) + reversed * wet;
                    }

                    spiral(x, amount, channel) {
                        if (amount < 0.002) {
                            channel.spiralBuffer[channel.spiralIndex] = x;
                            channel.spiralIndex = (channel.spiralIndex + 1) % channel.spiralBuffer.length;
                            channel.spiralLp += (0 - channel.spiralLp) * 0.01;
                            channel.spiralBp += (0 - channel.spiralBp) * 0.01;
                            channel.spiralReturnRms += (0 - channel.spiralReturnRms) * 0.02;
                            channel.spiralReturnLimitGain += (1 - channel.spiralReturnLimitGain) * 0.02;
                            return x;
                        }
                        const beat = sampleRate * 60 / this.tempo;
                        const div = amount < 0.33 ? 0.75 : amount < 0.68 ? 0.5 : 0.25;
                        const wobble = Math.sin(this.phase / sampleRate * Math.PI * 2 * (0.12 + amount * 0.48));
                        const delay = Math.max(96, Math.min(this.maxBuffer - 2, beat * div * (1 + wobble * amount * 0.08)));
                        const delayed = this.readDelay(channel.spiralBuffer, channel.spiralIndex, delay);
                        const toneFreq = 180 + amount * amount * 2400 + (wobble + 1) * amount * 520;
                        const f = Math.min(0.55, 2 * Math.sin(Math.PI * toneFreq / sampleRate));
                        const damp = Math.max(0.24, 1.05 - amount * 0.62);
                        channel.spiralLp += f * channel.spiralBp;
                        const high = delayed - channel.spiralLp - damp * channel.spiralBp;
                        channel.spiralBp += f * high;
                        const tonal = Math.tanh((channel.spiralBp * (1.2 + amount * 2.2) + channel.spiralLp * 0.42) * (0.88 + amount * 0.55));
                        const feedback = Math.min(0.68, 0.14 + amount * 0.54);
                        const write = Math.max(-1.15, Math.min(1.15, x + tonal * feedback));
                        channel.spiralBuffer[channel.spiralIndex] = write;
                        channel.spiralIndex = (channel.spiralIndex + 1) % channel.spiralBuffer.length;
                        const wet = Math.min(0.72, amount * 0.76);
                        const spiralReturn = this.clampDynamicRms(tonal * wet, this.targetSpiralReturnLevel(amount), channel, "spiralReturnRms", "spiralReturnLimitGain", 0.05);
                        return this.softLimitMixed(x + spiralReturn);
                    }

                    mobius(x, amount, channel, ch) {
                        if (amount < 0.002) {
                            channel.mobiusFb += (0 - channel.mobiusFb) * 0.01;
                            channel.mobiusLp += (0 - channel.mobiusLp) * 0.01;
                            channel.mobiusBp += (0 - channel.mobiusBp) * 0.01;
                            return x;
                        }
                        const rate = 0.045 + amount * amount * 0.18;
                        const direction = amount < 0.5 ? -1 : 1;
                        const cycleRaw = (this.phase / sampleRate * rate + ch * 0.035) % 1;
                        const cycle = direction > 0 ? cycleRaw : 1 - cycleRaw;
                        const base = 82.41;
                        let shepard = 0;
                        let ampSum = 0;
                        for (let i = 0; i < 4; i += 1) {
                            const layerPos = (i + cycle) / 4;
                            const amp = Math.sin(layerPos * Math.PI);
                            const freq = Math.min(5600, base * Math.pow(2, i - 1 + cycle * 2.4));
                            channel.mobiusPhases[i] += Math.PI * 2 * freq / sampleRate;
                            if (channel.mobiusPhases[i] > Math.PI * 2) channel.mobiusPhases[i] -= Math.PI * 2;
                            shepard += Math.sin(channel.mobiusPhases[i]) * amp;
                            ampSum += amp;
                        }
                        shepard /= Math.max(0.001, ampSum);
                        const toneFreq = 360 + amount * amount * 5200 + cycle * amount * 2200;
                        const f = Math.min(0.62, 2 * Math.sin(Math.PI * toneFreq / sampleRate));
                        const damp = Math.max(0.2, 0.92 - amount * 0.54);
                        const excite = shepard + channel.mobiusFb * (0.28 + amount * 0.34) + x * amount * 0.18;
                        channel.mobiusLp += f * channel.mobiusBp;
                        const high = excite - channel.mobiusLp - damp * channel.mobiusBp;
                        channel.mobiusBp += f * high;
                        const pressure = Math.tanh((shepard * 0.62 + channel.mobiusBp * (1.1 + amount * 2.5)) * (0.92 + amount * 0.9));
                        channel.mobiusFb = Math.max(-0.95, Math.min(0.95, pressure));
                        const wet = Math.min(1, amount * amount * 0.94 + amount * 0.13) * this.mobiusMaxWet;
                        return this.softLimitMixed(x + pressure * wet);
                    }

                    gateAmount(amount) {
                        if (amount < 0.002) return 1;
                        const beat = sampleRate * 60 / this.tempo;
                        const dense = amount > 0.66;
                        const div = amount < 0.34 ? beat / 2 : dense ? beat / 8 : beat / 4;
                        const phase = (this.phase % div) / div;
                        const openWidth = amount < 0.34 ? 0.86 : amount < 0.66 ? 0.58 : 0.34;
                        const open = phase < openWidth ? 1 : 0;
                        const depth = amount < 0.34 ? amount * 0.45 : Math.min(0.96, 0.2 + amount * 0.78);
                        const target = 1 - depth * (1 - open);
                        const edgeMs = 0.001 + (1 - amount) * 0.004;
                        const coeff = 1 - Math.exp(-1 / (sampleRate * edgeMs));
                        this.gateGain += (target - this.gateGain) * coeff;
                        return this.gateGain;
                    }

                    readDelay(buffer, index, delay) {
                        const length = buffer.length;
                        const read = (index - delay + length) % length;
                        const i0 = Math.floor(read);
                        const i1 = (i0 + 1) % length;
                        const frac = read - i0;
                        return buffer[i0] * (1 - frac) + buffer[i1] * frac;
                    }

                    sweep(x, amount, channel, ch) {
                        if (amount < 0.002) {
                            channel.sweepBuffer[channel.sweepIndex] = x;
                            channel.sweepIndex = (channel.sweepIndex + 1) % channel.sweepBuffer.length;
                            return x;
                        }
                        const phase = this.phase / sampleRate;
                        const rate = 0.055 + amount * amount * 0.42;
                        const lfo = Math.sin(phase * Math.PI * 2 * rate + ch * 1.7);
                        const subtle = Math.min(1, amount * 2.2);
                        const harsh = Math.max(0, amount * 1.7 - 0.7);
                        const delay = 18 + subtle * 170 + harsh * 310 + (1 + lfo) * (18 + amount * 250);
                        const delayed = this.readDelay(channel.sweepBuffer, channel.sweepIndex, delay);
                        const feedback = Math.min(0.72, amount * 0.18 + harsh * 0.42);
                        channel.sweepBuffer[channel.sweepIndex] = Math.max(-1.2, Math.min(1.2, x + delayed * feedback));
                        channel.sweepIndex = (channel.sweepIndex + 1) % channel.sweepBuffer.length;
                        const wet = Math.min(0.78, 0.12 + amount * 0.72);
                        const polarity = amount < 0.42 ? -1 : 1;
                        return x * (1 - wet) + delayed * wet * polarity;
                    }

                    resonator(x, amount, channel) {
                        if (amount < 0.002) {
                            channel.resoBuffer[channel.resoIndex] = 0;
                            channel.resoIndex = (channel.resoIndex + 1) % channel.resoBuffer.length;
                            return x;
                        }
                        const bend = Math.pow(amount, 0.82);
                        const noteIndex = Math.min(this.resoFrequencies.length - 1, Math.floor(bend * this.resoFrequencies.length));
                        const fine = 1 + (amount - 0.5) * 0.035;
                        const frequency = this.resoFrequencies[noteIndex] * fine;
                        const delay = Math.max(8, Math.min(channel.resoBuffer.length - 2, sampleRate / frequency));
                        const comb = this.readDelay(channel.resoBuffer, channel.resoIndex, delay);
                        const feedback = Math.min(0.86, 0.34 + amount * 0.48);
                        channel.resoBuffer[channel.resoIndex] = Math.max(-1.15, Math.min(1.15, x + comb * feedback));
                        channel.resoIndex = (channel.resoIndex + 1) % channel.resoBuffer.length;
                        const wet = Math.min(0.74, 0.13 + amount * 0.68);
                        return x * (1 - wet) + Math.tanh(comb * (1.4 + amount * 2.1)) * wet;
                    }

                    shift(x, amount, channel, ch) {
                        if (amount < 0.002) return x;
                        const low = Math.min(1, amount * 2.4);
                        const high = Math.max(0, amount * 1.35 - 0.35);
                        const frequency = 0.35 + low * 6 + high * high * 145;
                        channel.shiftPhase += Math.PI * 2 * frequency / sampleRate * (ch ? 1.013 : 1);
                        if (channel.shiftPhase > Math.PI * 2) channel.shiftPhase -= Math.PI * 2;
                        const diff = x - channel.shiftLast;
                        channel.shiftLast = x;
                        channel.shiftQuad += (diff - channel.shiftQuad) * (0.08 + amount * 0.18);
                        const shifted = x * Math.cos(channel.shiftPhase) - channel.shiftQuad * Math.sin(channel.shiftPhase) * (2.2 + amount * 1.6);
                        const wet = Math.min(0.82, amount * 0.86);
                        return x * (1 - wet) + shifted * wet;
                    }

                    space(x, amount, channel, ch) {
                        if (amount < 0.002) return x;
                        const lowCutCoeff = 0.004 + amount * 0.022;
                        channel.spaceLp += (x - channel.spaceLp) * lowCutCoeff;
                        const input = (x - channel.spaceLp) * (0.5 + amount * 0.58);
                        const feedback = Math.min(0.88, 0.42 + amount * 0.42);
                        const dampCoeff = 0.18 - amount * 0.115;
                        let wash = 0;
                        for (let i = 0; i < channel.spaceLines.length; i += 1) {
                            const line = channel.spaceLines[i];
                            const write = this.phase % line.length;
                            const size = 0.38 + amount * 0.56;
                            const offset = Math.max(1, Math.floor(line.length * size));
                            const read = (write - offset + line.length) % line.length;
                            const delayed = line[read];
                            channel.spaceDamp[i] += (delayed - channel.spaceDamp[i]) * dampCoeff;
                            line[write] = Math.max(-1.1, Math.min(1.1, input + channel.spaceDamp[i] * feedback * (i % 2 ? -0.82 : 0.82)));
                            wash += delayed * (i % 2 ? -0.25 : 0.25);
                        }
                        const wet = Math.min(1, amount * 1.02) * this.spaceMaxWet;
                        return x * (1 - wet) + wash * wet * (ch ? -1 : 1);
                    }

                    applyWidth(left, right, amount) {
                        if (amount < 0.002) return [left, right];
                        const mid = (left + right) * 0.5;
                        const rawSide = (left - right) * 0.5;
                        const sideHpCoeff = 0.012 + amount * 0.018;
                        const midLpCoeff = 0.006 + amount * 0.008;
                        this.widthLp += (rawSide - this.widthLp) * sideHpCoeff;
                        this.widthMidLp += (mid - this.widthMidLp) * midLpCoeff;

                        const sideHigh = rawSide - this.widthLp;
                        const midLow = this.widthMidLp;
                        const midHigh = mid - midLow;
                        const monoSource = Math.abs(sideHigh) < Math.abs(midHigh) * 0.04;
                        const generatedSide = midHigh * (monoSource ? 0.38 : 0.22) * amount;

                        this.widthModPhaseA += Math.PI * 2 * (0.07 + amount * 0.18) / sampleRate;
                        this.widthModPhaseB += Math.PI * 2 * (0.11 + amount * 0.23) / sampleRate;
                        if (this.widthModPhaseA > Math.PI * 2) this.widthModPhaseA -= Math.PI * 2;
                        if (this.widthModPhaseB > Math.PI * 2) this.widthModPhaseB -= Math.PI * 2;

                        const haasDepth = Math.min(1, amount * 1.8);
                        const chorusDepth = Math.max(0, amount * 1.55 - 0.55);
                        const modA = Math.sin(this.widthModPhaseA);
                        const modB = Math.sin(this.widthModPhaseB + Math.PI);
                        const leftDelay = 3 + haasDepth * 18 + chorusDepth * (11 + modA * 7);
                        const rightDelay = 5 + haasDepth * 24 + chorusDepth * (13 + modB * 8);
                        const leftMicro = this.readDelay(this.widthLeftDelay, this.widthLeftIndex, leftDelay);
                        const rightMicro = this.readDelay(this.widthRightDelay, this.widthRightIndex, rightDelay);
                        this.widthLeftDelay[this.widthLeftIndex] = midHigh + generatedSide;
                        this.widthRightDelay[this.widthRightIndex] = midHigh - generatedSide;
                        this.widthLeftIndex = (this.widthLeftIndex + 1) % this.widthLeftDelay.length;
                        this.widthRightIndex = (this.widthRightIndex + 1) % this.widthRightDelay.length;

                        const microSide = (leftMicro - rightMicro) * (0.18 + amount * 0.24);
                        const chorusSide = chorusDepth > 0 ? (leftMicro + rightMicro) * chorusDepth * 0.08 : 0;
                        const sideGain = 0.12 + amount * 1.72;
                        const side = sideHigh * sideGain + generatedSide + microSide + chorusSide;
                        const highMidTrim = 1 - Math.max(0, amount - 0.72) * 0.12;
                        const trim = 1 / (1 + Math.max(0, amount - 0.55) * 0.68);
                        return [(midLow + midHigh * highMidTrim + side) * trim, (midLow + midHigh * highMidTrim - side) * trim];
                    }

                    process(inputs, outputs) {
                        const input = inputs[0];
                        const output = outputs[0];
                        const frames = output[0]?.length || 0;
                        if (!input.length) return true;

                        for (let i = 0; i < frames; i += 1) {
                            const dirt = this.smoothParam("dirt");
                            const crush = this.smoothParam("crush");
                            const noise = this.smoothParam("noise");
                            const stutter = this.smoothParam("stutter");
                            const gate = this.smoothParam("gate");
                            const space = this.smoothParam("space");
                            const sweep = this.smoothParam("sweep");
                            const reverse = this.smoothParam("reverse");
                            const reso = this.smoothParam("reso");
                            const shift = this.smoothParam("shift");
                            const spiral = this.smoothParam("spiral");
                            const mobius = this.smoothParam("mobius");
                            const width = this.smoothParam("width");
                            const frame = currentFrame + i;
                            this.maybeLatchStutter(stutter, frame);
                            const noiseKickDuck = this.updateNoiseKickDuck(frame, noise);
                            const gateGain = this.gateAmount(gate);
                            const samples = [];

                            for (let ch = 0; ch < output.length; ch += 1) {
                                const channel = this.channels[ch] || this.channels[0];
                                const source = input[ch] || input[0];
                                let sample = source ? source[i] : 0;
                                channel.buffer[this.writeIndex] = sample;
                                sample = this.softClip(sample, dirt, channel);
                                sample = this.crush(sample, crush, channel);
                                sample = this.noiseLayer(sample, noise, channel, ch, frame, noiseKickDuck);
                                sample = this.resonator(sample, reso, channel);
                                sample = this.shift(sample, shift, channel, ch);
                                sample = this.sweep(sample, sweep, channel, ch);
                                sample = this.beatReverse(sample, reverse, channel);
                                sample = this.stutter(sample, stutter, channel);
                                sample = this.spiral(sample, spiral, channel);
                                sample = this.mobius(sample, mobius, channel, ch);
                                sample *= gateGain;
                                sample = this.space(sample, space, channel, ch);
                                samples[ch] = sample;
                            }

                            if (output.length > 1) {
                                const widened = this.applyWidth(samples[0] || 0, samples[1] ?? samples[0] ?? 0, width);
                                samples[0] = widened[0];
                                samples[1] = widened[1];
                            }

                            for (let ch = 0; ch < output.length; ch += 1) {
                                output[ch][i] = Math.max(-1, Math.min(1, samples[ch] || 0));
                            }

                            this.writeIndex = (this.writeIndex + 1) % this.maxBuffer;
                            if (stutter > 0.015) this.repeatIndex = (this.repeatIndex + 1) % Math.max(1, this.repeatLength);
                            this.phase += 1;
                        }
                        return true;
                    }
                }

                registerProcessor("synthstream-insert-fx", SynthstreamInsertFx);
            `;
        }

        async function initializeInsertWorklet() {
            if (!audioCtx.audioWorklet || insertWorkletReady) return insertWorkletReady;
            try {
                const blob = new Blob([insertFxWorkletCode()], { type: "application/javascript" });
                const url = URL.createObjectURL(blob);
                await audioCtx.audioWorklet.addModule(url);
                URL.revokeObjectURL(url);
                insertWorkletReady = true;
            } catch (error) {
                insertWorkletReady = false;
            }
            return insertWorkletReady;
        }

        async function ensureAudio() {
            if (audioCtx) return;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            insertWorkletReady = false;
            insertWorkletStatusShown = false;
            await initializeInsertWorklet();
            mixBus = audioCtx.createGain();
            compressor = audioCtx.createDynamicsCompressor();
            masterLimiter = audioCtx.createDynamicsCompressor();
            masterGain = audioCtx.createGain();
            masterAnalyser = audioCtx.createAnalyser();
            delay = audioCtx.createDelay(1);
            delayFeedback = audioCtx.createGain();
            delayHighpass = audioCtx.createBiquadFilter();
            delayLowpass = audioCtx.createBiquadFilter();
            delayReturn = audioCtx.createGain();
            noiseBuffer = createNoiseBuffer(2);

            compressor.threshold.value = -18;
            compressor.knee.value = 18;
            compressor.ratio.value = 2.8;
            compressor.attack.value = 0.006;
            compressor.release.value = 0.18;
            masterLimiter.threshold.value = -1;
            masterLimiter.knee.value = 0;
            masterLimiter.ratio.value = 20;
            masterLimiter.attack.value = 0.0015;
            masterLimiter.release.value = 0.06;
            masterAnalyser.fftSize = 2048;
            masterAnalyser.smoothingTimeConstant = 0.78;
            delayHighpass.type = "highpass";
            delayHighpass.frequency.value = 420;
            delayLowpass.type = "lowpass";
            delayLowpass.frequency.value = 5200;

            decks.forEach(deck => createDeckNodes(deck));

            delay.connect(delayFeedback);
            delayFeedback.connect(delay);
            delay.connect(delayHighpass);
            delayHighpass.connect(delayLowpass);
            delayLowpass.connect(delayReturn);
            delayReturn.connect(mixBus);
            mixBus.connect(compressor);
            compressor.connect(masterLimiter);
            masterLimiter.connect(masterAnalyser);
            masterAnalyser.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            frequencyData = new Uint8Array(masterAnalyser.frequencyBinCount);
            timeData = new Uint8Array(masterAnalyser.fftSize);
            masterMeterData = new Uint8Array(masterAnalyser.frequencyBinCount);
            syncAllControls();
            if (!insertWorkletReady && !insertWorkletStatusShown) {
                insertWorkletStatusShown = true;
                setStatus("Insert FX bypassed: AudioWorklet unavailable");
            }
        }

        function createDeckNodes(deck) {
            const input = audioCtx.createGain();
            let insert = null;
            const low = audioCtx.createBiquadFilter();
            const mid = audioCtx.createBiquadFilter();
            const high = audioCtx.createBiquadFilter();
            const filter = audioCtx.createBiquadFilter();
            const level = audioCtx.createGain();
            const deckLimiter = audioCtx.createDynamicsCompressor();
            const analyser = audioCtx.createAnalyser();
            const crossfade = audioCtx.createGain();
            const send = audioCtx.createGain();

            low.type = "lowshelf";
            low.frequency.value = 220;
            mid.type = "peaking";
            mid.frequency.value = 1000;
            mid.Q.value = 1.1;
            high.type = "highshelf";
            high.frequency.value = 4200;
            deckLimiter.threshold.value = -6;
            deckLimiter.knee.value = 6;
            deckLimiter.ratio.value = 10;
            deckLimiter.attack.value = 0.003;
            deckLimiter.release.value = 0.08;
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.78;

            if (insertWorkletReady) {
                try {
                    insert = new AudioWorkletNode(audioCtx, "synthstream-insert-fx", {
                        numberOfInputs: 1,
                        numberOfOutputs: 1,
                        outputChannelCount: [2],
                    });
                    insert.port.postMessage({ type: "tempo", bpm: BPM });
                    input.connect(insert);
                    insert.connect(low);
                } catch (error) {
                    insert = null;
                    input.connect(low);
                    insertWorkletReady = false;
                    setStatus("Insert FX bypassed: processor unavailable");
                }
            } else {
                input.connect(low);
            }
            low.connect(mid);
            mid.connect(high);
            high.connect(filter);
            filter.connect(level);
            level.connect(deckLimiter);
            deckLimiter.connect(analyser);
            analyser.connect(crossfade);
            crossfade.connect(mixBus);
            crossfade.connect(send);
            send.connect(delay);

            deckNodes[deck.id] = { input, insert, low, mid, high, filter, level, deckLimiter, analyser, data: new Uint8Array(analyser.frequencyBinCount), crossfade, send };

            deck.lanes.forEach(lane => {
                const levelGain = audioCtx.createGain();
                levelGain.gain.value = lane.level / 100;

                if (lane.voice === "bass") {
                    const pumpGain = audioCtx.createGain();
                    pumpGain.gain.value = 1;
                    pumpGain.connect(levelGain);
                    levelGain.connect(input);
                    laneNodes[nodeKey(deck.id, lane.id)] = { gain: pumpGain, levelGain, pumpGain, voice: lane.voice };
                    if (!bassPumpState[deck.id]) bassPumpState[deck.id] = [];
                    bassPumpState[deck.id].push({ gain: pumpGain, activeUntil: 0 });
                    return;
                }

                levelGain.connect(input);
                laneNodes[nodeKey(deck.id, lane.id)] = { gain: levelGain, levelGain, voice: lane.voice };
            });
        }

        function configureDeckFilter(filter, value) {
            if (!filter) return;

            const amount = clamp(value / 100, -1, 1);
            const setFrequency = (frequency) => {
                if (audioCtx) filter.frequency.setTargetAtTime(frequency, audioCtx.currentTime, 0.035);
                else filter.frequency.value = frequency;
            };
            const setQ = (q) => {
                if (audioCtx) filter.Q.setTargetAtTime(q, audioCtx.currentTime, 0.035);
                else filter.Q.value = q;
            };

            if (Math.abs(amount) < 0.04) {
                filter.type = "allpass";
                setFrequency(1000);
                setQ(0.0001);
                return;
            }

            if (amount < 0) {
                const depth = Math.abs(amount);
                filter.type = "lowpass";
                setFrequency(18000 * Math.pow(260 / 18000, depth));
                setQ(0.7 + depth * 4.8);
                return;
            }

            filter.type = "highpass";
            setFrequency(24 * Math.pow(1500 / 24, amount));
            setQ(0.7 + amount * 3.6);
        }

        function rampParam(param, value, time, duration) {
            param.cancelScheduledValues(time);
            param.setTargetAtTime(value, time, Math.max(0.01, duration));
        }

        function syncAllControls() {
            syncLaneLevel();
            syncDeckControls();
            syncInsertFx();
            syncEq();
            syncCrossfader();
            syncFxControls();
            syncMaster();
        }

        function syncLaneLevel(event) {
            const inputs = event ? [event.currentTarget] : Array.from(document.querySelectorAll("[data-lane-level]"));
            inputs.forEach(input => {
                const [deckId, laneId] = input.dataset.laneLevel.split(":");
                const lane = laneById(deckId, laneId);
                let value = Number(input.value);
                if (value <= LANE_OFF_LEVEL) {
                    value = 0;
                    input.value = "0";
                }
                lane.level = value;
                lane.enabled = isLaneActive(lane);
                if (isLaneActive(lane)) lane.lastNonZeroLevel = value;
                refreshKnob(document.querySelector(`[data-knob][data-lane-knob="${deckId}:${laneId}"]`));
                const node = laneNodes[nodeKey(deckId, laneId)];
                if (node && audioCtx) rampParam((node.levelGain || node.gain).gain, value / 100, audioCtx.currentTime, 0.035);
            });
            renderState();
        }

        function syncDeckControls(event) {
            const deckIds = event ? [event.currentTarget.dataset.deckLevel || event.currentTarget.dataset.filter || event.currentTarget.dataset.send] : decks.map(deck => deck.id);
            deckIds.forEach(deckId => {
                const deck = deckById(deckId);
                const levelInput = document.querySelector(`[data-deck-level="${deckId}"]`);
                const filterInput = document.querySelector(`[data-filter="${deckId}"]`);
                const sendInput = document.querySelector(`[data-send="${deckId}"]`);
                if (levelInput) deck.controls.level = Number(levelInput.value);
                if (filterInput) deck.controls.filter = Number(filterInput.value);
                if (sendInput) deck.controls.send = Number(sendInput.value);

                const levelValue = document.querySelector(`[data-deck-level-value="${deckId}"]`);
                const filterValue = document.querySelector(`[data-filter-value="${deckId}"]`);
                const sendValue = document.querySelector(`[data-send-value="${deckId}"]`);
                if (levelValue) levelValue.textContent = String(deck.controls.level);
                if (filterValue) filterValue.textContent = String(deck.controls.filter);
                if (sendValue) sendValue.textContent = String(deck.controls.send);
                refreshKnob(document.querySelector(`[data-knob][data-input="deck-level-${deckId}"]`));
                refreshKnob(document.querySelector(`[data-knob][data-input="filter-${deckId}"]`));
                refreshKnob(document.querySelector(`[data-knob][data-input="send-${deckId}"]`) || document.querySelector(`[data-knob][data-input="send-${deckId.toLowerCase()}"]`));

                const nodes = deckNodes[deckId];
                if (nodes && audioCtx) {
                    rampParam(nodes.level.gain, deck.controls.level / 100, audioCtx.currentTime, 0.04);
                    rampParam(nodes.send.gain, deck.controls.send / 100 * 1.15, audioCtx.currentTime, 0.04);
                    configureDeckFilter(nodes.filter, deck.controls.filter);
                }
            });
        }

        function syncInsertFx(event) {
            const deckIds = event ? [event.currentTarget.dataset.insertFx.split(":")[0]] : decks.map(deck => deck.id);
            deckIds.forEach(deckId => {
                const deck = deckById(deckId);
                if (!deck) return;
                INSERT_FX.forEach(effect => {
                    const input = document.querySelector(`[data-insert-fx="${deck.id}:${effect.id}"]`);
                    if (input) deck.insertFx[effect.id] = Number(input.value);
                    refreshKnob(document.querySelector(`[data-knob][data-input="insert-${deck.id}-${effect.id}"]`));
                });
                const insert = deckNodes[deck.id]?.insert;
                if (insert?.port) {
                    insert.port.postMessage({
                        type: "params",
                        values: { ...deck.insertFx },
                    });
                }
                if ((deck.insertFx.pump || 0) <= 0) resetBassPump(deck.id);
            });
        }

        function syncEq(event) {
            const deckIds = event ? [event.currentTarget.dataset.eqBand.split(":")[0]] : decks.map(deck => deck.id);
            deckIds.forEach(deckId => {
                const deck = deckById(deckId);
                const nodes = deckNodes[deck.id];
                ["high", "mid", "low"].forEach(band => {
                    const input = document.querySelector(`[data-eq-band="${deck.id}:${band}"]`);
                    if (input) deck.eq[band] = Number(input.value);
                    const value = document.querySelector(`[data-eq-value="${deck.id}:${band}"]`);
                    if (value) value.textContent = formatEqGain(deck.eq[band]);
                    refreshKnob(document.querySelector(`[data-knob][data-input="eq-${deck.id}-${band}"]`));
                });
                if (nodes && audioCtx) {
                    const now = audioCtx.currentTime;
                    rampParam(nodes.low.gain, deck.eq.low, now, 0.04);
                    rampParam(nodes.mid.gain, deck.eq.mid, now, 0.04);
                    rampParam(nodes.high.gain, deck.eq.high, now, 0.04);
                }
            });
        }

        function syncCrossfader() {
            if (!audioCtx || !deckNodes.a || !deckNodes.b) return;

            const x = Number(els.crossfader.value) / 100;
            const gainA = Math.cos(x * Math.PI / 2);
            const gainB = Math.sin(x * Math.PI / 2);
            const now = audioCtx.currentTime;
            rampParam(deckNodes.a.crossfade.gain, gainA, now, 0.035);
            rampParam(deckNodes.b.crossfade.gain, gainB, now, 0.035);
        }

        function syncFxControls() {
            els.feedbackValue.textContent = els.feedback.value;
            els.fxReturnValue.textContent = els.fxReturn.value;
            refreshKnob(document.querySelector('[data-knob][data-input="feedbackControl"]'));
            refreshKnob(document.querySelector('[data-knob][data-input="fxReturnControl"]'));
            els.divisionValue.textContent = selectedDivision;
            document.querySelectorAll("[data-division]").forEach(button => {
                button.classList.toggle("is-active", button.dataset.division === selectedDivision);
            });

            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const division = DIVISIONS.find(item => item.label === selectedDivision) || DIVISIONS[1];
            delay.delayTime.setTargetAtTime(stepTime * division.steps, now, 0.04);
            delayFeedback.gain.setTargetAtTime(Number(els.feedback.value) / 100, now, 0.04);
            delayReturn.gain.setTargetAtTime(Number(els.fxReturn.value) / 100, now, 0.04);
        }

        function syncMaster() {
            els.masterValue.textContent = els.master.value;
            refreshKnob(document.querySelector('[data-knob][data-input="masterControl"]'));
            if (masterGain && audioCtx) rampParam(masterGain.gain, Number(els.master.value) / 100, audioCtx.currentTime, 0.03);
        }

        function playKick(deck, lane, time, velocity) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const click = audioCtx.createBufferSource();
            const clickGain = audioCtx.createGain();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;

            osc.type = "sine";
            osc.frequency.setValueAtTime(deck.id === "a" ? 112 : 126, time);
            osc.frequency.exponentialRampToValueAtTime(deck.id === "a" ? 42 : 48, time + 0.12);
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.95 * velocity, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.34);
            click.buffer = noiseBuffer;
            clickGain.gain.setValueAtTime(0.15 * velocity, time);
            clickGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.018);
            osc.connect(gain);
            click.connect(clickGain);
            gain.connect(out);
            clickGain.connect(out);
            osc.start(time);
            click.start(time);
            osc.stop(time + 0.38);
            click.stop(time + 0.03);
        }

        function playBass(deck, lane, time, step, velocity) {
            const noteIndex = lane.notes[(step + seed) % lane.notes.length] + (deck.id === "b" ? 2 : 0);
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            const freq = SCALE[noteIndex + 2] || 73.42;

            osc.type = deck.id === "b" ? "sawtooth" : "square";
            osc.frequency.setValueAtTime(freq, time);
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(deck.id === "b" ? 360 + seeded(step) * 260 : 220 + seeded(step) * 120, time);
            filter.frequency.exponentialRampToValueAtTime((deck.id === "b" ? 1400 : 820) + seeded(step + 10) * 700, time + 0.05);
            filter.frequency.exponentialRampToValueAtTime(180, time + 0.22);
            filter.Q.value = deck.id === "b" ? 13 : 8;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.23 * velocity, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.24);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(out);
            osc.start(time);
            osc.stop(time + 0.28);
        }

        function playHat(deck, lane, time, velocity) {
            const noise = audioCtx.createBufferSource();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;

            noise.buffer = noiseBuffer;
            filter.type = "highpass";
            filter.frequency.value = (deck.id === "b" ? 7600 : 6600) + velocity * 1700;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.13 * velocity, time + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05 + velocity * 0.04);
            pan.pan.value = seeded(time * 10) * 0.8 - 0.4;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            noise.start(time);
            noise.stop(time + 0.12);
        }

        function playPerc(deck, lane, time, step, velocity) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            osc.type = "triangle";
            osc.frequency.value = deck.id === "b" ? 520 + seeded(step) * 360 : 360 + seeded(step) * 260;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.16 * velocity, time + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);
            pan.pan.value = seeded(step + (deck.id === "b" ? 80 : 40)) * 1.3 - 0.65;
            osc.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            osc.start(time);
            osc.stop(time + 0.14);
        }

        function playLead(deck, lane, time, step, velocity) {
            const noteIndex = lane.notes[(step + seed) % lane.notes.length];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            osc.type = deck.id === "b" ? "square" : "sawtooth";
            osc.frequency.value = (SCALE[noteIndex] || 146.83) * (deck.id === "b" ? 2 : 1.5);
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(deck.id === "b" ? 1800 : 1200, time);
            filter.frequency.exponentialRampToValueAtTime(deck.id === "b" ? 3600 : 2200, time + 0.08);
            filter.Q.value = 2.2;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.1 * velocity, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.32);
            pan.pan.value = Math.sin((step + seed) * 0.7) * 0.45;
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            osc.start(time);
            osc.stop(time + 0.38);
        }

        function playDrone(deck, lane, time, step, symbol) {
            if (symbol === "~") return;

            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            const root = SCALE[lane.notes[0]] || 36.71;
            [root, SCALE[lane.notes[1]] || root * 2].forEach((freq, voice) => {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = voice === 0 ? "sawtooth" : "triangle";
                osc.frequency.value = freq * (deck.id === "b" ? 1.5 : 1);
                osc.detune.value = voice === 0 ? -5 : 7;
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(160 + (seed % 6) * 24 + voice * 80, time);
                filter.Q.value = 4.5;
                gain.gain.setValueAtTime(0.0001, time);
                gain.gain.exponentialRampToValueAtTime((deck.id === "a" ? 0.12 : 0.08) / (voice + 1), time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + stepTime * 4.05);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(out);
                osc.start(time);
                osc.stop(time + stepTime * 4.2);
            });
        }

        function playTexture(deck, lane, time, velocity) {
            const noise = audioCtx.createBufferSource();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const pan = audioCtx.createStereoPanner();
            const out = laneNodes[nodeKey(deck.id, lane.id)].gain;
            noise.buffer = noiseBuffer;
            filter.type = "bandpass";
            filter.frequency.value = deck.id === "b" ? 5200 + seeded(time) * 1400 : 3800 + seeded(time) * 1200;
            filter.Q.value = 0.7;
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(0.09 * velocity, time + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.42);
            pan.pan.value = seeded(time * 5) * 1.2 - 0.6;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(pan);
            pan.connect(out);
            noise.start(time);
            noise.stop(time + 0.5);
        }

        function playLane(deck, lane, step, time) {
            if (!isLaneActive(lane)) return;

            const symbol = lane.pattern[step];
            if (!symbol || symbol === "-") return;

            const velocity = symbol === symbol.toUpperCase() && symbol !== "~" ? 1 : 0.55;
            lane.lastPulse = performance.now();
            scheduleUiPulse(deck.id, lane.id, time);

            if (lane.voice === "kick") {
                triggerPump(deck.id, time);
                playKick(deck, lane, time, velocity);
            }
            if (lane.voice === "bass") playBass(deck, lane, time, step, velocity);
            if (lane.voice === "hat") playHat(deck, lane, time, velocity);
            if (lane.voice === "perc") playPerc(deck, lane, time, step, velocity);
            if (lane.voice === "lead") playLead(deck, lane, time, step, velocity);
            if (lane.voice === "drone") playDrone(deck, lane, time, step, symbol);
            if (lane.voice === "texture") playTexture(deck, lane, time, velocity);
        }

        function triggerPump(deckId, time) {
            const insert = deckNodes[deckId]?.insert;
            if (insert?.port) insert.port.postMessage({ type: "kick", time });

            const deck = deckById(deckId);
            const amount = Math.max(0, Math.min(1, Number(deck?.insertFx?.pump || 0) / 100));
            const states = bassPumpState[deckId] || [];
            if (!audioCtx || !states.length) return;

            if (amount < 0.002) {
                resetBassPump(deckId);
                return;
            }

            const start = Math.max(audioCtx.currentTime, time);
            const attack = 0.006 + (1 - amount) * 0.008;
            const hold = 0.012 + amount * 0.026;
            const release = 0.12 + (1 - amount) * 0.22;
            const depth = Math.min(0.88, Math.pow(amount, 1.08) * 0.88);
            const duckGain = Math.max(0.08, 1 - depth);
            const releaseStart = start + attack + hold;

            states.forEach(state => {
                const param = state.gain?.gain;
                if (!param) return;
                if (typeof param.cancelAndHoldAtTime === "function") {
                    param.cancelAndHoldAtTime(start);
                } else {
                    param.cancelScheduledValues(start);
                    param.setValueAtTime(Math.min(1, Math.max(duckGain, param.value || 1)), start);
                }
                param.linearRampToValueAtTime(duckGain, start + attack);
                param.setTargetAtTime(1, releaseStart, release);
                state.activeUntil = releaseStart + release * 5;
            });
        }

        function resetBassPump(deckId) {
            if (!audioCtx) return;
            (bassPumpState[deckId] || []).forEach(state => {
                const param = state.gain?.gain;
                if (!param) return;
                const now = audioCtx.currentTime;
                if (state.activeUntil > now) {
                    param.cancelScheduledValues(now);
                    param.setTargetAtTime(1, now, 0.018);
                } else {
                    param.setValueAtTime(1, now);
                }
                state.activeUntil = 0;
            });
        }

        function scheduleUiPulse(deckId, laneId, time) {
            const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
            uiTimers.push(window.setTimeout(() => {
                laneById(deckId, laneId).lastPulse = performance.now();
                renderState();
            }, delayMs));
        }

        function scheduleStep(step, time) {
            const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
            uiTimers.push(window.setTimeout(() => {
                visibleStep = step;
                renderStep();
                if (step % 4 === 0) {
                    els.tempoLight.classList.add("is-hot");
                    window.setTimeout(() => els.tempoLight.classList.remove("is-hot"), 90);
                }
            }, delayMs));

            decks.forEach(deck => {
                deck.lanes.forEach(lane => playLane(deck, lane, step, time));
            });
        }

        function scheduler() {
            while (nextStepTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
                scheduleStep(currentStep, nextStepTime);
                nextStepTime += stepTime;
                currentStep = (currentStep + 1) % STEPS;
            }
        }

        async function play() {
            await ensureAudio();
            if (audioCtx.state === "suspended") await audioCtx.resume();
            const now = audioCtx.currentTime;
            isPlaying = true;
            nextStepTime = now + 0.04;
            currentStep = visibleStep;
            window.clearInterval(schedulerId);
            schedulerId = window.setInterval(scheduler, LOOKAHEAD_MS);
            els.play.textContent = "Pause";
            els.readout.textContent = `${BPM} BPM / 4/4 / 16 Steps / Playing`;
            setStatus("Playing");
            if (!insertWorkletReady) setStatus("Playing; insert FX bypassed");
        }

        function pause() {
            if (!audioCtx) return;
            window.clearInterval(schedulerId);
            schedulerId = 0;
            isPlaying = false;
            audioCtx.suspend();
            els.play.textContent = "Play";
            els.readout.textContent = `${BPM} BPM / 4/4 / 16 Steps / Paused`;
            setStatus("Playback paused");
        }

        function stop() {
            if (audioCtx && audioCtx.state !== "closed") audioCtx.suspend();
            window.clearInterval(schedulerId);
            schedulerId = 0;
            isPlaying = false;
            currentStep = 0;
            visibleStep = 0;
            clearUiTimers();
            els.play.textContent = "Play";
            els.readout.textContent = `${BPM} BPM / 4/4 / 16 Steps / Stopped`;
            setStatus("Playback stopped");
            renderStep();
        }

        function resetAll() {
            stop();
            decks = cloneDecks();
            seed = 3;
            selectedDivision = "1/4";
            deckNodes = {};
            laneNodes = {};
            bassPumpState = {};
            insertWorkletReady = false;
            insertWorkletStatusShown = false;
            if (audioCtx && audioCtx.state !== "closed") {
                audioCtx.close();
            }
            audioCtx = null;
            renderStaticUi();
            decks.forEach(deck => {
                const sendInput = document.querySelector(`[data-send="${deck.id}"]`);
                if (sendInput) sendInput.value = deck.controls.send;
            });
            els.feedback.value = 48;
            els.fxReturn.value = 42;
            els.master.value = 58;
            els.crossfader.value = 50;
            syncDeckControls();
            syncFxControls();
            syncMaster();
            setStatus("Station reset");
        }

        function mutate() {
            seed = (seed + 1 + Math.floor(Math.random() * 7)) % 97;
            decks.forEach(deck => {
                deck.lanes.forEach((lane, laneIndex) => {
                    if (lane.voice !== "drone" && seeded(laneIndex + seed) > 0.72) {
                        const chars = Array.from(lane.pattern);
                        const pos = Math.floor(seeded(laneIndex * 13 + seed) * STEPS) % STEPS;
                        if (chars[pos] === "-") chars[pos] = lane.label[0].toLowerCase();
                        lane.pattern = chars.join("");
                    }
                });
            });
            if (audioCtx) {
                const now = audioCtx.currentTime;
                delayFeedback.gain.setTargetAtTime(Number(els.feedback.value) / 100 + (seed % 5) * 0.018, now, 0.05);
            }
            renderStaticUi();
            setStatus(`Mutation seed ${String(seed).padStart(2, "0")}`);
            els.readout.textContent = `${BPM} BPM / 4/4 / 16 Steps / Seed ${String(seed).padStart(2, "0")}`;
        }

        function clearUiTimers() {
            uiTimers.forEach(timer => window.clearTimeout(timer));
            uiTimers = [];
        }

        function renderState() {
            const now = performance.now();
            decks.forEach(deck => {
                const deckElement = document.querySelector(`[data-deck="${deck.id}"]`);
                const hasEnabledLane = deck.lanes.some(lane => isLaneActive(lane));
                const hasRecentPulse = deck.lanes.some(lane => now - lane.lastPulse < 130);
                if (deckElement) {
                    deckElement.classList.toggle("has-enabled", hasEnabledLane);
                    deckElement.classList.toggle("is-active", hasRecentPulse);
                }
                deck.lanes.forEach(lane => {
                    const row = document.querySelector(`[data-lane="${deck.id}:${lane.id}"]`);
                    if (!row) return;
                    row.classList.toggle("is-enabled", isLaneActive(lane));
                    row.classList.toggle("is-pulsing", now - lane.lastPulse < 130);
                });
            });
            renderStep();
        }

        function renderStep() {
            els.stepReadout.textContent = `Step ${String(visibleStep + 1).padStart(2, "0")} / 16`;
            document.querySelectorAll("[data-step-cell]").forEach(cell => {
                cell.classList.toggle("is-current", Number(cell.dataset.stepCell) === visibleStep);
            });
            document.querySelectorAll("[data-pattern-cell]").forEach(cell => {
                const [, , index] = cell.dataset.patternCell.split(":");
                cell.classList.toggle("is-current", Number(index) === visibleStep);
            });
        }

        function meterValue(analyser, data) {
            analyser.getByteFrequencyData(data);
            let total = 0;
            for (let i = 0; i < data.length; i += 1) total += data[i] / 255;
            return clamp(total / data.length * 2.6, 0, 1);
        }

        function renderMeters() {
            decks.forEach(deck => {
                const meter = document.querySelector(`[data-deck-meter="${deck.id}"]`);
                const nodes = deckNodes[deck.id];
                const value = nodes && isPlaying ? meterValue(nodes.analyser, nodes.data) : deck.lanes.reduce((max, lane) => {
                    return Math.max(max, performance.now() - lane.lastPulse < 130 ? lane.level / 100 : 0);
                }, 0) * 0.45;
                if (meter) meter.style.width = `${Math.round(value * 100)}%`;
            });

            const masterValue = masterAnalyser && isPlaying ? meterValue(masterAnalyser, masterMeterData) : 0;
            els.masterMeter.style.width = `${Math.round(masterValue * 100)}%`;
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = els.canvas.getBoundingClientRect();
            width = Math.max(1, rect.width);
            height = Math.max(1, rect.height);
            els.canvas.width = Math.floor(width * dpr);
            els.canvas.height = Math.floor(height * dpr);
            canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function drawStandby(time) {
            const bars = 28;
            for (let i = 0; i < bars; i += 1) {
                const x = i / bars * width;
                const h = 10 + Math.sin(time * 0.0015 + i * 0.45) * 6 + (i % 5) * 1.8;
                canvasCtx.fillStyle = `hsla(${164 + i * 1.8}, 86%, 66%, 0.18)`;
                canvasCtx.fillRect(x, height - h - 10, Math.max(2, width / bars - 4), h);
            }
        }

        function drawLive() {
            masterAnalyser.getByteFrequencyData(frequencyData);
            masterAnalyser.getByteTimeDomainData(timeData);
            let total = 0;
            for (let i = 0; i < frequencyData.length; i += 1) total += frequencyData[i] / 255;
            const energy = clamp(total / frequencyData.length * 2.2, 0, 1);
            const centerY = height * 0.48;

            canvasCtx.strokeStyle = `rgba(117, 255, 214, ${0.35 + energy * 0.5})`;
            canvasCtx.lineWidth = 2;
            canvasCtx.beginPath();
            for (let i = 0; i < timeData.length; i += 8) {
                const t = i / (timeData.length - 1);
                const x = t * width;
                const sample = (timeData[i] - 128) / 128;
                const y = centerY + sample * height * 0.32;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
            }
            canvasCtx.stroke();

            const bars = 36;
            const bandSize = Math.floor(frequencyData.length / bars);
            for (let i = 0; i < bars; i += 1) {
                let value = 0;
                for (let j = 0; j < bandSize; j += 1) value += frequencyData[i * bandSize + j] / 255;
                value /= bandSize;
                const barWidth = width / bars;
                const barHeight = Math.max(2, value * height * 0.36);
                canvasCtx.fillStyle = `hsla(${158 + i * 1.6 + energy * 24}, 92%, ${58 + value * 22}%, 0.82)`;
                canvasCtx.fillRect(i * barWidth, height - barHeight - 8, Math.max(2, barWidth - 3), barHeight);
            }
        }

        function draw(time) {
            requestAnimationFrame(draw);
            renderState();
            renderMeters();
            canvasCtx.clearRect(0, 0, width, height);
            canvasCtx.fillStyle = "rgba(2, 5, 5, 0.62)";
            canvasCtx.fillRect(0, 0, width, height);
            if (masterAnalyser && isPlaying) drawLive();
            else drawStandby(time);
        }

        els.play.addEventListener("click", () => {
            if (isPlaying) pause();
            else play().catch(() => setStatus("Audio blocked by browser"));
        });
        els.stop.addEventListener("click", stop);
        els.reset.addEventListener("click", resetAll);
        els.mutate.addEventListener("click", mutate);
        document.querySelectorAll("[data-send]").forEach(input => {
            input.addEventListener("input", syncDeckControls);
        });
        els.feedback.addEventListener("input", syncFxControls);
        els.fxReturn.addEventListener("input", syncFxControls);
        els.master.addEventListener("input", syncMaster);
        els.crossfader.addEventListener("input", syncCrossfader);
        els.station.addEventListener("pointerdown", handleStationPointerDown);
        window.addEventListener("mousemove", handleVirtualPointerMove);
        window.addEventListener("mousedown", handleVirtualPointerDown);
        window.addEventListener("mouseup", handleVirtualPointerUp);
        document.addEventListener("pointerlockchange", handleStationPointerLockChange);
        window.addEventListener("resize", resize);

        renderStaticUi();
        initKnobs();
        syncFxControls();
        syncMaster();
        resize();
        requestAnimationFrame(draw);
    </script>
</body>
</html>
