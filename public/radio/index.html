<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Player</title>
    <style>
        :root {
            --bg-top: #fff4cb;
            --bg-mid: #ffc792;
            --bg-bottom: #ff8f72;
            --text: #fff9ef;
            --accent-a: #ffe066;
            --accent-b: #ff8fab;
            --accent-c: #7afcff;
            --shadow: rgba(133, 39, 70, 0.28);
            --body-glow-a: rgba(255, 255, 255, 0.45);
            --body-glow-b: rgba(255, 230, 162, 0.35);
            --skyline-a: rgba(42, 18, 56, 0);
            --skyline-b: rgba(55, 18, 59, 0.22);
            --skyline-c: rgba(53, 19, 54, 0.88);
            --skyline-building: rgba(37, 14, 43, 0.95);
            --skyline-window: rgba(255, 255, 255, 0.08);
            --sun-start: rgba(255, 248, 198, 0.96);
            --sun-end: rgba(255, 175, 116, 0.9);
            --sun-glow-a: rgba(255, 255, 218, 0.85);
            --sun-glow-b: rgba(255, 182, 111, 0.55);
            --shell-bg: rgba(255, 255, 255, 0.08);
            --shell-line: rgba(255, 255, 255, 0.15);
            --panel-shine-a: rgba(255, 255, 255, 0.24);
            --panel-shine-b: rgba(255, 255, 255, 0.08);
            --panel-tint-a: rgba(255, 197, 143, 0.34);
            --panel-tint-b: rgba(117, 211, 255, 0.08);
            --panel-text-strong: rgba(100, 30, 64, 0.94);
            --panel-text-mid: rgba(100, 30, 64, 0.74);
            --panel-text-soft: rgba(100, 30, 64, 0.62);
            --glass-bg: rgba(255, 255, 255, 0.18);
            --glass-line: rgba(255, 255, 255, 0.5);
            --button-bg-a: rgba(255, 241, 177, 0.96);
            --button-bg-b: rgba(255, 183, 146, 0.95);
            --button-text: rgba(92, 29, 60, 0.92);
            --viz-top: rgba(255, 252, 219, 0.5);
            --viz-bottom: rgba(255, 163, 144, 0.12);
            --viz-shadow-top: rgba(44, 15, 51, 0.06);
            --viz-shadow-bottom: rgba(44, 15, 51, 0.26);
            --grid-tint: rgba(116, 28, 73, 0.22);
            --hint: rgba(255, 248, 238, 0.74);
            --bg-halo-a: rgba(255, 252, 196, 0.9);
            --bg-halo-b: rgba(255, 255, 255, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        body[data-theme="blues"] {
            --bg-top: #aeb9c1;
            --bg-mid: #6f7a86;
            --bg-bottom: #443529;
            --text: #f6efe1;
            --accent-a: #c79a5d;
            --accent-b: #6a87a4;
            --accent-c: #88b7a2;
            --shadow: rgba(25, 17, 11, 0.42);
            --body-glow-a: rgba(211, 198, 179, 0.22);
            --body-glow-b: rgba(95, 73, 47, 0.28);
            --skyline-a: rgba(29, 28, 24, 0);
            --skyline-b: rgba(43, 34, 24, 0.18);
            --skyline-c: rgba(31, 24, 19, 0.9);
            --skyline-building: rgba(34, 27, 22, 0.96);
            --skyline-window: rgba(219, 191, 153, 0.08);
            --sun-start: rgba(208, 197, 180, 0.92);
            --sun-end: rgba(114, 132, 150, 0.72);
            --sun-glow-a: rgba(219, 209, 190, 0.28);
            --sun-glow-b: rgba(85, 104, 126, 0.24);
            --shell-bg: rgba(31, 26, 21, 0.2);
            --shell-line: rgba(244, 229, 204, 0.12);
            --panel-shine-a: rgba(246, 238, 223, 0.12);
            --panel-shine-b: rgba(246, 238, 223, 0.03);
            --panel-tint-a: rgba(83, 66, 49, 0.34);
            --panel-tint-b: rgba(74, 101, 122, 0.16);
            --panel-text-strong: rgba(245, 235, 218, 0.92);
            --panel-text-mid: rgba(235, 222, 203, 0.72);
            --panel-text-soft: rgba(221, 207, 186, 0.62);
            --glass-bg: rgba(235, 225, 210, 0.08);
            --glass-line: rgba(245, 233, 210, 0.18);
            --button-bg-a: rgba(195, 151, 93, 0.94);
            --button-bg-b: rgba(114, 86, 62, 0.94);
            --button-text: rgba(27, 18, 12, 0.92);
            --viz-top: rgba(173, 156, 126, 0.22);
            --viz-bottom: rgba(48, 61, 72, 0.22);
            --viz-shadow-top: rgba(27, 25, 22, 0.18);
            --viz-shadow-bottom: rgba(17, 15, 13, 0.44);
            --grid-tint: rgba(137, 108, 67, 0.22);
            --hint: rgba(245, 233, 217, 0.7);
            --bg-halo-a: rgba(204, 196, 184, 0.34);
            --bg-halo-b: rgba(107, 127, 145, 0.18);
        }

        body[data-theme="rocknroll"] {
            --bg-top: #fff0c4;
            --bg-mid: #d84f35;
            --bg-bottom: #271325;
            --text: #fff7ed;
            --accent-a: #ffd24a;
            --accent-b: #ff6b4a;
            --accent-c: #6ee7d5;
            --shadow: rgba(33, 9, 19, 0.44);
            --body-glow-a: rgba(255, 227, 143, 0.3);
            --body-glow-b: rgba(255, 95, 60, 0.26);
            --skyline-a: rgba(31, 10, 17, 0);
            --skyline-b: rgba(53, 13, 22, 0.24);
            --skyline-c: rgba(28, 9, 20, 0.92);
            --skyline-building: rgba(35, 10, 18, 0.95);
            --skyline-window: rgba(255, 216, 128, 0.12);
            --sun-start: rgba(255, 246, 201, 0.97);
            --sun-end: rgba(255, 118, 73, 0.92);
            --sun-glow-a: rgba(255, 233, 162, 0.58);
            --sun-glow-b: rgba(255, 95, 60, 0.38);
            --shell-bg: rgba(57, 17, 28, 0.22);
            --shell-line: rgba(255, 237, 199, 0.14);
            --panel-shine-a: rgba(255, 242, 216, 0.18);
            --panel-shine-b: rgba(255, 242, 216, 0.04);
            --panel-tint-a: rgba(113, 26, 23, 0.42);
            --panel-tint-b: rgba(219, 91, 45, 0.18);
            --panel-text-strong: rgba(255, 241, 225, 0.95);
            --panel-text-mid: rgba(255, 224, 194, 0.76);
            --panel-text-soft: rgba(255, 214, 182, 0.66);
            --glass-bg: rgba(255, 239, 219, 0.09);
            --glass-line: rgba(255, 239, 219, 0.2);
            --button-bg-a: rgba(255, 219, 99, 0.95);
            --button-bg-b: rgba(237, 101, 62, 0.95);
            --button-text: rgba(58, 13, 19, 0.94);
            --viz-top: rgba(255, 226, 130, 0.26);
            --viz-bottom: rgba(130, 23, 42, 0.24);
            --viz-shadow-top: rgba(43, 11, 18, 0.14);
            --viz-shadow-bottom: rgba(18, 7, 12, 0.42);
            --grid-tint: rgba(255, 194, 83, 0.22);
            --hint: rgba(255, 241, 223, 0.74);
            --bg-halo-a: rgba(255, 221, 124, 0.42);
            --bg-halo-b: rgba(255, 117, 77, 0.18);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% 20%, var(--bg-halo-a), rgba(255, 252, 196, 0) 18rem),
                radial-gradient(circle at 20% 25%, var(--bg-halo-b), rgba(255, 255, 255, 0) 22rem),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 38%, var(--bg-bottom) 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(24px);
            opacity: 0.8;
        }

        body::before {
            width: 26rem;
            height: 26rem;
            top: -8rem;
            left: -7rem;
            background: var(--body-glow-a);
        }

        body::after {
            width: 30rem;
            height: 18rem;
            right: -8rem;
            bottom: -5rem;
            background: var(--body-glow-b);
        }

        .skyline {
            position: fixed;
            inset: auto 0 0;
            height: 34vh;
            background:
                linear-gradient(180deg, var(--skyline-a) 0%, var(--skyline-b) 20%, var(--skyline-c) 100%),
                repeating-linear-gradient(
                    90deg,
                    var(--skyline-building) 0 4.4rem,
                    var(--skyline-window) 4.4rem 4.5rem,
                    var(--skyline-building) 4.5rem 8rem
                );
            clip-path: polygon(
                0 100%, 0 42%, 8% 42%, 8% 25%, 14% 25%, 14% 54%, 22% 54%, 22% 16%, 28% 16%, 28% 44%,
                37% 44%, 37% 32%, 46% 32%, 46% 12%, 54% 12%, 54% 48%, 63% 48%, 63% 27%, 72% 27%, 72% 60%,
                80% 60%, 80% 20%, 88% 20%, 88% 52%, 100% 52%, 100% 100%
            );
            opacity: 0.65;
        }

        .sun {
            position: fixed;
            top: 12vh;
            left: 50%;
            width: min(28vw, 15rem);
            aspect-ratio: 1;
            transform: translateX(-50%);
            border-radius: 50%;
            background:
                linear-gradient(180deg, var(--sun-start), var(--sun-end));
            box-shadow:
                0 0 2rem var(--sun-glow-a),
                0 0 5rem var(--sun-glow-b);
            overflow: hidden;
        }

        .sun::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.34) 0 0.55rem,
                    rgba(255, 255, 255, 0) 0.55rem 1.2rem
                );
            mix-blend-mode: soft-light;
        }

        .frame {
            position: relative;
            width: min(92vw, 58rem);
            display: grid;
            place-items: center;
            padding: 2rem;
            z-index: 1;
        }

        .player-shell {
            position: relative;
            width: min(100%, 36rem);
            padding: 1rem;
            border-radius: 2rem;
            background: var(--shell-bg);
            box-shadow:
                0 2rem 4rem var(--shadow),
                inset 0 0 0 1px var(--shell-line);
            backdrop-filter: blur(18px);
        }

        .player-shell::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.16));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .player {
            position: relative;
            padding: 2rem 1.5rem 1.5rem;
            border-radius: 1.6rem;
            background:
                linear-gradient(180deg, var(--panel-shine-a), var(--panel-shine-b)),
                linear-gradient(145deg, var(--panel-tint-a), var(--panel-tint-b));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08);
        }

        .player::after {
            content: "";
            position: absolute;
            inset: 1rem;
            border-radius: 1.2rem;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0));
            opacity: 0.55;
            pointer-events: none;
        }

        .header,
        .controls,
        .meta,
        .status-row {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 1rem;
            margin-bottom: 1.4rem;
        }

        .eyebrow {
            margin: 0 0 0.35rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--panel-text-soft);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .title {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 0.94;
            letter-spacing: 0.02em;
            color: var(--text);
            text-shadow: 0 0.08em 0.8em rgba(255, 255, 255, 0.25);
        }

        .badge {
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.14);
            color: var(--panel-text-mid);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.52);
            white-space: nowrap;
        }

        .dial-area {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .nav {
            width: 3rem;
            aspect-ratio: 1;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.64), rgba(255, 255, 255, 0.24));
            color: var(--panel-text-strong);
            font-size: 1.4rem;
            box-shadow:
                0 0.8rem 1.4rem rgba(134, 60, 76, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .nav:hover {
            transform: translateY(-2px);
            box-shadow:
                0 1rem 1.8rem rgba(134, 60, 76, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .station-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            min-height: 4rem;
            border-radius: 999px;
            padding: 0.7rem 1rem;
            background: var(--glass-bg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
        }

        .station-dot {
            width: 0.8rem;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--accent-a);
            box-shadow: 0 0 1rem rgba(255, 235, 128, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        .station-name {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--panel-text-strong);
        }

        .station-sub {
            margin: 0.1rem 0 0;
            font-size: 0.84rem;
            color: var(--panel-text-mid);
        }

        .visualizer-wrap {
            position: relative;
            height: 13rem;
            margin: 1rem 0 1.2rem;
            border-radius: 1.4rem;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--viz-top), var(--viz-bottom)),
                linear-gradient(180deg, var(--viz-shadow-top), var(--viz-shadow-bottom));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.48),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08);
        }

        .visualizer-wrap::before {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: 56%;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, var(--grid-tint) 100%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px);
            background-size: auto, 2rem 100%, 100% 1.3rem;
            opacity: 0.45;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .play {
            border: 0;
            border-radius: 999px;
            padding: 0.95rem 1.45rem;
            min-width: 10rem;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--button-text);
            background: linear-gradient(135deg, var(--button-bg-a), var(--button-bg-b));
            box-shadow:
                0 1rem 2rem rgba(172, 78, 74, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.72);
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .play:hover {
            transform: translateY(-2px);
            filter: saturate(1.08);
            box-shadow:
                0 1.2rem 2.4rem rgba(172, 78, 74, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.76);
        }

        .meta {
            display: grid;
            gap: 0.75rem;
        }

        .track {
            padding: 1rem 1.05rem;
            border-radius: 1.2rem;
            background: var(--glass-bg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .track-label,
        .status-label {
            margin: 0 0 0.35rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--panel-text-soft);
        }

        .track-title {
            margin: 0;
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--panel-text-strong);
        }

        .track-artist {
            margin: 0.25rem 0 0;
            font-size: 0.96rem;
            color: var(--panel-text-mid);
        }

        .status-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .status-card {
            padding: 0.85rem 0.95rem;
            border-radius: 1rem;
            background: var(--glass-bg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.44);
        }

        .status-value {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--panel-text-strong);
        }

        .hint {
            margin: 0.95rem 0 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--hint);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.18); opacity: 1; }
        }

        @media (max-width: 640px) {
            .frame {
                padding: 1rem;
            }

            .player {
                padding: 1.25rem 1rem 1rem;
            }

            .header {
                align-items: stretch;
                flex-direction: column;
            }

            .dial-area {
                grid-template-columns: 2.65rem 1fr 2.65rem;
            }

            .nav {
                width: 2.65rem;
                font-size: 1.2rem;
            }

            .visualizer-wrap {
                height: 11rem;
            }

            .status-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-theme="">
    <div class="sun" aria-hidden="true"></div>
    <div class="skyline" aria-hidden="true"></div>
    <main class="frame">
        <section class="player-shell" aria-label="Radio player">
            <div class="player">
                <header class="header">
                    <div class="eyebrow">
                        Radio player
                    </div>
                    <div class="badge" id="connection-badge">Loading stream</div>
                </header>

                <div class="dial-area">
                    <button class="nav" id="prev-station" type="button" aria-label="Previous station">&#x2039;</button>
                    <div class="station-pill">
                        <div class="station-dot" aria-hidden="true"></div>
                        <div>
                            <p class="station-name" id="station-name">Radio Sunbeat</p>
                            <p class="station-sub" id="station-sub">Deep house 24/7</p>
                        </div>
                    </div>
                    <button class="nav" id="next-station" type="button" aria-label="Next station">&#x203A;</button>
                </div>

                <div class="visualizer-wrap">
                    <canvas id="visualizer" aria-label="Audio spectrum visualizer"></canvas>
                </div>

                <div class="controls">
                    <button class="play" id="play-toggle" type="button">Start Listening</button>
                </div>

                <section class="meta">
                    <div class="track">
                        <p class="track-label">Now Playing</p>
                        <p class="track-title" id="track-title">Fetching live metadata...</p>
                        <p class="track-artist" id="track-artist">Radio Sunbeat</p>
                    </div>

                    <div class="status-row">
                        <div class="status-card">
                            <p class="status-label">Channel</p>
                            <p class="status-value" id="channel-index">01 / 01</p>
                        </div>
                        <div class="status-card">
                            <p class="status-label">Rhythm</p>
                            <p class="status-value" id="rhythm-state">Warming up</p>
                        </div>
                        <div class="status-card">
                            <p class="status-label">Spectrum</p>
                            <p class="status-value" id="spectrum-state">Standby</p>
                        </div>
                    </div>
                </section>

                <p class="hint">If playback is blocked, press Start Listening once to unlock audio.</p>
            </div>
        </section>
    </main>

    <audio id="radio-audio" preload="none" crossorigin="anonymous"></audio>

    <script>
        const stations = [

                visualizerHues: {

                },

            {

                rhythmLabels: ["Slow burn", "Easy shuffle", "Walking groove", "Juke joint"],
                visualizerHues: {

                },
                visualizerMotion: "muted",
            },
            {

              streamUrl: "/radio/api/stream/elvis",
              nowPlayingUrl: "/radio/api/now-playing/elvis",
              theme: "rocknroll",
              metadataFallbackArtist: "Elvis Presley",
              spectrumLabels: ["Back room", "Road house", "Stage lights", "Blazing high"],
              rhythmLabels: ["Ballad", "Backbeat", "Rockabilly drive", "Rattle and roll"],
              visualizerHues: {
                  low: 50,
                  mid: 275,
                  high: 180
              },
              visualizerMotion: "normal",
            }
        ];

        const audio = document.getElementById("radio-audio");
        const body = document.body;
        const playToggle = document.getElementById("play-toggle");
        const prevStationButton = document.getElementById("prev-station");
        const nextStationButton = document.getElementById("next-station");
        const connectionBadge = document.getElementById("connection-badge");
        const stationName = document.getElementById("station-name");
        const stationSub = document.getElementById("station-sub");
        const channelIndex = document.getElementById("channel-index");
        const trackTitle = document.getElementById("track-title");
        const trackArtist = document.getElementById("track-artist");
        const rhythmState = document.getElementById("rhythm-state");
        const spectrumState = document.getElementById("spectrum-state");
        const canvas = document.getElementById("visualizer");
        const ctx = canvas.getContext("2d");

        let stationIndex = 0;
        let audioContext;
        let analyser;
        let sourceNode;
        let frequencyData;
        let waveformData;
        let animationFrame = 0;
        let nowPlayingTimer = 0;
        let lastBeatAt = 0;
        let bpmEstimate = 0;
        let smoothedBass = 0;
        let smoothedTreble = 0;
        let smoothedFlux = 0;
        let rhythmSpeed = 0.35;
        let spectrumEnergy = 0;
        let isPlaying = false;
        let perceptualBands = [];
        let previousBandEnergies = [];
        let displayedRhythmLabel = "";
        let displayedSpectrumLabel = "";
        let lastRhythmLabelUpdateAt = 0;
        let lastSpectrumLabelUpdateAt = 0;

        const LABEL_DEBOUNCE_MS = 2000;

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function buildPerceptualBands(sampleRate, fftSize, binCount) {
            const nyquist = sampleRate / 2;
            const bandCount = 10;
            const minFrequency = 32;
            const maxFrequency = Math.min(16000, nyquist);
            const edges = [];

            for (let i = 0; i <= bandCount; i += 1) {
                const position = i / bandCount;
                const frequency = minFrequency * Math.pow(maxFrequency / minFrequency, position);
                edges.push(frequency);
            }

            return Array.from({ length: bandCount }, (_, index) => {
                const startFrequency = edges[index];
                const endFrequency = edges[index + 1];
                const startBin = clamp(Math.floor(startFrequency * fftSize / sampleRate), 0, binCount - 1);
                const endBin = clamp(Math.ceil(endFrequency * fftSize / sampleRate), startBin + 1, binCount);

                return {
                    startBin,
                    endBin,
                    centerFrequency: Math.sqrt(startFrequency * endFrequency),
                };
            });
        }

        function updateDebouncedLabel(element, nextLabel, displayedLabel, lastUpdatedAt, now) {
            if (!displayedLabel || nextLabel === displayedLabel) {
                if (element.textContent !== nextLabel) {
                    element.textContent = nextLabel;
                }

                return {
                    label: nextLabel,
                    timestamp: displayedLabel ? lastUpdatedAt : now,
                };
            }

            if (now - lastUpdatedAt >= LABEL_DEBOUNCE_MS) {
                element.textContent = nextLabel;
                return {
                    label: nextLabel,
                    timestamp: now,
                };
            }

            return {
                label: displayedLabel,
                timestamp: lastUpdatedAt,
            };
        }

        function getCurrentStation() {
            return stations[stationIndex];
        }

        function resizeCanvas() {
            const ratio = window.devicePixelRatio || 1;
            const { width, height } = canvas.getBoundingClientRect();
            canvas.width = Math.floor(width * ratio);
            canvas.height = Math.floor(height * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function ensureAudioGraph() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!sourceNode) {
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.82;
                sourceNode = audioContext.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                frequencyData = new Uint8Array(analyser.frequencyBinCount);
                waveformData = new Uint8Array(analyser.fftSize);
                perceptualBands = buildPerceptualBands(
                    audioContext.sampleRate,
                    analyser.fftSize,
                    analyser.frequencyBinCount
                );
                previousBandEnergies = new Array(perceptualBands.length).fill(0);
            }
        }

        function updateStationUi() {
            const station = getCurrentStation();
            body.dataset.theme = station.theme;
            document.title = station.name;
            stationName.textContent = station.name;
            stationSub.textContent = station.subtitle;
            channelIndex.textContent = `${String(stationIndex + 1).padStart(2, "0")} / ${String(stations.length).padStart(2, "0")}`;
            audio.src = station.streamUrl;
            connectionBadge.textContent = isPlaying ? "Ready to play" : "Loading stream";
            trackTitle.textContent = "Fetching live metadata...";
            trackArtist.textContent = station.name;
            rhythmState.textContent = station.rhythmLabels[0];
            spectrumState.textContent = station.spectrumLabels[0];
            displayedRhythmLabel = station.rhythmLabels[0];
            displayedSpectrumLabel = station.spectrumLabels[0];
            lastRhythmLabelUpdateAt = performance.now();
            lastSpectrumLabelUpdateAt = performance.now();
            smoothedBass = 0;
            smoothedTreble = 0;
            smoothedFlux = 0;
            rhythmSpeed = 0.35;
            spectrumEnergy = 0;
            previousBandEnergies = new Array(perceptualBands.length).fill(0);
        }

        async function fetchNowPlaying() {
            const station = getCurrentStation();

            try {
                const response = await fetch(station.nowPlayingUrl, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Metadata request failed: ${response.status}`);
                }

                const data = await response.json();
                let title = station.name;
                let artist = station.metadataFallbackArtist;

                if (station.id === "radiosunbeat") {
                    const entry = Array.isArray(data) ? data[0] : data?.data?.[0] || data?.[station.id];
                    const fullTitle = entry?.title || entry?.name || station.name;
                    const splitIndex = fullTitle.indexOf(" - ");
                    artist = splitIndex >= 0 ? fullTitle.slice(0, splitIndex) : station.metadataFallbackArtist;
                    title = splitIndex >= 0 ? fullTitle.slice(splitIndex + 3) : fullTitle;
                } else if (station.id === "topblues" || station.id === "elvis") {
                    title = data?.iName || data?.title || station.name;
                    artist = data?.iArtist || station.metadataFallbackArtist;
                }

                trackTitle.textContent = title;
                trackArtist.textContent = artist;
            } catch (error) {
                trackTitle.textContent = "Live metadata unavailable";
                trackArtist.textContent = "Stream is still available";
            }
        }

        function describeRhythm(speed, station) {
            if (speed < 0.2) return station.rhythmLabels[0];
            if (speed < 0.42) return station.rhythmLabels[1];
            if (speed < 0.68) return station.rhythmLabels[2];
            return station.rhythmLabels[3];
        }

        function describeSpectrum(energy, station) {
            if (energy < 0.22) return station.spectrumLabels[0];
            if (energy < 0.44) return station.spectrumLabels[1];
            if (energy < 0.7) return station.spectrumLabels[2];
            return station.spectrumLabels[3];
        }

        function drawVisualizer() {
            animationFrame = requestAnimationFrame(drawVisualizer);

            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const station = getCurrentStation();
            const palette = station.visualizerHues;
            const usesMutedVisualizerMotion = station.visualizerMotion === "muted";
            ctx.clearRect(0, 0, width, height);

            if (analyser && frequencyData && waveformData) {
                analyser.getByteFrequencyData(frequencyData);
                analyser.getByteTimeDomainData(waveformData);

                let weightedEnergy = 0;
                let totalWeight = 0;
                let bassEnergy = 0;
                let trebleEnergy = 0;
                let bassWeight = 0;
                let trebleWeight = 0;
                let occupiedBands = 0;
                let spectralFlux = 0;
                let fluxWeight = 0;
                let bassTransient = 0;
                const bandEnergies = [];

                for (let bandIndex = 0; bandIndex < perceptualBands.length; bandIndex += 1) {
                    const band = perceptualBands[bandIndex];
                    let bandEnergy = 0;
                    const bandSize = Math.max(1, band.endBin - band.startBin);

                    for (let i = band.startBin; i < band.endBin; i += 1) {
                        bandEnergy += frequencyData[i] / 255;
                    }

                    bandEnergy /= bandSize;

                    const perceptualWeight = 1 / (1 + Math.log2(1 + (band.centerFrequency / 240)));
                    weightedEnergy += bandEnergy * perceptualWeight;
                    totalWeight += perceptualWeight;
                    bandEnergies.push(bandEnergy);

                    if (bandEnergy > 0.18) {
                        occupiedBands += 1;
                    }

                    if (band.centerFrequency < 280) {
                        bassEnergy += bandEnergy * perceptualWeight;
                        bassWeight += perceptualWeight;
                    }

                    if (band.centerFrequency >= 2200) {
                        trebleEnergy += bandEnergy * perceptualWeight;
                        trebleWeight += perceptualWeight;
                    }

                    const previousEnergy = previousBandEnergies[bandIndex] || 0;
                    const positiveDelta = Math.max(0, bandEnergy - previousEnergy);
                    const bandFluxWeight = band.centerFrequency < 2000 ? 1.1 : 0.8;
                    spectralFlux += positiveDelta * bandFluxWeight;
                    fluxWeight += bandFluxWeight;

                    if (band.centerFrequency < 280) {
                        bassTransient += positiveDelta * perceptualWeight;
                    }
                }

                bassEnergy = bassWeight > 0 ? bassEnergy / bassWeight : 0;
                trebleEnergy = trebleWeight > 0 ? trebleEnergy / trebleWeight : 0;
                bassTransient = bassWeight > 0 ? bassTransient / bassWeight : 0;
                spectralFlux = fluxWeight > 0 ? spectralFlux / fluxWeight : 0;
                previousBandEnergies = bandEnergies;

                const bandOccupancy = occupiedBands / Math.max(1, perceptualBands.length);
                const rawSpectrumEnergy = totalWeight > 0 ? weightedEnergy / totalWeight : 0;
                const spectrumComposite = (
                    rawSpectrumEnergy * 0.58 +
                    bandOccupancy * 0.27 +
                    trebleEnergy * 0.15
                );
                const compressedSpectrum = Math.pow(clamp(spectrumComposite, 0, 1), 1.45);

                smoothedBass += (bassEnergy - smoothedBass) * 0.22;
                smoothedTreble += (trebleEnergy - smoothedTreble) * 0.16;
                smoothedFlux += (spectralFlux - smoothedFlux) * 0.18;
                spectrumEnergy += (compressedSpectrum - spectrumEnergy) * 0.12;

                const now = performance.now();
                const onsetStrength = Math.max(0, spectralFlux - smoothedFlux * 0.92);
                const beatThreshold = smoothedBass * 1.06 + 0.014;
                if (bassTransient > beatThreshold && onsetStrength > 0.012 && now - lastBeatAt > 220) {
                    const interval = now - lastBeatAt;
                    if (lastBeatAt > 0 && interval < 1400) {
                        const instantBpm = 60000 / interval;
                        bpmEstimate += (instantBpm - bpmEstimate) * 0.2;
                    }
                    lastBeatAt = now;
                }

                const normalizedBpm = Math.min(1, Math.max(0, (bpmEstimate - 70) / 90));
                const rhythmComposite = clamp(
                    onsetStrength * 8.5 +
                    bassTransient * 3.2 +
                    smoothedBass * 0.35 +
                    normalizedBpm * 0.25,
                    0,
                    1
                );
                rhythmSpeed += (rhythmComposite - rhythmSpeed) * 0.16;

                const hueA = palette.low - rhythmSpeed * (usesMutedVisualizerMotion ? 8 : 18);
                const hueB = palette.mid - rhythmSpeed * (usesMutedVisualizerMotion ? 18 : 52);
                const hueC = palette.high - rhythmSpeed * (usesMutedVisualizerMotion ? 10 : 34);

                const barWidth = width / frequencyData.length;
                for (let i = 0; i < frequencyData.length; i += 1) {
                    const value = frequencyData[i] / 255;
                    const barHeight = Math.max(6, value * height * 0.82);
                    const x = i * barWidth;
                    const y = height - barHeight;
                    const hue = hueA + ((hueC - hueA) * i / frequencyData.length);
                    ctx.fillStyle = `hsla(${hue}, 92%, ${68 - (i / frequencyData.length) * 16}%, 0.92)`;
                    ctx.fillRect(x, y, Math.max(2, barWidth - 1.4), barHeight);
                }

                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, `hsla(${hueA}, 100%, 78%, 0.95)`);
                gradient.addColorStop(0.5, `hsla(${hueB}, 96%, 74%, 0.95)`);
                gradient.addColorStop(1, `hsla(${hueC}, 92%, 78%, 0.95)`);

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = gradient;
                ctx.beginPath();

                for (let i = 0; i < waveformData.length; i += 1) {
                    const value = (waveformData[i] - 128) / 128;
                    const x = (i / (waveformData.length - 1)) * width;
                    const y = height * 0.52 + value * height * 0.16;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.stroke();

                ctx.fillStyle = `hsla(${hueB}, 100%, 86%, 0.16)`;
                ctx.fillRect(0, 0, width, height);

                const nextRhythmLabel = describeRhythm(rhythmSpeed, station);
                const nextSpectrumLabel = describeSpectrum(spectrumEnergy, station);
                const rhythmLabelState = updateDebouncedLabel(
                    rhythmState,
                    nextRhythmLabel,
                    displayedRhythmLabel,
                    lastRhythmLabelUpdateAt,
                    now
                );
                const spectrumLabelState = updateDebouncedLabel(
                    spectrumState,
                    nextSpectrumLabel,
                    displayedSpectrumLabel,
                    lastSpectrumLabelUpdateAt,
                    now
                );

                displayedRhythmLabel = rhythmLabelState.label;
                displayedSpectrumLabel = spectrumLabelState.label;
                lastRhythmLabelUpdateAt = rhythmLabelState.timestamp;
                lastSpectrumLabelUpdateAt = spectrumLabelState.timestamp;
            } else {
                const t = performance.now() * 0.001;
                const bars = 32;
                const baseHue = palette.low + Math.sin(t * 0.8) * (usesMutedVisualizerMotion ? 6 : 12);

                for (let i = 0; i < bars; i += 1) {
                    const x = (width / bars) * i;
                    const barHeight = 26 + (Math.sin(t * 2.2 + i * 0.48) * 0.5 + 0.5) * height * 0.42;
                    ctx.fillStyle = `hsla(${baseHue + i * 1.8}, 96%, 74%, 0.72)`;
                    ctx.fillRect(x, height - barHeight, Math.max(3, width / bars - 2), barHeight);
                }
            }
        }

        async function playCurrentStation() {
            const station = getCurrentStation();
            ensureAudioGraph();
            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }
            await audio.play();
            isPlaying = true;
            playToggle.textContent = "Pause";
            connectionBadge.textContent = "On air";
        }

        function pauseCurrentStation() {
            audio.pause();
            isPlaying = false;
            playToggle.textContent = "Start Listening";
            connectionBadge.textContent = "Paused";
        }

        async function togglePlayback() {
            try {
                if (isPlaying) {
                    pauseCurrentStation();
                } else {
                    await playCurrentStation();
                }
            } catch (error) {
                connectionBadge.textContent = "Playback blocked";
            }
        }

        async function cycleStation(direction) {
            stationIndex = (stationIndex + direction + stations.length) % stations.length;
            bpmEstimate = 0;
            lastBeatAt = 0;
            rhythmSpeed = 0.35;
            spectrumEnergy = 0;
            updateStationUi();
            await fetchNowPlaying();

            if (isPlaying) {
                try {
                    await playCurrentStation();
                } catch (error) {
                    connectionBadge.textContent = "Reconnect required";
                }
            }
        }

        playToggle.addEventListener("click", togglePlayback);
        prevStationButton.addEventListener("click", () => cycleStation(-1));
        nextStationButton.addEventListener("click", () => cycleStation(1));

        audio.addEventListener("playing", () => {
            connectionBadge.textContent = "On air";
            isPlaying = true;
            playToggle.textContent = "Pause";
        });

        audio.addEventListener("pause", () => {
            if (!audio.ended) {
                connectionBadge.textContent = "Paused";
            }
        });

        audio.addEventListener("waiting", () => {
            connectionBadge.textContent = "Buffering";
        });

        audio.addEventListener("error", () => {
            connectionBadge.textContent = "Stream unavailable";
        });

        window.addEventListener("resize", resizeCanvas);

        updateStationUi();
        resizeCanvas();
        drawVisualizer();
        fetchNowPlaying();
        nowPlayingTimer = window.setInterval(fetchNowPlaying, 30000);
    </script>
</body>
</html>
