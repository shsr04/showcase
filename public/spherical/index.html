<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicilia Sferica - Un Viaggio Culturale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-text: #f0f0f0;
            --color-accent: #d4af37;
            /* Gold */
            --color-glass: rgba(255, 255, 255, 0.1);
            --color-glass-border: rgba(255, 255, 255, 0.2);
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            overflow: hidden;
            /* Prevent body scroll, handle in panels */
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            /* Let clicks pass through to canvas */
        }

        .main-header {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .main-header h1 {
            font-family: var(--font-heading);
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--color-accent);
            margin-bottom: 0.5rem;
        }

        .main-header p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .instructions {
            font-size: 0.9rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* 3D Panel Styling */
        .panel-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            max-width: 90vw;
            height: 70vh;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) perspective(1000px) rotateX(10deg) scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 10;
        }

        .panel-container.active {
            opacity: 1;
            transform: translate(-50%, -50%) perspective(1000px) rotateX(0deg) scale(1);
            pointer-events: auto;
        }

        .panel-content {
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--color-glass-border);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            color: #fff;

            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: var(--color-accent) transparent;
        }

        .panel-content::-webkit-scrollbar {
            width: 6px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb {
            background-color: var(--color-accent);
            border-radius: 20px;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--color-text);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--color-accent);
        }

        #panel-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: var(--color-accent);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-glass-border);
            padding-bottom: 1rem;
        }

        #panel-body {
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 300;
        }

        #panel-body h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #ddd;
        }

        #panel-body p {
            margin-bottom: 1.5rem;
        }

        /* Cinematic Media Styling */
        .panel-media {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            position: relative;
            border: 1px solid var(--color-glass-border);
            background: #181818;
        }

        .panel-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: panZoom 20s infinite alternate linear;
        }

        .panel-media figcaption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 0.55rem 0.75rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0));
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.72rem;
            line-height: 1.4;
        }

        .panel-media figcaption a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration-color: rgba(212, 175, 55, 0.7);
        }

        .panel-media-fallback {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 2rem;
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.22), transparent 28%),
                linear-gradient(135deg, var(--fallback-color, #3f4f63), #101010 75%);
            color: rgba(255, 255, 255, 0.92);
            text-align: center;
            font-family: var(--font-heading);
            font-size: 1.55rem;
        }

        .panel-media.fallback figcaption {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0));
        }

        @keyframes panZoom {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.2) translate(-2%, -2%);
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <header class="main-header">
            <h1>Sicilia</h1>
            <p>Un'esplorazione sferica</p>
            <div class="instructions">Trascina per ruotare &bull; Clicca sui marcatori</div>
        </header>

        <!-- Panels will be injected here or managed via JS -->
        <div id="panel-container" class="panel-container">
            <div class="panel-content">
                <button class="close-btn" aria-label="Chiudi">&times;</button>
                <h2 id="panel-title">Titolo</h2>
                <div id="panel-body">Contenuto...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            sphereRadius: 5,
            cameraZ: 12,
            colors: {
                sphere: 0x111111,
                sphereWireframe: 0x333333,
                marker: 0xd4af37, // Gold
                markerHover: 0xffffff
            }
        };

        // --- State ---
        const state = {
            isPanelOpen: false,
            activeTopic: null
        };

        // --- Content Data (Formal Italian) ---
        // Helper to generate positions on a sphere (Fibonacci Sphere)
        function getFibonacciSpherePoints(samples, radius) {
            const points = [];
            const phi = Math.PI * (3 - Math.sqrt(5)); // Golden angle
            for (let i = 0; i < samples; i++) {
                const y = 1 - (i / (samples - 1)) * 2; // y goes from 1 to -1
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = phi * i;
                const x = Math.cos(theta) * radiusAtY;
                const z = Math.sin(theta) * radiusAtY;
                points.push(new THREE.Vector3(x, y, z).normalize());
            }
            return points;
        }

        const topicKeys = [
            'arte', 'storia', 'cucina', 'etna', 'valle_templi',
            'barocco', 'mercati', 'ceramica', 'vini', 'pupi',
            'archimede', 'gattopardo', 'feste', 'eolie', 'cioccolato', 'arabo_normanno'
        ];

        const positions = getFibonacciSpherePoints(topicKeys.length, 1);

        const COMMONS_FILE_ROOT = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
        const COMMONS_PAGE_ROOT = 'https://commons.wikimedia.org/wiki/File:';

        function getCommonsImageUrl(fileName, width) {
            return `${COMMONS_FILE_ROOT}${encodeURIComponent(fileName)}?width=${width}`;
        }

        function getProxiedImageUrl(fileName, width) {
            return `/spherical/api/image?file=${encodeURIComponent(fileName)}&width=${width}`;
        }

        function getCommonsPageUrl(fileName) {
            return `${COMMONS_PAGE_ROOT}${encodeURIComponent(fileName).replace(/%20/g, '_')}`;
        }

        function createCommonsMedia(fileName, alt, author, license, fallbackColor) {
            const fileUrl = getCommonsPageUrl(fileName);
            return {
                src: getCommonsImageUrl(fileName, 1200),
                thumbSrc: getProxiedImageUrl(fileName, 420),
                alt,
                fallbackColor,
                credit: `Foto: ${author}, <a href="${fileUrl}" target="_blank" rel="noreferrer">Wikimedia Commons</a>, ${license}`
            };
        }

        const TOPICS = {
            arte: {
                title: 'Arte e Letteratura',
                media: createCommonsMedia(
                    'The Greek theatre Taormina.jpg',
                    'Teatro greco di Taormina al tramonto',
                    'Solomonn Levi',
                    'CC BY-SA 4.0',
                    '#8f5f31'
                ),
                content: `
                    <p>La Sicilia è musa ispiratrice. Terra di Luigi Pirandello e Giovanni Verga, ha dato i natali al Verismo e ha ospitato la corte poetica di Federico II.</p>
                    <h3>Il Teatro</h3>
                    <p>I teatri greci di Siracusa e Taormina non sono rovine, ma palcoscenici vivi dove ancora oggi risuonano le tragedie di Eschilo e Euripide.</p>
                `
            },
            storia: {
                title: 'Storia Antica',
                media: createCommonsMedia(
                    'Temple of Concordia, Agrigento BW 2012-10-07 13-09-13.jpg',
                    'Tempio della Concordia nella Valle dei Templi',
                    'Berthold Werner',
                    'CC BY-SA 3.0',
                    '#6d6240'
                ),
                content: `
                    <p>Cuore del Mediterraneo, la Sicilia è stata fenicia, greca, romana, bizantina, araba, normanna, sveva, angioina, aragonese e spagnola.</p>
                    <h3>La Magna Grecia</h3>
                    <p>Siracusa fu la più grande città del mondo antico, rivale di Atene e Cartagine. I suoi tiranni dominarono i mari e promossero le arti.</p>
                `
            },
            cucina: {
                title: 'Gastronomia',
                media: createCommonsMedia(
                    'Cannoli sicily.jpg',
                    'Cannoli siciliani con crema di ricotta',
                    'AnnaVie',
                    'CC0',
                    '#8a4f3c'
                ),
                content: `
                    <p>Un trionfo di sapori: la dolcezza della ricotta, l'acidità degli agrumi, la sapidità del mare. Arancini, caponata e pasta alla Norma sono icone globali.</p>
                    <h3>I Dolci</h3>
                    <p>La pasticceria siciliana è un'arte barocca: Cassata, Cannoli e la Granita con brioche sono esperienze mistiche per il palato.</p>
                `
            },
            etna: {
                title: 'L\'Etna',
                media: createCommonsMedia(
                    'Erupting Volcano Mount Etna.jpg',
                    'Eruzione dell\'Etna vista dallo spazio',
                    'NASA',
                    'Public domain',
                    '#7b332b'
                ),
                content: `
                    <p>'A Muntagna', come la chiamano i catanesi, è il vulcano attivo più alto d'Europa. Patrimonio UNESCO, è una divinità capricciosa che fertilizza la terra e disegna il paesaggio.</p>
                    <h3>Mito e Natura</h3>
                    <p>Qui si dice che Efesto avesse la sua fucina. Oggi è un paradiso per escursionisti e amanti del vino, grazie ai vigneti che crescono sulle sue pendici laviche.</p>
                `
            },
            valle_templi: {
                title: 'Valle dei Templi',
                media: createCommonsMedia(
                    'Temple of Concordia (Agrigento) - Valle dei Templi, Agrigento, Sicily, Italy - 17 Oct. 2010.jpg',
                    'Il Tempio della Concordia ad Agrigento',
                    'Dennis G. Jarvis',
                    'CC BY-SA 2.0',
                    '#9a7a3d'
                ),
                content: `
                    <p>Ad Agrigento sorge una delle più straordinarie testimonianze dell'architettura dorica nel mondo. Il Tempio della Concordia è giunto a noi quasi intatto.</p>
                    <h3>Akragas</h3>
                    <p>Pindaro la definì "la più bella città dei mortali". Passeggiare tra questi giganti di pietra al tramonto è un viaggio indietro nel tempo di 2500 anni.</p>
                `
            },
            barocco: {
                title: 'Barocco Siciliano',
                media: createCommonsMedia(
                    'View of Noto, in Sicily - Cathedral and Chiesa di San Francesco d\'Assisi all\'Immacolata.jpg',
                    'Vista del centro barocco di Noto',
                    'Berthold Werner',
                    'CC BY-SA 4.0',
                    '#b18147'
                ),
                content: `
                    <p>Dopo il terremoto del 1693, il Val di Noto risorse in uno stile unico: esuberante, teatrale, dorato. Noto, Modica e Ragusa Ibla sono gioielli di pietra.</p>
                    <h3>Mascheroni e Putti</h3>
                    <p>Le facciate delle chiese e i balconi dei palazzi nobiliari sono animati da figure grottesche e floreali che sembrano danzare alla luce del sole.</p>
                `
            },
            mercati: {
                title: 'I Mercati Storici',
                media: createCommonsMedia(
                    'Ballarò Palermo.JPG',
                    'Mercato di Ballaro a Palermo',
                    'Effems',
                    'CC BY-SA 4.0',
                    '#735d37'
                ),
                content: `
                    <p>Vucciria, Ballarò, Il Capo a Palermo; la Pescheria a Catania. Luoghi dove il tempo si ferma e i sensi vengono assaliti da colori, odori e "abbanniate" (grida) dei venditori.</p>
                    <h3>Cibo di Strada</h3>
                    <p>È qui che nasce lo street food: panelle, crocchè, stigghiola e pani ca' meusa. Un rito quotidiano di socialità e gusto.</p>
                `
            },
            ceramica: {
                title: 'Ceramica di Caltagirone',
                media: createCommonsMedia(
                    'Anthropomorphic ceramic vase of Caltagirone.jpg',
                    'Vaso antropomorfo in ceramica di Caltagirone',
                    'Agatino Caruso',
                    'CC BY-SA 4.0',
                    '#2f6d87'
                ),
                content: `
                    <p>Da millenni a Caltagirone si modella l'argilla. Le sue scalinate maiolicate e le Teste di Moro sono simboli di un artigianato che si fa arte.</p>
                    <h3>Le Teste di Moro</h3>
                    <p>Dietro questi vasi iconici si cela una leggenda di amore, gelosia e vendetta risalente al periodo della dominazione araba.</p>
                `
            },
            vini: {
                title: 'Vini di Sicilia',
                media: createCommonsMedia(
                    'Etna Wine Agriturismo, Passopisciaro, Sicily, Italy. Field blend.jpg',
                    'Vigneto sulle pendici dell\'Etna',
                    'Neil Weightman',
                    'CC BY-SA 2.0',
                    '#516b37'
                ),
                content: `
                    <p>Terra di vigneti baciati dal sole. Dal robusto Nero d'Avola ai minerali bianchi dell'Etna, fino al dolce Marsala e al Passito di Pantelleria.</p>
                    <h3>Rinascimento Enologico</h3>
                    <p>Negli ultimi decenni la Sicilia si è affermata come eccellenza mondiale, valorizzando i vitigni autoctoni come il Grillo e il Frappato.</p>
                `
            },
            pupi: {
                title: 'I Pupi Siciliani',
                media: createCommonsMedia(
                    'Sicilian puppets.JPG',
                    'Pupi siciliani tradizionali',
                    'Wikimedia Commons contributor',
                    'CC BY-SA',
                    '#7a3f55'
                ),
                content: `
                    <p>L'Opera dei Pupi non è un semplice spettacolo di marionette, ma un rito epico che narra le gesta di Orlando e dei Paladini di Francia.</p>
                    <h3>Patrimonio Immateriale</h3>
                    <p>Riconosciuta dall'UNESCO, questa tradizione tramanda valori di onore, giustizia e amore attraverso l'abilità dei "pupari".</p>
                `
            },
            archimede: {
                title: 'Archimede',
                media: createCommonsMedia(
                    'Archimedes and Hiero of Syracuse.jpg',
                    'Archimede e Ierone di Siracusa',
                    'Sebastiano Ricci',
                    'Public domain',
                    '#4f6385'
                ),
                content: `
                    <p>Il più grande genio dell'antichità visse e morì a Siracusa. Matematico, fisico, inventore, difese la sua città dalle navi romane con i suoi specchi ustori.</p>
                    <h3>Eureka!</h3>
                    <p>La sua eredità permea ancora la scienza moderna. Siracusa lo ricorda con orgoglio come il suo figlio più illustre.</p>
                `
            },
            gattopardo: {
                title: 'Il Gattopardo',
                media: createCommonsMedia(
                    'Il gattopardo.jpg',
                    'Scena del film Il Gattopardo',
                    'Luchino Visconti',
                    'Public domain in Italy',
                    '#775148'
                ),
                content: `
                    <p>Il capolavoro di Tomasi di Lampedusa è l'affresco definitivo della Sicilia nel momento del passaggio dai Borbone all'Italia.</p>
                    <h3>"Tutto cambi..."</h3>
                    <p>"Se vogliamo che tutto rimanga come è, bisogna che tutto cambi". Una frase che racchiude l'anima contraddittoria e affascinante dell'isola.</p>
                `
            },
            feste: {
                title: 'Feste Religiose',
                media: createCommonsMedia(
                    'Festa di Sant\'Agata (Catania) 03 02 2026 188.jpg',
                    'Corteo processionale della Festa di Sant\'Agata a Catania',
                    'Sailko',
                    'CC BY-SA 4.0',
                    '#7d2f2f'
                ),
                content: `
                    <p>La devozione in Sicilia è spettacolo. Il Festino di Santa Rosalia a Palermo e la Festa di Sant'Agata a Catania sono eventi grandiosi che paralizzano le città.</p>
                    <h3>Folklore e Fede</h3>
                    <p>Processioni, "candelore", fuochi d'artificio e bande musicali creano un'atmosfera di misticismo collettivo unica al mondo.</p>
                `
            },
            eolie: {
                title: 'Le Isole Eolie',
                media: createCommonsMedia(
                    'Stromboli Island.jpg',
                    'Isola di Stromboli nelle Eolie',
                    'Michela Mariotti',
                    'CC BY-SA 4.0',
                    '#275e73'
                ),
                content: `
                    <p>Sette perle vulcaniche nel Tirreno. Stromboli e Vulcano offrono spettacoli di fuoco, mentre Panarea e Salina incantano con la loro mondanità e natura.</p>
                    <h3>Patrimonio UNESCO</h3>
                    <p>Un paradiso per geologi e turisti, dove il mare blu cobalto incontra la roccia nera lavica.</p>
                `
            },
            cioccolato: {
                title: 'Cioccolato di Modica',
                media: createCommonsMedia(
                    'Chocolate Bar.jpg',
                    'Barretta di cioccolato',
                    'Fatimah Bello',
                    'CC BY-SA 4.0',
                    '#5a3528'
                ),
                content: `
                    <p>Un cioccolato unico, lavorato a freddo secondo un'antica ricetta azteca portata dagli spagnoli. Granuloso, aromatico, puro.</p>
                    <h3>Tradizione Dolciaria</h3>
                    <p>Non viene concato, mantenendo integri i cristalli di zucchero. Un'esperienza sensoriale diversa da qualsiasi altro cioccolato.</p>
                `
            },
            arabo_normanno: {
                title: 'Palermo Arabo-Normanna',
                media: createCommonsMedia(
                    'Palermo - Mosaics of Palatine Chapel.jpg',
                    'Mosaici della Cappella Palatina a Palermo',
                    'Josep Renalias',
                    'CC BY-SA 3.0',
                    '#a47b2d'
                ),
                content: `
                    <p>Il Palazzo dei Normanni, la Cappella Palatina, la Zisa. Monumenti che testimoniano una convivenza pacifica e feconda tra culture diverse.</p>
                    <h3>Sincretismo</h3>
                    <p>Cupole rosse islamiche, mosaici bizantini e strutture romaniche si fondono in uno stile che rappresenta l'apice della civiltà medievale siciliana.</p>
                `
            }
        };

        // Assign positions to topics
        topicKeys.forEach((key, index) => {
            TOPICS[key].id = key;
            TOPICS[key].position = positions[index];
        });

        // --- Initialization ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.sphere); // Dark background matching CSS
        scene.fog = new THREE.FogExp2(CONFIG.colors.sphere, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = CONFIG.cameraZ;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.minPolarAngle = Math.PI / 4;
        controls.maxPolarAngle = Math.PI * 3 / 4;
        controls.autoRotate = true; // Enable auto-rotation for better discovery
        controls.autoRotateSpeed = 0.5;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(CONFIG.colors.accent, 2, 20);
        pointLight.position.set(-5, -2, 5);
        scene.add(pointLight);

        // --- Objects ---

        // 1. The Globe
        const sphereGeometry = new THREE.SphereGeometry(CONFIG.sphereRadius, 64, 64);

        const sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000,
            roughness: 0.4,
            metalness: 0.8,
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);

        // Wireframe overlay
        const wireframeGeo = new THREE.WireframeGeometry(sphereGeometry);
        const wireframeMat = new THREE.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.3 });
        const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
        sphere.add(wireframe);

        // 2. Markers (The "Sides" / Topics)
        const markersGroup = new THREE.Group();
        sphere.add(markersGroup);

        const textureLoader = new THREE.TextureLoader();

        const markerGeometry = new THREE.RingGeometry(0.6, 0.65, 32); // Slightly larger frame
        const markerMaterial = new THREE.MeshBasicMaterial({
            color: CONFIG.colors.marker,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8
        });

        function drawSky(ctx, topColor, bottomColor) {
            const sky = ctx.createLinearGradient(0, 0, 0, 512);
            sky.addColorStop(0, topColor);
            sky.addColorStop(0.62, bottomColor);
            sky.addColorStop(1, '#151515');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, 512, 512);
        }

        function drawSun(ctx, x = 392, y = 116, radius = 46) {
            const glow = ctx.createRadialGradient(x, y, 8, x, y, radius * 2.2);
            glow.addColorStop(0, 'rgba(255, 230, 145, 0.95)');
            glow.addColorStop(1, 'rgba(255, 180, 70, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, radius * 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f7d36b';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSea(ctx, y = 350, color = '#245f78') {
            ctx.fillStyle = color;
            ctx.fillRect(0, y, 512, 512 - y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.lineWidth = 5;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(36, y + 24 + i * 28);
                ctx.bezierCurveTo(142, y + 2 + i * 28, 220, y + 48 + i * 28, 332, y + 20 + i * 28);
                ctx.bezierCurveTo(392, y + 6 + i * 28, 438, y + 18 + i * 28, 492, y + 6 + i * 28);
                ctx.stroke();
            }
        }

        function drawTemple(ctx) {
            ctx.fillStyle = '#cda465';
            ctx.fillRect(104, 324, 304, 30);
            ctx.fillRect(82, 354, 348, 38);
            ctx.fillStyle = '#e6c17d';
            ctx.beginPath();
            ctx.moveTo(76, 298);
            ctx.lineTo(436, 298);
            ctx.lineTo(392, 242);
            ctx.lineTo(120, 242);
            ctx.closePath();
            ctx.fill();
            for (let x = 122; x <= 354; x += 58) {
                ctx.fillRect(x, 292, 32, 76);
            }
        }

        function drawVolcano(ctx) {
            ctx.fillStyle = '#342922';
            ctx.beginPath();
            ctx.moveTo(54, 396);
            ctx.lineTo(222, 164);
            ctx.lineTo(288, 164);
            ctx.lineTo(468, 396);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ff7145';
            ctx.beginPath();
            ctx.moveTo(232, 168);
            ctx.lineTo(278, 168);
            ctx.lineTo(256, 218);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ef4d2f';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(256, 218);
            ctx.bezierCurveTo(248, 268, 294, 304, 276, 384);
            ctx.stroke();
        }

        function drawFood(ctx) {
            ctx.fillStyle = '#f3d8a2';
            ctx.beginPath();
            ctx.ellipse(256, 308, 178, 88, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#c18439';
            ctx.lineWidth = 16;
            ctx.stroke();
            ctx.fillStyle = '#7a2d28';
            for (let i = 0; i < 11; i++) {
                ctx.beginPath();
                ctx.arc(132 + i * 24, 292 + Math.sin(i) * 24, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#fff1cc';
            ctx.beginPath();
            ctx.ellipse(332, 224, 96, 38, -0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#9a5b2d';
            ctx.lineWidth = 12;
            ctx.stroke();
        }

        function drawCathedral(ctx) {
            ctx.fillStyle = '#c99959';
            ctx.fillRect(112, 226, 288, 166);
            ctx.fillStyle = '#dfbb77';
            ctx.fillRect(148, 184, 74, 208);
            ctx.fillRect(290, 184, 74, 208);
            ctx.beginPath();
            ctx.moveTo(256, 138);
            ctx.lineTo(408, 226);
            ctx.lineTo(104, 226);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#3a2a28';
            ctx.fillRect(228, 304, 56, 88);
            ctx.fillRect(164, 236, 40, 52);
            ctx.fillRect(308, 236, 40, 52);
        }

        function drawMarket(ctx) {
            ctx.fillStyle = '#b93636';
            ctx.fillRect(54, 188, 404, 90);
            ctx.fillStyle = '#f3cf72';
            for (let x = 54; x < 458; x += 58) {
                ctx.beginPath();
                ctx.moveTo(x, 188);
                ctx.lineTo(x + 29, 278);
                ctx.lineTo(x + 58, 188);
                ctx.closePath();
                ctx.fill();
            }
            ctx.fillStyle = '#6b3d23';
            ctx.fillRect(84, 278, 344, 120);
            ['#d8482f', '#f0bd42', '#4d8b45'].forEach((color, row) => {
                ctx.fillStyle = color;
                for (let i = 0; i < 7; i++) {
                    ctx.beginPath();
                    ctx.arc(124 + i * 44, 316 + row * 30, 14, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawCeramic(ctx) {
            ctx.fillStyle = '#e8e0c7';
            ctx.beginPath();
            ctx.ellipse(256, 278, 96, 136, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1d6f92';
            ctx.lineWidth = 14;
            ctx.stroke();
            ctx.strokeStyle = '#d1a82f';
            ctx.lineWidth = 8;
            for (let y = 216; y <= 332; y += 36) {
                ctx.beginPath();
                ctx.moveTo(178, y);
                ctx.bezierCurveTo(230, y - 24, 282, y + 24, 334, y);
                ctx.stroke();
            }
        }

        function drawVineyard(ctx) {
            ctx.strokeStyle = '#3b5d2e';
            ctx.lineWidth = 8;
            for (let x = 64; x <= 448; x += 54) {
                ctx.beginPath();
                ctx.moveTo(x, 392);
                ctx.lineTo(256, 204);
                ctx.stroke();
            }
            ctx.fillStyle = '#5d2f67';
            for (let i = 0; i < 28; i++) {
                ctx.beginPath();
                ctx.arc(104 + (i % 7) * 50, 314 + Math.floor(i / 7) * 22, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPuppet(ctx) {
            ctx.fillStyle = '#cfd4df';
            ctx.fillRect(198, 156, 116, 178);
            ctx.fillStyle = '#7f263d';
            ctx.fillRect(178, 246, 156, 146);
            ctx.fillStyle = '#d6b446';
            ctx.fillRect(190, 170, 92, 22);
            ctx.fillRect(230, 132, 62, 44);
            ctx.strokeStyle = '#d6b446';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(336, 168);
            ctx.lineTo(398, 104);
            ctx.stroke();
            ctx.fillStyle = '#b8c0cf';
            ctx.fillRect(360, 96, 24, 210);
        }

        function drawArchimedes(ctx) {
            ctx.strokeStyle = '#d9c07a';
            ctx.lineWidth = 6;
            for (let r = 46; r <= 150; r += 34) {
                ctx.beginPath();
                ctx.arc(256, 260, r, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(128, 352);
            ctx.lineTo(384, 168);
            ctx.moveTo(138, 168);
            ctx.lineTo(372, 352);
            ctx.stroke();
            ctx.fillStyle = '#eee1b2';
            ctx.fillRect(138, 356, 236, 24);
        }

        function drawBallroom(ctx) {
            ctx.fillStyle = '#d5b36c';
            for (let x = 92; x <= 420; x += 82) {
                ctx.fillRect(x, 132, 28, 260);
            }
            ctx.fillStyle = '#7b3541';
            ctx.beginPath();
            ctx.ellipse(220, 316, 46, 94, -0.24, 0, Math.PI * 2);
            ctx.ellipse(306, 318, 42, 90, 0.24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f0d4a8';
            ctx.beginPath();
            ctx.arc(222, 202, 24, 0, Math.PI * 2);
            ctx.arc(306, 204, 24, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawProcession(ctx) {
            ctx.fillStyle = '#f2d074';
            ctx.fillRect(222, 124, 68, 156);
            ctx.fillStyle = '#b12f35';
            ctx.fillRect(166, 278, 180, 92);
            ctx.fillStyle = '#ece6d5';
            for (let i = 0; i < 9; i++) {
                ctx.beginPath();
                ctx.arc(92 + i * 42, 384, 17, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawIslands(ctx) {
            drawSea(ctx, 274, '#1e6682');
            ctx.fillStyle = '#263324';
            [[126, 318, 88], [260, 290, 116], [398, 332, 78]].forEach(([x, y, w]) => {
                ctx.beginPath();
                ctx.ellipse(x, y, w, 34, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.fillStyle = '#4b332a';
            ctx.beginPath();
            ctx.moveTo(232, 286);
            ctx.lineTo(276, 184);
            ctx.lineTo(326, 286);
            ctx.closePath();
            ctx.fill();
        }

        function drawChocolate(ctx) {
            ctx.save();
            ctx.translate(256, 282);
            ctx.rotate(-0.18);
            ctx.fillStyle = '#4b241a';
            ctx.fillRect(-142, -88, 284, 176);
            ctx.strokeStyle = '#7a4632';
            ctx.lineWidth = 10;
            for (let x = -70; x <= 70; x += 70) {
                ctx.beginPath();
                ctx.moveTo(x, -88);
                ctx.lineTo(x, 88);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(-142, 0);
            ctx.lineTo(142, 0);
            ctx.stroke();
            ctx.restore();
        }

        function drawMosaics(ctx) {
            const colors = ['#c99a32', '#9d6c2d', '#244e6b', '#d7bd68'];
            for (let y = 120; y < 390; y += 38) {
                for (let x = 96; x < 420; x += 38) {
                    ctx.fillStyle = colors[(x + y) % colors.length];
                    ctx.fillRect(x + 2, y + 2, 32, 32);
                }
            }
            ctx.fillStyle = 'rgba(255, 241, 184, 0.88)';
            ctx.beginPath();
            ctx.arc(256, 246, 64, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMarkerScene(ctx, topic) {
            const color = topic.media?.fallbackColor || '#4b5563';
            drawSky(ctx, color, '#252525');
            drawSun(ctx);

            const sceneDrawers = {
                arte: drawTemple,
                storia: drawTemple,
                cucina: drawFood,
                etna: drawVolcano,
                valle_templi: drawTemple,
                barocco: drawCathedral,
                mercati: drawMarket,
                ceramica: drawCeramic,
                vini: drawVineyard,
                pupi: drawPuppet,
                archimede: drawArchimedes,
                gattopardo: drawBallroom,
                feste: drawProcession,
                eolie: drawIslands,
                cioccolato: drawChocolate,
                arabo_normanno: drawMosaics
            };

            const drawScene = sceneDrawers[topic.id] || drawTemple;
            drawScene(ctx);
        }

        function createMarkerTexture(topic) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;

            const ctx = canvas.getContext('2d');
            drawMarkerScene(ctx, topic);

            ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(256, 256, 210, 0, Math.PI * 2);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.needsUpdate = true;
            return texture;
        }

        function loadMarkerTexture(topic, material) {
            const imageUrl = topic.media?.thumbSrc;
            if (!imageUrl) return;

            fetch(imageUrl, { cache: 'force-cache' })
                .then(response => {
                    if (!response.ok) throw new Error('Marker thumbnail unavailable');
                    return response.blob();
                })
                .then(blob => {
                    const objectUrl = URL.createObjectURL(blob);
                    textureLoader.load(
                        objectUrl,
                        loadedTexture => {
                            URL.revokeObjectURL(objectUrl);
                            loadedTexture.colorSpace = THREE.SRGBColorSpace;
                            loadedTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            material.map.dispose();
                            material.map = loadedTexture;
                            material.needsUpdate = true;
                        },
                        undefined,
                        () => {
                            URL.revokeObjectURL(objectUrl);
                            material.needsUpdate = true;
                        }
                    );
                })
                .catch(() => {
                    material.needsUpdate = true;
                });
        }

        // Helper to add markers
        function addMarker(topicKey) {
            const topic = TOPICS[topicKey];

            // Group for the marker (Frame + Image)
            const markerGroup = new THREE.Group();

            // Position on sphere surface
            const pos = topic.position.clone().multiplyScalar(CONFIG.sphereRadius + 0.05);
            markerGroup.position.copy(pos);
            markerGroup.lookAt(pos.clone().multiplyScalar(2)); // Face outwards

            // 1. The Image Patch
            const imageGeo = new THREE.CircleGeometry(0.6, 32);
            const texture = createMarkerTexture(topic);

            const imageMat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
            });
            loadMarkerTexture(topic, imageMat);

            const imageMesh = new THREE.Mesh(imageGeo, imageMat);
            markerGroup.add(imageMesh);

            // 2. The Gold Frame
            const frameMesh = new THREE.Mesh(markerGeometry, markerMaterial.clone());
            frameMesh.position.z = 0.01; // Slightly in front to avoid z-fighting
            markerGroup.add(frameMesh);

            // Store metadata on the group so raycaster finds it
            // Raycaster intersects meshes, so we need to bubble up or attach data to meshes
            imageMesh.userData = { isMarker: true, topicId: topicKey, parentGroup: markerGroup };
            frameMesh.userData = { isMarker: true, topicId: topicKey, parentGroup: markerGroup };

            markersGroup.add(markerGroup);
        }

        topicKeys.forEach(addMarker);


        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Hover effect
            if (!state.isPanelOpen) {
                raycaster.setFromCamera(mouse, camera);

                // Intersect the sphere (which includes markers as children)
                // This ensures we detect if the sphere blocks a marker
                const intersects = raycaster.intersectObject(sphere, true);

                // Filter out non-Mesh objects (like the wireframe LineSegments)
                const meshIntersects = intersects.filter(hit => hit.object.isMesh);

                let hoveredMarkerGroup = null;

                if (meshIntersects.length > 0) {
                    const firstHit = meshIntersects[0];
                    // If the first thing we hit is a marker, then it's visible
                    if (firstHit.object.userData.isMarker) {
                        hoveredMarkerGroup = firstHit.object.userData.parentGroup;
                    }
                    // If the first thing is the sphere, then any marker behind it is occluded
                }

                // Reset all scales
                markersGroup.children.forEach(group => {
                    group.scale.setScalar(1.0);
                });

                // Apply hover
                if (hoveredMarkerGroup) {
                    hoveredMarkerGroup.scale.setScalar(1.2);
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'default';
                }
            }
        }

        function onMouseClick(event) {
            if (state.isPanelOpen) return; // Ignore clicks on sphere if panel is open

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(sphere, true);
            const meshIntersects = intersects.filter(hit => hit.object.isMesh);

            if (meshIntersects.length > 0) {
                const firstHit = meshIntersects[0];
                if (firstHit.object.userData.isMarker) {
                    const topicId = firstHit.object.userData.topicId;
                    if (topicId) {
                        openPanel(topicId);
                    }
                }
            }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onMouseClick);
        window.addEventListener('resize', onWindowResize);

        // --- Panel Logic ---
        const panelContainer = document.getElementById('panel-container');
        const closeBtn = document.querySelector('.close-btn');
        const panelTitle = document.getElementById('panel-title');
        const panelBody = document.getElementById('panel-body');

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function createPanelMediaHtml(topic) {
            const media = topic.media;
            if (!media) return '';

            return `
                <figure class="panel-media" data-fallback-color="${escapeHtml(media.fallbackColor)}" data-fallback-title="${escapeHtml(topic.title)}">
                    <img src="${escapeHtml(media.src)}" alt="${escapeHtml(media.alt)}">
                    <figcaption>${media.credit}</figcaption>
                </figure>
            `;
        }

        function showPanelMediaFallback(mediaElement) {
            if (!mediaElement || mediaElement.classList.contains('fallback')) return;

            const image = mediaElement.querySelector('img');
            if (image) image.remove();

            const fallback = document.createElement('div');
            fallback.className = 'panel-media-fallback';
            fallback.style.setProperty('--fallback-color', mediaElement.dataset.fallbackColor || '#4b5563');
            fallback.textContent = mediaElement.dataset.fallbackTitle || 'Sicilia';

            mediaElement.classList.add('fallback');
            mediaElement.prepend(fallback);
        }

        function bindPanelImageFallback() {
            const panelImage = panelBody.querySelector('.panel-media img');
            if (!panelImage) return;

            panelImage.addEventListener('error', () => {
                showPanelMediaFallback(panelImage.closest('.panel-media'));
            }, { once: true });

            if (panelImage.complete && panelImage.naturalWidth === 0) {
                showPanelMediaFallback(panelImage.closest('.panel-media'));
            }
        }

        function openPanel(topicId) {
            state.isPanelOpen = true;
            state.activeTopic = topicId;

            const topic = TOPICS[topicId];

            // Update Content
            panelTitle.textContent = topic.title;

            // Inject Media + Content
            const mediaHtml = createPanelMediaHtml(topic);
            panelBody.innerHTML = mediaHtml + topic.content;
            bindPanelImageFallback();

            // Animate Camera/Sphere to center the marker
            // We want the marker to face the camera (0,0,1)
            // So we need to rotate the sphere so that the marker's local position aligns with world Z

            // Simple approach: Rotate sphere
            // Better approach for OrbitControls: Move camera?
            // Let's just freeze controls and show panel.
            // Ideally we rotate the sphere to present the content.

            const targetPos = topic.position.clone().multiplyScalar(CONFIG.cameraZ); // Where camera should be relative to sphere

            // For simplicity with OrbitControls, let's just show the panel.
            // The user has already clicked it, so it's likely visible.

            panelContainer.classList.add('active');
            controls.enabled = false; // Disable rotation while reading
            controls.autoRotate = false; // Stop auto-rotation
        }

        function closePanel(event) {
            event.stopPropagation();
            state.isPanelOpen = false;
            state.activeTopic = null;
            panelContainer.classList.remove('active');
            controls.enabled = true;
            controls.autoRotate = true; // Resume auto-rotation
        }

        closeBtn.addEventListener('click', closePanel);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Gentle rotation if idle?
            if (!state.isPanelOpen) {
                sphere.rotation.y += 0.0005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
