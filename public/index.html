<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exotic Minigames | Bioluminescent Jungle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    
    <div class="overlay"></div>

    <main class="container">
        <header class="hero">
            <h1 class="glitch" data-text="NEON JUNGLE">NEON JUNGLE</h1>
            <p class="subtitle">Explore the digital wilderness</p>
        </header>

        <div class="grid">
            <a href="./glider" class="card">
                <div class="card-content">
                    <div class="card-icon">I</div>
                    <h3>Voxel Glider</h3>
                    <p>Navigate the voxel labyrinth.</p>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="./cyberflight" class="card">
                <div class="card-content">
                    <div class="card-icon">II</div>
                    <h3>Cyberflight</h3>
                    <p>Experience the futuristic megacity.</p>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="./spherical" class="card">
                <div class="card-content">
                    <div class="card-icon">III</div>
                    <h3>Spherical</h3>
                    <p>Explore a topic in spherical space.</p>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="./aether" class="card">
                <div class="card-content">
                    <div class="card-icon">IV</div>
                    <h3>Aether Protocol</h3>
                    <p>Send secret messages over the air.</p>
                </div>
                <div class="card-glow"></div>
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
