<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim Zone: Economic Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <header>
            <h1>SIM ZONE</h1>
            <div id="stats-bar">
                <div class="stat-item">Day: <span id="day-display">0</span></div>
                <div class="stat-item">Pop: <span id="pop-display">0</span></div>
                <div class="stat-item">Avg Wealth: $<span id="wealth-display">0</span></div>
                <div class="stat-item">Homeless: <span id="homeless-display">0%</span></div>
            </div>
        </header>

        <main>
            <div id="canvas-container">
                <canvas id="sim-canvas"></canvas>
            </div>

            <aside id="controls">
                <h2>Controls</h2>
                <div class="control-group">
                    <label>Simulation Speed</label>
                    <input type="range" id="speed-slider" min="0" max="5" value="1">
                </div>
                <div class="control-group">
                    <button id="pause-btn">Pause</button>
                    <button id="step-btn">Step Day</button>
                </div>

                <hr>

                <h2>Policies</h2>
                <div class="control-group">
                    <label>Income Tax Rate (%)</label>
                    <input type="number" id="tax-rate-input" value="20" min="0" max="100">
                </div>
                <div class="control-group">
                    <label>Basic Income ($/day)</label>
                    <input type="number" id="ubi-input" value="0" min="0">
                </div>

                <div id="inspector">
                    <h3>Inspector</h3>
                    <div id="inspector-content">
                        Select a citizen or zone.
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
